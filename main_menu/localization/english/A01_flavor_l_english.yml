l_english:
 flavor_A01.2.title: "Trimpuh For Godhand"
 flavor_A01.2.desc: "After long centuries of humiliation, our ancient shame is finally extinguished. The black mark upon our legacy, that being the loss of our sacred homeland, has been washed away in a glorious victory. Godhand, queen of all provinces in The-Empire-That-Was and cradle of Moran greatness, returns to our possession. With our glory restored, the Great White Mountains will serve once more as our shield, securing our northern flank and affirming what all the world must now remember: the Empire lives again.\n\nIn Moras, preparations now begin for a triumph unmatched in living or unliving memory. For seven nights the streets shall thunder with procession: legions marching ingleaming ranks, war trophies paraded throughout the under and over cities, chanting citizens will shower the victors with flowers both fresh and embalmed. The Emperor, crowned in laurel like of old, shall ride at the head of it all, acclaimed by all past and present Senators, the undead patriciate, and the cheering masses. A week of feasts, games, and spectacle awaits, sealing this victory not only in history, but in the hearts of this Eternal People."
 flavor_A01.2.a: "Reunited at last."
 flavor_A01.2.fullfilment.tt: "Due to taking [ShowRegionName('godhand_region')] within 50 years, the modifier is made permanent."
 
 flavor_A01.1.title: "The Great Amphitheatrum"
 flavor_A01.1.desc: "Established Milenium ago at the height Of-The-Empire-That-Was, the Great Amphitheatrum stands as the heart of in the City of Moras, dominating the skyline. Having fallen to dilapidation throughout the years, it was  restored to its former glory after the day of Day of Apokatastasis. Within its walls, the citizens of Moras gather for organized combat and public spectacle, continuing traditions preserved from their mortal past. Gladiators range from veterans bearing centuries of scars or the living. Gladiators fight for honor, memory, and the entertainment of the undying masses. No roar is so thunderous as that of an audiences who has cheered for a hundread years and will cheer for a thousand more."
 flavor_A01.1.a: "Interesting"

 flavor_A01.3.title: "Birth of the Undercity"
 flavor_A01.3.desc: "For decades, [ShowLocationName('eternalcity1')] has swollen under the crushing weight of its own grandeur. Entire districts have been claimed as estates, the occupatants sealing them behind gates of marble and bronze, monuments to 'greatness' taking up immense amounts of phyiscal space. Meanwhile, the common quarters have buckled with overcrowding: merchants crammed into alleys too narrow for their carts, the living and undead alike queuing for space.\n\nBeneath Moran’s bustling streets in that twisting maze of catacombs, tombs, dungeons, and ruins a migration unfolded. At first, it was a trickle: a lone scholar in a tomb here, a retired administrator in a collapsed palace wing there. Over decades, the trickle became a measured tide. Claiming niches in the crumbling chambers, setting up spartan homes amidst the dust.\n\nSometimes, they stumbled upon dwellings they themselves had inhabited in life, finding in the shadows a familiarity both eerie and oddly comforting. In these subterranean depths, Moran’s overcrowding above seems distant, noisy memory, and has become almost a new city of its own, The Undercity. \n\nNow the representatives from these communities have recently approached the government of the [ROOT.GetCountry.GetFlavorRank], requesting funding the expansion of the Undercity to accommodate the needs of their communities."
 flavor_A01.3.a: "Direct state funds to the Undercity."
 flavor_A01.3.a.tt: "Owned pops in [ShowLocationName('eternalcity1')] gain satisfaction."
 flavor_A01.3.b: "Turn a blind eye and do nothing."

 flavor_A01.4.title: "Beneath the Bones of History"
 flavor_A01.4.desc: "The Undercity has pushed deeper into the earth than anyone had intended or imagined . Driven by the needs of the populace, excavation teams broke through to stone older than the Empire-That-Was, older than recorded memory itself, and found structures no Human hand could have crafted.\n\nVast halls of alien geometry stretch into the dark, their walls carved with patterns that feel almost alive. Bridges cross bottomless pits where no draft should exist. Pillars coil like roots of a petrified forest. None of it matches any recorded forebearer masonry, but is something different entirely.\n\nPushing deeper, teams have found caverns untouched by pick or spell. Smooth, enormous chambers, half-natural, half-shaped by something that did not carve but looks to have grown the stone into place. No sense of it's purpose can be gleaned, nor trace of the builders remains. Yet many explorers swear to seeing faint echoes lingering there, like there are memories trapped in the walls."
 flavor_A01.4.a: "Seal the deepest breaches. Some secrets should remain hidden."

 flavor_A01.5.title: "Entity 3: Moras"
 flavor_A01.5.desc: "From the Journal of Destronius:\n\nWhile Moras is a city of the dead, it is not a dead city. Dawn will find avenues already thrumming with activity: merchants of warm flesh haggling beside silent clerks, spectral couriers gliding through colonnades, and sepulchral nobles passing in lacquered litters shaded by curtains of silk. The air is a mingling of incense, dust, and the sharp tang of alchemical salts.\n\nI wandered first among the upper terraces, where great mansions perch like predatory birds above the streets. Their owners have raised whole districts into private redoubts, hiding behind veils of colored marble and ancestral wards. From there, one can look down upon the teeming city as though observing a painted scene: the living moving with bright haste, the dead with patient certainty...\n\n...And after seven days wandering the city, I confess I was eager to depart. The city is magnificent, dizzying in scale, intoxicating in its pageantry, but makes for poor nourishment. More besides, there was still much in the world I had yet to see, and wished to discover. As the years had passed over me in the dark. Still, before I quit Moras, one last errand compelled me:"
 flavor_A01.5.a: "In the nobles’ halls of power"
 flavor_A01.5.b: "To make a prayer at the temple"
 flavor_A01.5.c: "An errand in the marketplace"
 flavor_A01.5.d: "In the crowded alleys"
 
 flavor_A01.6.title: "Eternity's End"
 flavor_A01.6.desc: "Moras glitters like a diadem upon the brow of the world, stones flushed with bronze and iron, colonnades gleaming with lapis and verdigris, roofs lacquered in the deep colors of processional dyes. Through its avenues move the living and the dead, each bearing witness to a grandeur that, in its outward form, exceeds all others like it beneath the sun. Yet it has been observed that splendor can endure long after strength has ebbed away.\n\nPeace was granted to crusader kings and wandering free companies through silver scarce possessed and promises whose fulfillment fate may question. Beneath the rites, the foundations themselves tremble. The highborn have raised new estates within the old, fencing off wide quarters as their private sanctuaries. Not stirring to pity at thought of their kindred. Edicts are absent in those inner halls; As the imperial voice, falls muffled and faint. Revenues that should to flow as a vital stream break into rivulets, and are seized by ambitious lords and lost in disorder. Perhaps, even the land itself grows forgetful of oaths once sworn. Along the northern reaches, our tributaries greet us with enthunasim, yet their words betray a harsher truth: they, too, have sensed weakness.\n\nMy Lord, we approach a precipice, as endurance is not the same as immortality. Should we fail to gather our scattered strength to restore order and the unity which was consecrated at our second founding, then Moras may slip into that quiet oblivion which had once claimed us. The first is a grief remembered, and now, the second will be a mockery repeated."
 flavor_A01.6.a: "The hour is late, but all is not yet lost."
 
 flavor_A01.7.title: "The Imperial Bride" 
 flavor_A01.7.desc: "Oh Ventura — I remember your golden hills, your sunlit streets, once the pride of the free, which now lie under the Imperial banner. How long will you remember the songs of free people, of markets bustling with laughter, your heroes victories, is uncertain. The Eternal City casts a long shadow, and  today you have been made to be its bride. It whispers sweet words of "reunion at last", and of "law and order". Yet, the legions walk your streets with calculating steps, banners heavy, adorned with the laurels of conquest." 
 flavor_A01.7.a: "Oh Ventura"
 A01_convert_venutirans_tt: "#Y 10%#! of our [ShowCultureName('venturian_culture')] [pops|e] in The Golden Hills will convert to [ROOT.GetCountry.GetReligion.GetName] and [ShowCultureName('vivum_moran_culutre')]."
 
 flavor_A01.8.title: "The End of Scarlet" 
 flavor_A01.8.desc: "With the conquest of Dawnwatch, the Empire has dealt a grave blow to its most formidable rival, and is one step nearer to achieving the dream of reclaiming Godhand. The Scarlet Order had fought with grim determination. As their warriors, holy paladins and knights fought until the last desperate, bitter hour. Yet in the end our might was too great." 
 flavor_A01.8.a: "Red has always been our color."
 
 flavor_A01.9.title: "Of Flesh and Bone"
 flavor_A01.9.desc: "As our banners advance, as new provinces bend the knee, and as local elites garner for status in our new order, the old question arises: What is to be the status of the living in a dead empire? While some have already been drawn into our orbit, adapting a pastiche of our glorious culture, each new conquest brings more and more of those who cling to their being. Many of the dead remember what it was like to be alive, to need to draw breath but many have also renounced that status and embraced the form. At last the question most be answer for eternity: Are the living to be equals, or are they merely resources to be tended like grapes in a vineyards and harvested for wine?"
 flavor_A01.9.a: "Let them walk alongside us"
 flavor_A01.9.b: "They are resources. Nothing more."
 
 flavor_A01.10.title: "The Borrowed Country"
 flavor_A01.10.desc: "The Ratfolk have lived in these lands for far longer than anyone really bothers to count, long enough that scholars from the First Empire remember writing on the ‘the burrow-minds which lie beneath that soil'. Their cities have risen and fallen as kingdoms come, and kingdoms go, yet thus far the Ratfolk have endured. Now, as pir Empire has once again claimed their cities as our own, already their local elites are being integrated into our administration."
 flavor_A01.10.a: "A place once ours, is ours again, for whatever that's worth"

 flavor_ira.22.a.tt: "Every [owned|e] [location|e] with a [ShowCultureGroupName('turkic_group')] [culture_group] as its [dominant_culture|e] loses [ShowNamedValue('control_weak_penalty')|+=2%] [control|e]"
 
 flavor_A01.11.title: "What is a Man?"
 flavor_A01.11.desc: "Victory upon the fields of battle has given rise to a subtler struggle, one not of steel but of hearts and minds. Our banners now fly over cities thick with the living, and with them comes a question no legion can silence.\n\nThough our forms are changed, were we not once numbered among them? Did we not know hunger and sickness, desire and love? Or has undeath drawn a line that memory alone cannot cross?\n\nThese are the questions now set before the Imperium. As the dream of empire crystallizes into reality, we find ourselves ruling over those unlike us in body, yet uncomfortably closer in spirit.\n\nAre we still human? Or something else entirely? And if the division exists, can it or should it be bridged?"
 flavor_A01.11.a: "Let them walk beside us."
 flavor_A01.11.b: "They exist to be used."
 
 flavor_A01.12.title: "The Empire Strikes Back"
 flavor_A01.12.desc: "With the end of the civil war, the Empire now turns to its second favorite enemy: Non-Morans. Before the Gods, [GetCountry('A01').GetGovernment.GetRulerOrRegent.GetName] has proclaimed that the Empire will restore dominion over Godhand. The old system of leases in perpetuity with the northernly petty lords is forfeit."
 flavor_A01.12.a: "The die is cast."
 flavor_A01.12.tt: "If we control 200 provinces in the [ShowRegionName('godhand_region')] within 50 years, the modifier will become permanant."
 
 
 ###Disaster###
 moran_civil_war: "Moran Civil War"
 moran_civil_war_desc: "Moras was born from fratricide, and fate itself seems determined that its heirs are to forever repeat that original sin forever. With the throne weakened, ancient grudges have flared, undead generals stir in their mausoleums, and legions march beneath banners thought long buried. Moran once again turns its swords inward."
 
 moran_civil_war.100.title: "A New Dawn"
 moran_civil_war.100.desc: "The curse of the First Murder may not be broken, but for now it is mastered. Ambition remains, but it is chained. Rivalry persists, but it bends. The Empire is whole once again."
 moran_civil_war.100.a: "For now."
 
 moran_civil_war.101.title: "The Storm After the Storm"
 moran_civil_war.101.desc: "Undeath has cured many afflictions, but neither it, nor the gods above, have granted immunity to the oldest sickness: rival claimants rising from within. The century of humiliation brought about by the Eternalist Crusades, and the subsequent long stagnation of the New Empire has strained our society to its breaking point. Pleb and patrican alike flock to the standard of which ever claimant claims to have the remedy for all the diseases of the Empire. Their cures are infinite, but in the end the result is the same: Moran will now make war upon Moran."
 moran_civil_war.101.a: "We and the gods have seen this before..."
 
 
 moran_civil_war.1.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Demand Compensation"
 moran_civil_war.1.desc: "During these harsh times, the vultures that call themselves [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] remind us that [target_character2.GetName] is a member of their class. Draped in silk and speaking in veiled threats, they insist that their support in this crisis requires ‘proper restitution’ for centuries of imagined grievances. Their coffers are empty, their pride is not."
 moran_civil_war.1.a: "Fine."
 moran_civil_war.1.b: "They are out of line!"
 peasants_unhappy_tt: "Our [ShowPopTypeName('peasants')] in every owned [location|e] will lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]"
 moran_every_noble_sides_with_pretender_tt: "[ShowPopTypeName('nobles')] [pops|e] across our [provinces|e] will lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e] and support the cause of [target_character.GetName]"

 moran_civil_war.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Refuse to Pay Taxes"
 moran_civil_war.2.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are known to resist the authority of [target_character2.GetName]. Under the pretense of open rebellion and taking advantage of the general commotion across our domain, they have pushed forth official demands to reduce or outright undo several of the dues we have imposed on them."
 moran_civil_war.2.a: "Very well, we need them."
 moran_civil_war.2.b: "We will not negotiate with the likes of them!"
 
 moran_civil_war.3.title: "Our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Supports the Pretender!"
 moran_civil_war.3.desc: "Unruly children and wayward power-hungry [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] may not have much in common but they both thrive in the chaos generated across our household. Under the pretense of waning central authority, they have outright denounced [target_character2.GetShortName] in favor of [target_character.GetName]!"
 moran_civil_war.3.a: "We do not need them."
 moran_civil_war.3.b: "Would some privileges change their mind?"

 moran_civil_war.4.title: "The Mariners Guild of [ShowLocationNameWithNoTooltip('godhand36')]"
 moran_civil_war.4.desc: "Few domains across our lands have become as big of an amalgamation of unrest and corruption as [target_location.GetName]. Reports of people turning against their masters, crowds rising up, looting, and destroying the estates of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have become a daily occurrence. Without a shadow of a doubt, [target_location.GetNameWithNoTooltip] edges closer to open rebellion against the established order."
 moran_civil_war.4.a: "We can listen to their demands."
 moran_civil_war.4.b: "They will be whipped into order!"
 moran_mariners_guild_effect_1_tt: "[ShowPopTypeName('nobles')] [pops|e] in [target_location.GetNameWithNoTooltip] will lose [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e] while [ShowPopTypeName('peasants')] and [ShowPopTypeName('burghers')] will gain [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%]\n[target_location.GetNameWithNoTooltip] will lose [ShowNamedValue('control_ultimate_penalty')|+=2%] [control|e]"
 moran_mariners_guild_effect_2_tt: "[ShowPopTypeName('nobles')] [pops|e] in [target_location.GetNameWithNoTooltip] will gain [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [pop_satisfaction|e] while [ShowPopTypeName('peasants')] and [ShowPopTypeName('burghers')] will lose [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]\n[target_location.GetNameWithNoTooltip] will lose [ShowNamedValue('control_ultimate_penalty')|+=2%] [control|e]"

 moran_civil_war.5.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] Demand the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]'s Purge"
 moran_civil_war.5.desc: "The situation in [target_location.GetName] has reached its point of no return, as gangs of [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] stalk the land like hungry beasts, raising their fists and arms against the local [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], whom they accuse of negligence and unquenching greed. Should we not step in, we risk a purge of the local [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] whose members may be eager to support our cause in exchange for their safety..."
 moran_civil_war.5.a: "Quench the thirst of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] for noble blood!"
 moran_civil_war.5.b: "We must protect the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]..."

 moran_civil_war.6.title: "Abandoning One's Duties"
 moran_civil_war.6.desc: "It is a common secret that [target_character2.GetName] is known to frequently dodge military duties. Oftentimes, [target_character2.GetSheHe] can be found drinking in a nearby derelict tavern, [target_character2.GetHerHis] troops undrilled, undisciplined, and completely demoralized. This is a most shameful image to project, even more so during these turbulent times..."
 moran_civil_war.6.a: "Officially reprimand [target_character2.GetHerHim] and [target_character2.GetHerHis] peers!"
 moran_civil_war.6.b: "Force a fine upon [target_character2.GetHerHis] estate."
 moran_civil_war.6.c: "[target_character2.GetSheHe|U] may be excused this time."
 moran_character_might_cause_trouble_again_tt: "[target_character2.GetShortNameWithNoTooltip] may cause trouble in the near future again..."

 moran_civil_war.7.title: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName]'s Assembly"
 moran_civil_war.7.desc: "The recently developing situation that pits [target_character.GetName] as the contender for the throne has given rise to a series of military campaigns to purge support for the pretender. Many prominent members of various estates like the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have long since supported the idea of expanding the powers of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], in an attempt to gain more favorable and impactful outcomes..."
 moran_civil_war.7.a: "Their words bear some wisdom."
 moran_civil_war.7.b: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will always have the final say!"
 unlock_new_issues_about_civil_war_tt: "All new [parliament_issues|e] will be enhanced for the duration of the [ShowDisasterName('moran_civil_war')] [disaster|e]"
 scales_with_crown_power_tt: "This [modifier|e] scales with our [crown_power|e]"

 moran_civil_war.8.title: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] Rejects the Pretender"
 moran_civil_war.8.desc: "The religious societies across our nation have long viewed the developing situation and the open rebellion propagated by [target_character2.GetName] with ill favor. They believe that this social disturbance will endanger the people and goes against the dogmatic view they have of unitary companionship. As such, they seek to assist us in legitimizing our struggle against this internal threat."
 moran_civil_war.8.a: "Their efforts will assist the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 moran_civil_war.8.b: "Whoever is against [target_character2.GetShortNameWithNoTooltip]'s rule risks divine wrath."
 scales_with_clergy_estate_power_tt: "This gain scales with our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]'s [estate_power|e]"
 province_pops_gain_satisfaction_tt: "Many of our [provinces|e] with dissatisfied [pops|e] that follow [ROOT.GetCountry.GetReligion.GetName] will gain [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] [pop_satisfaction|e]"

 moran_civil_war.9.title: "The Ravages of Instability"
 moran_civil_war.9.desc: "Sick pastures, ailing animals, and burned crops are but the most common landscape view during these turbulent times. The complaints on behalf of the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] are piling up as the turmoil envelops the countryside. Brigands, thieves, and marauding mercenaries have turned against each other, wrecking the once-beautiful countryside of [target_province.GetName] once again..."
 moran_civil_war.9.a: "Fear not, we will finance the recovery!"
 moran_civil_war.9.b: "We cannot afford it, this time..."
 pops_in_target_province_join_succession_crisis_pretender_tt: "Our [pops|e] in [target_province.GetNameWithNoTooltip] will lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e] and may join the cause of [target_character.GetName]!"

