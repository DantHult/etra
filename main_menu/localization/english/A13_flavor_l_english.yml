l_english:
 flavor_A13.1.title: "The Funeral of Ratticar the Great"
 flavor_A13.1.entry: "$flavor_A13.1.title$"
 flavor_A13.1.desc: "God was weeping as they brought the body of Rattokar down from the Church. He had been imperfectly preserved, with vinegar and salt, and aromatic spices carried up from the lands of the dead, dressed in gold and bright red, in the finest and most luxurious silks, and armored as if to fight some final battle. The tears of God fell upon his coffin as raindrops. There had not been a true king to bury in these lands since the Days Before, and further back still since there was a king among the rats, though the Mirk had crowned plenty of sellswords in thorns who grasped for better. And many more would soon be grasping for the same. So the litter went the long way to the royal necropolis, that all the city might see its maker one last time. The dead command no armies here, for this is godly land, yet they can still teach a lesson.\n\nThe streets between the river-gate and the temple-lands were packed rat to rat, so thick the litter moved at a crawl, the crowd come from every warren to weep, some in earnest, more because weeping was watched, for no rat yet knew how much grief a king was owed and so they gave a great deal, to be safe. And the great gave too. As the procession passed, the blood of Rattokar flung largesse into the press from either side, bread and salt fish, copper and clipped silver, casks of river-wine broken open in the gutters, each prince's men marking who caught his coin and who shouted his name, and the coins minted fresh that month, each bearing a different uncle's face where the king's should have been. A rat who took bread from one hand and silver from another went home having sworn nothing and eaten well.\n\nPast the cheese-halls the procession came to the boundary of the temple-lands, marked by a leaning stone cross of an elder faith, worn to a nub but never moved, for the Eternalists hold that to shift a boundary stone is to shift the world it measures. Here the city clergy were turned back. The Archbishop of Rattopaese had no writ beyond the cross, and was made to wait while the monks of the Temple came out in their plain undyed habits to take. The cheese-lords and the salt-masters peel away, as did the the toll-takers and the ward-captains, peeling off rank by rank at the cross, until only the monks, a knot of higher clergy, and the rats of his own blood walked the last mile through the orchard-quarter — that strip of failing vineyards and grain-plots between the inner wall and the crypts, where the first blossom of the year was breaking white on the old trees, careless of the dead king passing beneath them.\n\n[GetCharacter('A13_cecilia').GetNameWithNoTooltip] walked alone before the crypt-mouth, a widow's veil drawn over a regent's circlet that no head had worn before hers. She had the infant heir, and a dead king's name, and a crown so new the gold had not yet learned whose brow it belonged on. The blood of the first king came after her in their ermine and their arithmetic, kissing the cold ring on the dead paw and rising with their eyes already moving across one another, each counting the spears the others had brought and the holds the others might claim. [GetCharacter('rat_vikkit').GetNameWithNoTooltip] smiled at her as he rose. That was the one to fear, she thought; the rest had at least the courtesy to scowl. What was being buried beneath the stone was the only thing that had ever bound the whole nest as one, and there was no second example of such a thing to send for. The smoke would clear, the lords would ride home, and somewhere a knife was already being whetted. Spring plants kings, the rats of the Commonweal say. It is the living it reaps after — and there had never yet been a king's death to teach them how much."
 flavor_A13.1.a: "Give the Great Rat a king's rites."
 flavor_A13.1.b: "Keep the ceremony modest — the realm cannot afford pageantry."

 flavor_A13.2.title: "Through a Child's Eyes"
 flavor_A13.2.entry: "$flavor_A13.2.title$"
 flavor_A13.2.desc: "[GetCharacter('rat_ratticar_the_young').GetNameWithNoTooltip] is too young to understand half of what the court whispers, but children learn fear before they learn law. He remembers his father [GetCharacter('rat_vernacius').GetNameWithNoTooltip] only as a distant warmth and a closed coffin. Now the drums and dirges have returned for his great-grandfather, and the palace corridors fill with uncle-lords who smile when they see him and go silent when they think he cannot hear.\n\n[GetCharacter('A13_cecilia').GetNameWithNoTooltip] keeps him close in the inner chambers of [ShowLocationName('freehold50')], away from the scheming and the torchlight. At night he asks why so many ratfolk with sharp teeth have come to visit. The regent holds him and speaks of duty, but in the boy's world the crown is still only a heavy hat on a table and the word 'king' sounds like something grown-ups argue over while he is sent to play."
 flavor_A13.2.a: "Let Cecilia shield him until he is ready."
 flavor_A13.2.b: "The heir must be seen — even now."
