l_english:
 flavor_A163.1.title: "The Widow of the Empire"
 flavor_A163.1.entry: "$flavor_A163.1.title$"
 flavor_A163.1.desc: "[ShowLocationName('ardraine218')] was not always a widow. After the [day_of_apokatastasis|E] in 1066 and the making of the [compact_of_adune|E], the town was counted among the western granary courts of the [holy_roman_empire|E]: a road-keeper, tithe-house, and storehouse expected to feed the realm [the_junil|E] had saved from the [undying_emperor|E]. Even after the Junil vanished from worldly affairs, Bourfort's old charters still called it a pillar of common law and common bread.\n\nThe famine came long after that promise had begun to fail. While [GetCountry('A01').GetName] burned itself in the [war_of_37_imperators|E] and the [godhand_crusades|E] dragged the Commonweal's strength toward [ShowLocationName('eternalcity1')], Bourfort remained far from the battle lines. No Moran legion entered its gate, no siege engine cracked its walls, and no crusader host trampled its fields. Yet after [GetCharacter('A01_decius').GetName] broke the [long_siege_of_moras|E] in 1248, fear outran the armies. When Bourfort's wells went bitter and its grain stores soured, priests blamed the [pale_one|E]. Some meant [GetCharacter('A01_decius').GetName] himself, some meant the old empire's curse, and some meant only that a town starving in peace needed a monster to accuse. The dying turned waxen and pale, and the chroniclers compared them to the ghosts of Moran.\n\nThe Crusades ended in 1291, but Bourfort was left with empty names where households had been. Now, in 1337, the famine is memory rather than hunger, and recovery remains unfinished. The widow's roll is read aloud again: the names of the dead, the estates that failed them, and the granaries that must never be allowed to stand empty again."
 flavor_A163.1.a: "Fund the recovery granaries."
 flavor_A163.1.b: "Leave the widow to her silence."
 flavor_A163.2.title: "Prosperous Rein"
 flavor_A163.2.entry: "$flavor_A163.2.title$"
 flavor_A163.2.desc: "The widow's roll is read less often now. In [ShowLocationName('ardraine218')], names once spoken as warnings have become names carved above full storehouses, rebuilt ovens, and tally rooms where no steward is allowed to forget what empty granaries cost.\n\nThe city and its people have recovered from their dismay. With enough gold, Bourfort can turn its memorial stores into an imperial granary system: permanent, audited, and large enough that famine will have to fight the walls before it reaches the hearths."
 flavor_A163.2.a: "Raise the Grannery of the Empire."
 flavor_A163.2.b: "Let the widow's work stand."
