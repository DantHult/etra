 flavor_A325.1.title: "The Empty Tomb"
 flavor_A325.1.desc: "The doors at [ShowLocationName('etra66')] open onto a house that has been waiting a thousand years. Phaetheon's ancestors lie in ranks of gold and horse-bone. His sun-disk hangs where a corpse should hang. The Kynarides have kept the lock, the hymns, the story of a marriage nobody can document — and they have kept, most carefully, the absence.\n\n[target_character.GetName] stands in the dust and is asked, as every anax is asked, whether to name the emptiness a mystery or a theft. [target_country.GetName] took the cortege into the dark. The tombs are ours. The body is not. To open the doors is to perform legitimacy in a house whose master is elsewhere. To leave them shut is to admit it."
 flavor_A325.1.a: "Open the doors. Let them see what we keep."
 flavor_A325.1.b: "Leave them shut. We already know."

 flavor_A325.2.title: "The Cortege in the Dark"
 flavor_A325.2.desc: "Phaetheon did not come home. The funeral road turned south and down, and [target_country.GetName] closed the earth behind it. For a thousand years the underdark has had what Ematis was built to hold: the body that makes a claim into a fact.\n\nThe Hawk-Riders still toast a king whose bones are a taunt. [target_character.GetName] can call that an old quarrel, or a war that has not started yet. The Host is not replaceable. Recovering a corpse is not a reason to spend it — unless the corpse is the only argument Hyriosia has never been able to answer."
 flavor_A325.2.a: "The body comes home. Write it as a claim."
 flavor_A325.2.b: "Leave the dead to the dark. We have a Wall to keep."

 flavor_A325.3.title: "A Hyriosian Snub"
 flavor_A325.3.desc: "The letter from [target_country.GetName] is courteous in the way commentaries are courteous. We are rustic. We are hawks who learned to sit at table. We fly a Companion's sun and call it Phaetheon's. We are, in short, not quite Golden enough to be addressed as kin.\n\n[target_character.GetName] has an answer that is not a commentary. [target_country_2.GetName] presses the Alar hills. Behind them rides a steppe-host that does not write letters. Hyriosia is alive because we are between them and that. Whether we say so, or swallow the snub and keep the pass in silence, is the whole of Naihan diplomacy."
 flavor_A325.3.a: "Tell them they are alive because we bleed."
 flavor_A325.3.b: "Swallow it. The Wall does not need their thanks."

 flavor_A325.4.title: "The North Comes Down"
 flavor_A325.4.desc: "Smoke on the Alar road. [target_country.GetName] has come over the hills into [target_location.GetName], as they come when the grass is high and the Host is looking south. Behind them, always, the shadow of [target_country_2.GetName]: a storm that has not broken yet, and does not need to break in order to be believed.\n\nThis is the argument we make to Hyriosia. This is also a casualty list. [target_character.GetName] can ride the Hawk-Riders to the frontier and spend Companions on a raid that will happen again, or buy the raiders off and teach the Wall that it is a price, not a duty."
 flavor_A325.4.a: "Keep the pass. Make them remember why they call it a Wall."
 flavor_A325.4.b: "Pay them off. The Host is not replaceable."

 flavor_A325.5.title: "Quarrel of Companions"
 flavor_A325.5.desc: "[target_character.GetName] of the Pyrrhaides and [target_character_2.GetName] of the Kallinides have remembered that they are heirs of men who carved a hegemony into satrapies the day a king died. The quarrel is about forage, precedence, and a marriage-right nobody can find on a tablet. It is also about whether the Kynarides are first among Companions or merely the Companions who kept the keys.\n\n[target_character_3.GetName] can pick a house and make an enemy, or refuse to pick and make two. The Host does not survive a second carving."
 flavor_A325.5.a: "Name a winner. Let the other house learn."
 flavor_A325.5.b: "Name neither. The anax is first. That is the lesson."

 flavor_A325.6.title: "The Phalanx in the Hills"
 flavor_A325.6.desc: "A drill-master from Ematis has written what every Foot Companion already knows and what every restorationist pretends not to: on the flat, the pike is a single animal. In hills and wood the files open, the hedge breaks, and the animal becomes men who can be killed one at a time.\n\nPhaetheon chose his ground. The men who spent the Host after him did not. [target_character.GetName] can treat this as scripture — refuse battles the terrain has already lost — or treat it as an insult to the drill. Quality is not a plan if you fight in the broken ground."
 flavor_A325.6.a: "We fight where the pike can breathe. Nowhere else."
 flavor_A325.6.b: "The Host goes where the anax points. Ground is an excuse."

 flavor_A325.7.title: "A Fetter or a Province"
 flavor_A325.7.desc: "[target_country.GetName] sits on the old road into Hyriosia. Phaetheon would have put a garrison in the gate, taken tribute and troops, and left the duchy to hate its neighbors more than it hated him. Annexation would have meant occupying people who despise us: levies that never come home, a Host spent on streets that will never love a hawk.\n\n[target_character.GetName] is being asked, as if it were a new question, whether Naiha wants a Fetter or a province. One of those is hegemony. The other is a second sun, and we have already seen how those end."
 flavor_A325.7.a: "Restore the garrison. Tribute and troops. Not the map."
 flavor_A325.7.b: "Take the land. Spend the Host if we must."
 flavor_A325.7.b.tt: "Annexing Hyriosia will drain the Host: occupation is a levy we cannot refill."

 flavor_A325.8.title: "The Pages of Carcos"
 flavor_A325.8.desc: "The royal pages at [target_location.GetName] are not clerks. They are sons of Companion houses, sent to the anax as hostages with better manners. [target_character.GetName] and [target_character_2.GetName] have been asked to send theirs. The institution is as old as Phaetheon's drill: a boy in the palace is a house that will not break the line.\n\n[target_character_3.GetName] can take the pages and make the Host a court, or refuse and leave the houses to raise their own wolves. Control is not free. Neither is trust."
 flavor_A325.8.a: "Send the boys. The palace will raise them."
 flavor_A325.8.b: "Leave the houses their sons. We are not yet that afraid."

 flavor_A325.9.title: "Royal Timber and the Silver Hills"
 flavor_A325.9.desc: "The silver of [target_location.GetName] and the timber of [target_location_2.GetName] are not estate-rights. They are the anax's: mines and forests held in the crown's own name, the way Phaetheon paid a Host that estates would have spent on themselves. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have noticed that the ledgers still say so, and they would like a cut.\n\nA kingdom that cannot replace its soldiers can at least pay the ones it still has. Whether [target_character.GetName] keeps the monopolies or buys peace with silver that should have bought pikes is the whole of Naihan finance."
 flavor_A325.9.a: "The mines and the woods stay royal."
 flavor_A325.9.b: "Give them a cut. The Host needs houses that will still ride."

 flavor_A325.10.title: "Brother Against Brother"
 flavor_A325.10.desc: "The Kin-Slaying is not a story we tell about other people. [target_character.GetName] wants a second sun: Hyriosia under the banner, the Fetters melted into provinces, the Host spent on purpose because glory is a kind of arithmetic he prefers. [target_character_2.GetName] wants the Wall, the garrisons, the subsidies, a kingdom that can still field a pike in twenty years.\n\nThey will not share [target_character_3.GetName]'s tomb. One of them will keep the keys. The other will be an example. We are the heirs of Companions who carved a hegemony the day a king died. This is not a new crime. It is the family business."
 flavor_A325.10.a: "The restorationist. Damn the casualty list."
 flavor_A325.10.b: "The accommodationist. Keep the Host. Keep the Wall."

 flavor_A325.11.title: "Occupation of Hyriosia"
 flavor_A325.11.desc: "We have taken the land. The duchies are gone, or gone enough, and the streets that used to pay tribute now pay garrison. Hyriosia does not love hawks. Every Companion left to hold a gate is a Companion who will not refill the Host. [target_character.GetName] has bought a map at the price Phaetheon refused to pay.\n\nThis is what annexation costs. The south is permanently one winter away from revolting. The arithmetic does not change because we won."
 flavor_A325.11.a: "We will hold it. We will pay."

 flavor_A325.12.title: "A Second Sun"
 flavor_A325.12.desc: "The three gates are ours: [ShowLocationName('etra74')], [ShowLocationName('etra24')], [ShowLocationName('etra35')]. The Fetters, or the start of something that is not Fetters. From here a Reunited Kingdom is no longer a commentary. It is a decision to spend the Host on purpose — to declare the Kin-Slaying's punishment served by the heirs of the people who last committed it.\n\n[target_character.GetName] can prepare that ride, knowing there will not be a third sun, or keep the garrisons and the Wall and call hegemony enough. Restoration is possible. Expensive victories are how we lose."
 flavor_A325.12.a: "Prepare the Host. If we ride, we ride once."
 flavor_A325.12.b: "Hold the gates. Hegemony is the lesson. Not the map."

 cb_a325_stolen_cortege: "The Stolen Cortege"
 cb_a325_stolen_cortege_desc: "Phaetheon's body was taken into the underdark. [GetCountry('A325').GetName] claims the right to recover the cortege from [GetCountry('A331').GetName] and return it to the tombs of Ematis."

 STATIC_MODIFIER_NAME_a325_occupation_of_hyriosia: "Occupation of Hyriosia"
 STATIC_MODIFIER_DESC_a325_occupation_of_hyriosia: "Garrisons in a south that hates hawks. Every Companion left on a Hyriosian street is a Companion the Host will not see again."
 STATIC_MODIFIER_NAME_a325_pages_of_carcos: "Pages of Carcos"
 STATIC_MODIFIER_DESC_a325_pages_of_carcos: "Sons of Companion houses kept at court as pages — hostages with better manners, and a reminder that the anax is first."
 STATIC_MODIFIER_NAME_a325_the_wall_kept: "The Wall Kept"
 STATIC_MODIFIER_DESC_a325_the_wall_kept: "The northern pass was held. Hyriosia may remain unimpressed. The Host knows what it did."
 STATIC_MODIFIER_NAME_a325_preparing_the_second_sun: "Preparing the Second Sun"
 STATIC_MODIFIER_DESC_a325_preparing_the_second_sun: "The Host is being spent on purpose. There will not be a third sun."
 STATIC_MODIFIER_NAME_a325_broken_ground: "Broken Ground"
 STATIC_MODIFIER_DESC_a325_broken_ground: "The pike was taken into hills and wood. The Host paid for a lesson it already knew."
