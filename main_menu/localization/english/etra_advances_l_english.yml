 arinera_winged_dragoons_advance: "Winged Dragoons"
 arinera_winged_dragoons_advance_desc: "Once, the dragoons were but light horse, sent ahead of the host to watch the roads and harry stragglers. But as the old feudal levy crumbled, so too did its riders pass from favor. In their place we have raised professional regiments, and at their heart ride the winged dragoons: heavier, armored, and bearing upon their backs not the feathered frames of foreign hussars but great spans of draconic wing. Each rides with the fire-lance couched, that the charge might break upon the foe like dragonfire made manifest. Let our enemies hear the beat of those wings in the dark — and tremble in the night like frightened children."
 arinera_late_winged_dragoons_advance: "Late Winged Dragoons"
 arinera_late_winged_dragoons_advance_desc: "The evolution of $A332_ADJ$ winged dragoons entailed the adoption of heavier armor with red and white colors. They used a longer fire-lance of around six meters, which made their charge incredibly devastating, often breaking the morale of their foes and causing them to rout."
