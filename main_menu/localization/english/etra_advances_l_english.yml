 A42_lands_of_salt_and_stone: "Lands of Salt and Stone"
 A42_lands_of_salt_and_stone_desc: "Today marks a momentous occasion, as never before has a Sordrenic polity united the region; many have tried, equally as many have failed. Now the land and the people stand united as one. Our administration has learned valuable lessons for the future in uniting a people as contentious as our homeland is fractious. As a dynamic new state, our glorious union will rise to untold heights."
 hac_memory_of_the_junil: "Legacy of The Junil"
 hac_memory_of_the_junil_desc: "Every poltical entity has a need for a great story. To prove that it is not just a thing that is, it is a thing that ought to be. That has to be. That if it were not, the heavens themselves would ignite in a conflagration.  This is the story which legimatises itself to its people, its elites, its neigbhors, and most importantly - itself.\n\nFor the Holy Commonweal of Etra that story is one of The Junil. The legendary hero of the 11th century, they who defeated the Undying Emperor, the savior of the 24 nations, slayer of millions, and many more titles besides. Many were earned in life, many more bestowed posthumorously.\n\nNumerous well attested accounts exist for The Junil, ones which frequently contradict one another detailing deeds accomplished at the same time in differing locales. What is undisputed fact is, that they lead the single greatest human migration in history. As when countless souls were consumed by the torrent, as magical energies scarred the land, they arose from humble beginnings and united the scattered survivors into the Holy Commonweal.\n\nWhile The Junil is long gone, the Supreme Commanders of the Holy Commonweal have taken to taking The Junil's name as a title, to emulate the deeds of The Junil."
 
 pwasciards_tradition: "Daughters of the Seas"
 pwasciards_tradition_desc: "The Pwasciards have dwelt on the western shores of Ardraine since time immemorial, and for as long as memory serves, their lives have been inseparable from the sea. Where inland Ardrainiens look to field and forest for sustenance, the Pwasciards look to the horizon. Their children learn to read the tides before they learn letters, and every family can trace its lineage back to some ancestor who made their fortune—or met their doom—upon the waves. The jagged coastline is dotted with harbors that never sleep: fishing boats depart at dawn while merchant vessels arrive with the evening tide, and the smell of salt and tar permeates every settlement from the smallest cove village to the great port cities. To be Pwasciards is to understand that the land ends but the world does not—that beyond the breakers lies opportunity, danger, and destiny in equal measure."
 pwasciards_shore_guilds: "The Storm Chapels"
 pwasciards_shore_guilds_desc: "Every Pwasciards harbor is watched over by a Storm Chapel—small fortified sanctuaries built on promontories overlooking the sea, where priest-mariners known as the Tide Wardens maintain eternal vigil. These mystics, trained in both Eternalist doctrine and the ancient weather-working of the land, do far more than light beacon fires. Through communion with the Eternal Cycle, they read the future in the patterns of waves and clouds, sensing storms days before they arrive and guiding lost ships through fog that would blind ordinary sailors. The most gifted among them can calm hostile waters with hymns passed down since the days when the land was first settled, or call favorable winds to speed merchants home. Within their chapels, intricate orreries and tide-clocks track not merely physical currents but the spiritual ebb and flow of maritime fortune—allowing the Wardens to determine auspicious dates for voyages and warn of cursed waters where ships vanish without trace. The chapels also serve as neutral ground where disputes between fishing crews and merchants are arbitrated, their priests bound by sacred oath to favor neither rich nor poor, only the eternal truth and the good of the fleet. It is said that no ship blessed by a Tide Warden has ever been lost to natural storm—though whether this is divine favor, skillful weather-working, or simply that wise captains heed the warnings of those who can read the sea's mind, none can say for certain."
 pwasciards_port_networks: "The Harbormistress's Concordat"
 pwasciards_port_networks_desc: "In 1347, following the catastrophic Storm of Saint Odilon that destroyed half the fishing fleet and left three coastal towns without warning, the Pwasciards ports realized that their isolation was killing them. At the Teron Conference, representatives from the seventeen harbors signed the Concordat—establishing the position of Grand Harbormistress and creating a relay system of beacon towers and fast messenger ships that could carry news along the entire coast within two days.\n\nWhat began as storm warnings evolved into something far more valuable. Prices, naval movements, pirate sightings, shoal formations, even gossip about foreign merchants—everything flows through the Concordat. A Pwasciards captain arriving at any member port finds standardized fees, guaranteed berths, and credit honored from any other harbor in the network. The merchant houses of Torrent and Ardraine have learned the hard way that when negotiating with the Pwasciards coast, they negotiate with all of it at once. The Concordat speaks with one voice, and that voice carries the weight of every harbor from Marcon to Côte-de-Vent."
 pwasciards_maritime_horizons: "The Sunset Ventures"
 pwasciards_maritime_horizons_desc: "The Pwasciards had always been coastal sailors, rarely venturing beyond sight of land. That changed in 1489 when Captain Yseult Marivaux returned from a three-month voyage with holds full of strange spices and tales of islands beyond the sunset. Her success ignited something in the Pwasciards blood—within five years, a dozen expeditions had departed westward, and the race to map the Far Reach had begun.\n\nBut ocean voyages require more than courage. Pwasciards shipyards began constructing deep-hulled carracks designed for months at sea, while merchants formed joint ventures to spread the ruinous costs of exploration. Yet the real innovation came from necessity: merchant vessels needed protection from pirates and rival powers in distant waters, but traditional marines were too expensive to maintain. The solution was the Marins de Guerre—sailors trained to fight both at sea and ashore. These versatile warriors garrison coastal forts, conduct amphibious raids on enemy harbors, and transform trading vessels into warships when hostile sails appear. Trained on Pwasciards tradition of boarding actions and coastal warfare, they've proven worth their weight in the exotic goods they protect."
 pwasciards_distant_waters: "The Compact of Leaf and Sail"
 pwasciards_distant_waters_desc: "The great warships and merchant carracks that have made Pwasciards naval power feared across western seas require enormous quantities of timber—and not just any wood, but the straight-grained oak and tall pine that the Lutin elves guard jealously in Ardraine's interior forests. For centuries, this created bitter conflict: Pwasciards loggers would venture inland and return with arrows in their backs, while elven rangers burned any coastal sawmill that processed "stolen" lumber. The bloodshed only ended in 1387 when Duchess Alienor negotiated the Compact of Leaf and Sail with Kingdom of Ihonntaur. Under its terms, the Lutin would provide timber—but only from trees they deemed ready for harvest, cut according to their rituals, and never in quantities that would wound the forest's spirit. In exchange, the Pwasciards would protect certain sacred groves from inland Ardrainien nobles and guarantee the elves a share of exotic goods from across the sea. The arrangement seemed impossible at first—impatient human shipwrights waiting on elven timber-singers to commune with trees—but it has endured for two centuries. The "Greenwood Towns" where elf and human work side by side have become strange hybrid places where children grow up speaking both Ardrainic and Elvish, where ship figureheads incorporate living wood that still sprouts leaves, and where the finest vessels are said to be blessed by both sea-saints and forest spirits. The Lutin still call humans hasty and destructive; the Pwasciards still call elves maddeningly slow. But the ships sail, the forests endure, and both peoples have grown grudgingly wealthy from the bargain."
 pwasciards_coastal_identity: "The Salt Covenant"
 pwasciards_coastal_identity_desc: "For centuries, the Pwasciards coast was a patchwork of jealously independent fishing towns, each with its own customs, patron saints, and bitter feuds with its neighbors. The Reformation changed that. As religious conflict swept inland Ardraine, coastal communities found themselves united by what they shared: the same storms tested their boats, the same saints protected their harbors, the same sea fed their children.\n\nIn 1512, representatives from forty-seven coastal settlements gathered at the Abbey of Saint Melor to draft the Salt Covenant. This document codified what it meant to be Pwasciards—not subjects who happened to live by the sea, but a people whose identity flowed with the tides. The Covenant standardized maritime law, replacing generations of blood feuds over fishing rights and salvage claims with adjudicated settlements. It eased the integration of smaller villages into greater port cities, as fisher communities accepted governance from urban authorities who spoke their language and understood their lives. Most importantly, it created legal mechanisms for merchant houses to intermarry across traditional boundaries, spawning dynasties whose interests span the entire coast. When Pwasciards speak of "our people" now, they mean something real—bound not by feudal obligation, but by shared salt and shared horizon."
 pwasciards_harbor_masters: "The Grand Arsenals"
 pwasciards_harbor_masters_desc: "By the mid-1500s, major Pwasciards ports had outgrown governance by guild-appointed factors and local lords. The volume of trade, complexity of naval operations, and scale of construction projects demanded something more sophisticated. The solution emerged in Marcon: the Grand Arsenal, a centralized authority managing every aspect of harbor operations under a professional Harbormaster.\n\nEach Grand Arsenal coordinates the intricate machinery of a major port. Harbormasters—trained in navigation, engineering, law, and naval tactics—manage everything from tide tables and pilotage to customs collection and warship maintenance. They oversee construction of massive coastal warehouses where fish is salted for export, timber seasoned for shipbuilding, and foreign luxuries stored until market prices favor sale. These warehouses consolidate the scattered power of fishers, sailors, and merchants into institutions that negotiate with foreign factors and Crown officials from positions of genuine strength.\n\nThe Arsenals maintain the harbor chains that block enemy fleets, the lighthouses that guide friendly vessels through treacherous rocks, and the dry docks that can refit a dozen warships simultaneously. Innovations proven in one port spread along the coast within months rather than generations. By 1570, the saying went: "At a Sordish harbor you wait three days; at a Pwasciards Arsenal, three hours." The Grand Arsenals have made Pwasciards ports the most efficiently run, most profitable, and most defensible in western Edorinn."
 pwasciards_naval_glory: "The Tideblades"
 pwasciards_naval_glory_desc: "For generations, the Pwasciards relied on converted merchant vessels and hired foreign galleys to defend their waters—an arrangement that chafed at their pride and left them vulnerable when loyalty proved negotiable. That changed in 1421 when the Marcon Arsenal laid down the first Lame de Marée, or Tideblade—a purpose-built war galley that combined Pwasciards maritime expertise with innovations stolen, borrowed, and invented in equal measure. Sleeker than traditional galleys but sturdier than light raiders, the Tideblades mount bronze rams blessed by Tide Wardens and carry Marines trained specifically for boarding actions. Their shallow draft allows them to exploit the treacherous shoals and hidden channels of the coast that heavier warships cannot risk, while their distinctive three-masted rig—incorporating living wood from the Lutin Compact—makes them swift and responsive in coastal waters. Within a decade, the sight of their copper-green sails became a symbol of Pwasciards naval resurgence, promising safety to fishermen and dread to any foreign admiral foolish enough to challenge Pwasciardy in its home waters."
 pwasciards_modern_maritime: "The New Navigation"
 pwasciards_modern_maritime_desc: "The intellectual currents sweeping through Ardrainien universities and philosophical salons have found fertile ground on the Pwasciards docks. Unlike hidebound inland nobles who view new ideas with suspicion, Pwasciards captains and merchants have always adapted to survive—and they recognize useful innovations when they see them.\n\nShipwrights now design vessels using mathematical principles rather than tradition alone, calculating optimal hull ratios and sail configurations with geometric precision. Harbor engineers apply natural philosophy to warehouse construction, designing storage facilities that preserve grain longer and prevent timber rot. Navigators use improved astrolabes and mathematical tables to plot courses with unprecedented accuracy, while cartographers produce charts based on systematic surveys rather than accumulated guesswork. The fishing guilds, once governed by superstition and religious calendars, now impose seasonal restrictions based on careful observation of breeding cycles—ensuring stocks remain healthy while actually increasing long-term catches.\n\nPerhaps most revolutionary is the adoption of joint-stock ventures and double-entry bookkeeping by the great merchant houses. The Westmarch Company, the Salombre Trading Consortium, the Côte-de-Vent Colonial Society—these organizations pool capital from dozens of investors, spreading risk across multiple ventures and making possible expeditions that would bankrupt any individual house. Old captains still grumble about "merchants who can't read the sky," but they cannot argue with results: Pwasciards fleets dominate the western routes, and Pwasciards fish feeds half of Cannor. The sea hasn't changed, but our mastery of it has entered a golden age."

 ardrainic_heritage: "The Heritage of the Sword"
 ardrainic_heritage_desc: "For a thousand years, Ardrainic nobility has been forged in the crucible of war. From the age of seven, noble children train with master-at-arms in ancestral keeps, learning the deadly dance of blade and lance that has made Ardrainic knights the terror of battlefields from the Frozen Marches to the Inner Seas. Each great house maintains its own elite household troops trained to perfection, equipped with the finest armor the realm's smiths can forge, and bound by oath to their lord unto death. These warrior-aristocrats don't merely command from pavilions; they lead from the front, their heraldic banners marking the point of every charge. The sight of massed Ardrainic cavalry-nobles in gleaming plate flanked by their retainers-has broken countless armies and written the realm's glory in the blood of its enemies.\n\nYet this martial heritage demands a price: noble houses measure their worth in scars and empty saddles, and the vast cemeteries of great families tell stories of lineages bled white in service to crown and realm. As merchant wealth rises and common pike-formations prove their worth against cavalry, some question whether the old ways can endure-but tradition dies hard in a nation where a noble's sword-arm is considered more valuable than gold."
 
 ardrainien_chivalric_code: "Codes of Lumière"
 ardrainien_chivalric_code_desc: "The cornerstone of Ardrainic knighthood, Codes of Lumières bind warriors to an exacting code of conduct crystallized during the reign of King Théodain the Radiant. Knights swear upon blue-steel blades to uphold seven virtues: valor in battle, mercy to the vanquished, protection of the innocent, truth in word and deed, loyalty to liege and realm, courtesy to all ranks, and reverence for the ancient ways. Breaking an oath stains a knight's honor like rust upon steel - some seeking redemption through perilous quests, while others take the grey cloak of the Pénitents, wandering knights who serve without name or heraldry until their honor is restored."
 ardrainien_manor_economy: "Demesne Management"
 ardrainien_manor_economy_desc: "The rural heart of Ardrainic power, where noble houses govern sprawling estates worked by free tenants and bonded craftsmen. Each manor serves as both economic engine and administrative center-the lord provides protection, justice, and access to common lands, while tenants render service during wartime and tribute at harvest. The system has endured for centuries, though merchant wealth increasingly challenges its primacy. Great lords maintain networks of lesser manors, creating webs of obligation that can raise armies or feed cities in times of need."
 ardrainien_courtly_arts: "Les Grâces Éloquentes"
 ardrainien_courtly_arts_desc: "The refined pursuits that distinguish the civilized from the barbarous. Poetry, music, dance, rhetoric, and the elaborate courtship rituals known as the jeu d'amour. At the great courts in Valombre and Cieléclat, noble youth master the lute and the epigram alongside the sword, learning that a well-turned phrase can accomplish what steel cannot. The greatest practitioners become Maîtres des Grâces, arbiting disputes of taste and matters of honor through wit rather than blood. Tournaments of verse rival those of arms, and a devastating metaphor can ruin a reputation as surely as cowardice in battle."
 ardrainien_knights_errant: "Les Chevaliers du Chemin"
 ardrainien_knights_errant_desc: "Restless souls who reject the comfort of hall and hearth for the uncertain path of wandering justice. Some are younger sons seeking glory, others are oathbreakers pursuing redemption, and still others are idealists who believe true chivalry cannot be practiced from a throne. They travel the realm and beyond, righting wrongs, slaying monsters, and binding themselves to quests both sacred and foolhardy. Common folk welcome them as heroes; settled lords view them with suspicion as masterless swords who upset the social order. Their deeds become the stuff of songs, though most die alone and cold in some forgotten valley, far from the glory they sought."
 ardrainien_sisterhood_of_the_sword_maiden: "Sisterhood of the Sword Maiden"
 ardrainien_sisterhood_of_the_sword_maiden_desc: "When the siege of Cieléclat seemed lost and every lord's counsel had failed, a peasant girl bearing no arms but conviction marched at the head of a desperate sortie and broke the enemy line beneath a white banner. Whether she heard the voice of Lumière or merely refused to accept defeat, the realm remembers only the result: a city saved, an army reborn, and a legend that would not die with her.\n\nFrom that hour arose the Sisterhood of the Sword Maiden—an order of vowed warrior-women who take up blue-steel blades and plate, swearing to uphold the seven virtues of the Codes of Lumière upon the field of battle. No more than seven may stand in the Sisterhood at once, each Maiden representing one virtue, their white pennons raised where courage falters and steel grows cold. Skeptics call them fanatics; soldiers who have watched them charge call them salvation."
 ardrainien_noble_diplomats: "Envoys of the Silver Tongue"
 ardrainien_noble_diplomats_desc: "Aristocrats trained in the delicate art of statecraft and negotiation. These noble diplomats serve as the realm's voice in foreign courts, weaving alliances through charm, cunning, and an intimate understanding of courtly protocol."
 ardrainien_merchant_nobles: "The Counting Houses"
 ardrainien_merchant_nobles_desc: "Rising powers that troubles traditional aristocracy - noble houses who've embraced trade alongside landholding, building fortunes through banking, shipping, and guild monopolies. The Treaty of Argentfleur granted certain merchant families patents of nobility in exchange for financing the Crown's wars, creating a new class that bridges counting house and castle. They maintain the forms of chivalry while wielding ledgers as skillfully as swords, their younger sons trained in both courtly arts and commercial ventures. Old blood sneers at their "scented gold," but cannot ignore their growing influence in royal councils and marriage alliances."
 ardrainien_crown_nobility: "Noblesse de la Couronne"
 ardrainien_crown_nobility_desc: "The highest echelon of aristocracy, bound directly to the throne through oaths of fealty and blood. The Noblesse de la Couronne serve as the monarch's right hand, bearing the weight of rulership and the burden of ensuring the realm's continuity."
 ardrainien_enlightened_aristocracy: "The Crowned Philosophers"
 ardrainien_enlightened_aristocracy_desc: "A reform-minded faction within the nobility who embrace learning, rational inquiry, and progressive governance. Influenced by the New Learning emanating from the great universities, they establish schools on their estates, fund natural philosophers and alchemists, and experiment with novel agricultural techniques and laws. They argue that nobility carries the obligation to improve the realm through wisdom and justice, not merely tradition and force of arms. Some host salons where scholars debate freely with lords; others publish treatises on governance and ethics. Conservative nobles denounce them as dangerous radicals eroding the natural order, while radicals dismiss them as aristocrats playing at reform. Yet their ideas spread, particularly among younger heirs educated in the new ways."

 
 ringed_citizen_protoindustry: "Song of Industry"
 ringed_citizen_protoindustry_desc: "In chambers built for purposes no one remembers, workshops clatter with the mundane miracle of production. Ratfolk haul materials through passages humans won't fit in-mostly because the humans can't be brother to try-while masters oversee looms installed in halls where old glyphs still pulse with faint light nobody's bothered to study. The hammer-beat echoes off stone older than history, and somewhere a mechanism clicks over that's been clicking for a thousand years, doing... something, but every is assured it is important. The city's inhabitants don't need to understand the Rings to profit from them. Coal smoke rises through ventilation shafts carved by someone else's hands, and what the ancestors built for their own incomprehensible reasons, the living fill with the organized chaos of getting by."
 ringed_citizen_urban_guilds: "Urban Guilds"
 ringed_citizen_urban_guilds_desc: "The Compact carved the trades along lines of species and specialty, though everyone knows which side got the better deal. Human Glasswrights control repair of the irreplaceable ancient windows; ratfolk Scrimshanders get ivory and small-work that requires squeezing into spaces humans find undignified. The Stevedores' Brotherhood claims neutrality but somehow the human dockworkers always get the licensed positions while ratfolk haul the actual cargo. In exchange for monopolies and the Tribunal's convenient blindness to how guilds enforce their rules in the deep districts, they keep order where civic guards won't patrol and collect fees the tax assessors can't reach. The treasury fattens, the markets hum, and if you ask a guild-master whether the system's fair, they'll explain at length why fair isn't really the point."
 ringed_citizen_dynamic_society: "A Dynamic Society"
 ringed_citizen_dynamic_society_desc: "Birth still matters-everyone knows whose family held what before the Breach, whose grandfather sat on which council-but in quarters where three families share what was once a single room, proximity breeds a certain practical equality. A ratfolk with a head for figures can become a licensed factor, though she'll work twice as hard for half the respect. A human noble's fail son might end up stitching sails in the outer rings, and no amount of lineage will save him from cold fingers and the job-master's contempt. The city doesn't so much reward merit as it punishes inflexibility, and those who can navigate both the literal vertical maze and the social one find cracks where coin doesn't care whose hands hold it. It makes for a population that's restless, inventive, and constitutionally unable to leave well enough alone."
 ringed_citizen_early_urbanization: "The City Which Will Consume the World"
 ringed_citizen_early_urbanization_desc: "The gaps between Rings fill with new construction like scar tissue over old wounds. Timber and plaster cling to ancient stone, new buildings cantilevered out over streets that were once open air, and whole districts rise in the space of a generation as people flood inward from the drowned farmlands and outlying holds. The vertical city demands vertical growth, and builders race to claim every span of ancient wall, every abandoned platform, every space the Rings' unknown architects left empty. The republic's weight shifts toward these teeming corridors where a merchant can conclude ten deals in the time it takes a farmer to plow a furrow. The outer provinces still exist, technically, but the real business of governance happens here, in the press and stink and opportunity of the inner districts."
 ringed_citizen_trading_spirit: "Trading Spirit"
 ringed_citizen_trading_spirit_desc: "Merchant houses thread through the city's politics like water through cracked stone-ratfolk factor-clans managing the actual logistics while human trading families take meetings with the Tribunal's economic assessors. They commission ships to probe southern markets, insure cargoes against the storms and pirates everyone pretends are getting better, and seal partnerships with blood-oaths when contracts won't cover the gaps in trust. The Rings' half-salvaged maritime infrastructure makes the city an unavoidable stop for anyone trading the northern seas, and the merchant houses have gotten very good at extracting value from geographical necessity. It's not exactly a calling-more a mutual agreement that profit beats principle, and someone's going to control the chokepoint so it might as well be them."
 ringed_citizen_bustling_quarters: "Bustling Quarters"
 ringed_citizen_bustling_quarters_desc: "The Third Ring never quite sleeps. Hammers at midnight, warehouse doors grinding before dawn, ratfolk work-crews in the maintenance tunnels keeping ancient mechanisms running while human engineers argue about load-bearing calculations overhead. Every available surface hosts commerce or construction, buildings leaning inward like drunks holding each other up, and the stink of fresh mortar cuts through yesterday's fish and the perpetual marsh-reek from the north. The Tribunal's building inspectors have learned to be flexible in their interpretations of code, mostly because stopping the growth would be like stopping the tide. Where the inner citizens set the pace, the city grows opportunistically-sideways, upward, into spaces never meant for human habitation but perfectly sized for someone smaller and more desperate."
 ringed_citizen_city_learning: "City Learning"
 ringed_citizen_city_learning_desc: "Schools multiply in converted guild halls and repurposed spaces, children crowding onto benches beneath inscriptions no one can read, learning figures and letters while ancient mechanisms click and whir in the walls. The merchant houses fund academies because they need clerks who can parse contracts in Old Elven, Vulgar and High Moran, at least ten dialects of Adrainic and many more and who can spot creative accounting. The Tribunal sponsors administrative schools because the city's gotten too complex for the pious but innumerate. Ratfolk and human children sit in the same rooms, though they won't end up in the same positions, and everyone pretends the system's merit-based. Libraries salvage pre-Flood texts from the drowned quarters-mostly property records and tax rolls, disappointing anyone hoping for ancient secrets. What the city's learning boom produces isn't wisdom so much as capacity: more people who can read, calculate, and navigate bureaucracy, which turns out to matter more than philosophy when you're trying to run a vertical metropolis built inside someone else's ruins."
 ringed_citizen_trading_hub: "A Trading Hub"
 ringed_citizen_trading_hub_desc: "All routes funnel through the Rings whether merchants like it or not. The ancient docks and half-understood infrastructure create bottlenecks that the city's factors have weaponized into profit. Ratfolk warehouse-clans track inventory in multi-level complexes built into the Ring-walls, doing the actual work, while human brokers negotiate in counting-houses that occupy former ceremonial spaces and take the actual credit. Every consignment gains value in passage-sorted, repackaged, insured, taxed, and forwarded-and the Tribunal skims from this forced efficiency while pretending it's providing a service. The city's not so much a destination as an unavoidable inconvenience that's learned to charge for the privilege, and influence grows in proportion to how much it would hurt to go around. Some merchants complain, but they keep coming back, which is really all that matters."
 ringed_citizen_golden_age_art: "Golden Age Art"
 ringed_citizen_golden_age_art_desc: "New money needs new culture to distinguish itself from old money, and the merchant princes commission accordingly. Portraits of ratfolk factors in expensive silks-always carefully composed to minimize the rat features-hang beside human guild-masters rendered in oils with their warehouses in the background. Muralists paint commercial triumphs on walls that once bore inscriptions to gods nobody remembers, and the Tribunal sponsors altarpieces depicting saints against recognizable Ring architecture, as if the Eternal Faith had always been here and not arrived five hundred years after the stones were laid. Artists flock to patronage that asks fewer questions about propriety than pedigree, and some of the work's actually quite good. The republic gains prestige from galleries and public art, and the elite transform their ledger successes into something that might outlast the next flood, the next market collapse, the next whatever-because if there's one thing the Rings teach, it's that everything built eventually serves a purpose its makers never imagined."
 ringed_citizen_concentration_of_commerce: "Concentration of Commerce"
 ringed_citizen_concentration_of_commerce_desc: "Power pools where the money pools, which is to say the docks, warehouses, and guild-halls of the inner districts. The Tribunal's authority rests on taxes skimmed from regulated markets and loans extended by merchant houses too entangled to let fail, while trade councils speak with the kind of voice you can't ignore when they're holding that much of the economy. What started as commercial convenience becomes political reality-the interests of the inner citizens shape policy, laws bend toward facilitating trade, and even old families find themselves courting factor-princes whose warehouses contain more actual wealth than hereditary estates have seen in generations. The ratfolk remain largely excluded from the highest positions, of course, managing the flow of goods but rarely the flow of power, which seems to suit the humans who benefit from the arrangement. The Rings' commercial order becomes the republic's order, and the Tribunal governs through those who govern the markets, because at some point you have to acknowledge who's really running things."

 serenic_shared_heritage: "Children of the Serens"
 serenic_shared_heritage_desc: "The peoples along the Great River, whether Ardrain-tongued, speaking one of the dozen Torrenter dialects, or using the river-traders' pidgin, recognize each other by more than words. It's the shared saints whose names differ by language but whose feast days align, the way a levy from the upper Serens and a man-at-arms from the lower both know the same ribald songs about unfaithful wives, the unspoken agreements about which customs travel and which stay local. On campaign, soldiers divided by a hundred petty lordships find commonality in small things: the right way to shore a riverbank, complaints about the same tax collectors, a mutual contempt for inland peoples who don't understand that the river gives and takes in equal measure."
 serenic_river_trade_ways: "The Barge Right"
 serenic_river_trade_ways_desc: "Every significant town on the Serens lives by the rhythm of barges, grain flowing south, wine north, furs and worked metal moving both directions depending on season and war. The river people have made an art of conversion: translating Torrenter measures to Ardrain weights, knowing which guild masters in which cities can be bribed and which demand exact tallies, understanding that a cargo's value changes with every bend in the river. Merchants' sons learn to read water levels before they learn letters, can smell a cargo of spoiled grain three docks over, know that the real fortunes are made not in goods but in information about who's buying what and why."
 serenic_renaissance_learning: "Ink and Ledger"
 serenic_renaissance_learning_desc: "Letters and learning spread along the Serens like everything else, unevenly, commercially, impossible to control. A printer in one river city makes more on bawdy joke books than theological treatises, but publishes both because the scholar-priests pay in advance. Merchants teach their daughters accounting and discover they've accidentally created women who read philosophy; younger sons sent to study law return spouting classical rhetoric and questioning their fathers' business practices. It's not some grand flowering of human potential, it's practical literacy meeting idle curiosity meeting commercial opportunity, creating a class of people who can forge a decent contract, cite Aristotle poorly, and argue theology while drunk."
 serenic_unified_customs: "Common Law of the Waters"
 serenic_unified_customs_desc: "The Commonweal didn't erase local tradition so much as build around it, creating a framework where a Torrenter lawsuit could proceed in an Ardrain court, where three different marriage customs were equally recognized, where tax collection was standardized just enough that the crown got its due but local lords kept their prerogatives. It's an administrative compromise made flesh: the same saints' days observed with different rituals, contracts written in multiple languages on the same parchment, a shared assumption that the river matters more than which bank you were born on. Not unity, but a working agreement not to let differences interfere with commerce."
 serenic_crown_estate_legacy: "Ancient Prerogatives"
 serenic_crown_estate_legacy_desc: "The crown's lands along the Serens carry obligations that predate the Commonweal, ancient grants and services owed, families who've held the same mills and ferry rights for six generations, expectations of loyalty that run deeper than any oath. These estates form the spine of royal power not through military might but through sheer institutional inertia: the expectation that when the crown calls, certain lords answer because their grandfathers did, because the charters say so, because breaking faith with grants that old would unravel inheritance claims and trading privileges that half the river depends on. It's duty calcified into tradition, made unbreakable by self-interest.."
 serenic_modern_identity: "The New Serenics"
 serenic_modern_identity_desc: "By the later age, something new has emerged from the river towns, not quite Torrenter, not quite Ardrain, not the old Serenish trader culture either. It's the university-educated son of a Torrenter merchant house who writes poetry in Ardrain, marries across the river, and considers both banks equally home. It's the belief that mobility and learning matter more than blood, that a man's worth is measured in what he knows and who he knows rather than whose fields his grandfather plowed. This identity thrives in counting houses and printshops, law courts and coffeehouses, anywhere people value contracts over kinship and ideas over inherited title, a peculiarly modern smugness about being free from the old ways while profiting handsomely from them."

 A370_the_black_rose: "The Black Rose Compact"
 A370_the_black_rose_desc: "Never have we denied our heritage. For, while the other great houses of this commonweal trace their origins to some hero from the time of the Junil, or to the Kings from the days before, we trace ours to none other than one of the Dark Disciples, those who once ruled the world alongside the undying emperor. \n\nIt was in the closing days of the war, after the battle of two oaks when it plain to all with vision, that the Undying Emperor was to be the loser in the conflict. And it was then that our progenitor performed a quick calculation, for his mind was never a slow one. Two paths laid before him. He could remain loyal, and share in his master’s annihilation, as a Disciple ought; or he could purchase a life of subservience under the new order.\n\nNever have we denied the betrayal. He slew five of his fellow dark disciples in cold blood. Those who had ruled beside him, who perhaps thought of him as a brother in their dark covenant. Presenting their heads before the Junil and vowing to bring the whole of the South into the arms of the coalition, The Betrayer asked for amnesty, and gave his vow of loyalty.\n\nNever have we denied that we are welcome. But they took the heads, and they took the vow, and in return our house was guaranteed to survive. The Betrayer understood better than any hero among them, that survival is only victory that matters.\n\nNever have we denied that the Betrayer was loyal. Having made this vow, he kept it. Having served and dying within its service. And thus, our house has remained loyal to the Holy Commonweal since. Whether we once were, we are true after."

 A282_tradition: "The Liechtenauer Legacy"
 A282_tradition_desc: "The Lions preserve the oldest fighting treatises in the Aita Mountains, their vaults containing illuminated manuscripts detailing the German longsword tradition in exhaustive detail. Their monks drill the Vier Leger obsessively, teaching that proper structure and body mechanics create an unbreakable foundation, the "unbroken line" from feet through spine to blade. They favor the longsword above all weapons, treating it as the ultimate expression of martial geometry, and their advanced students learn to flow between guards with minimal wasted motion, making their defenses nearly impossible to penetrate through conventional attacks.."
 A283_tradition: "High Guard Doctrine"
 A283_tradition_desc: "Stationed at the highest, most brutal passes where thin air and killing cold test every fighter, the Sentinels developed a fighting system built around conserving energy and maximizing defensive efficiency. Their spear and halberd work emphasizes long-range control of approaches, keeping enemies at distance where the altitude affects them more severely. They train extensively in fighting while exhausted, wounded, or oxygen-deprived, and their signature technique involves patient, methodical dismantling of opponents who tire themselves with aggressive attacks in the thin mountain air."
 A284_tradition: "The Sixty-Four Graces"
 A284_tradition_desc: "The only Academy to fully integrate women into their martial ranks, the Princess monks study a hybrid system blending North African and Persian influences with indigenous mountain blade-dancing traditions. Their curved saber work emphasizes flowing, circular cuts that redirect force rather than meeting it head-on, combined with elaborate footwork patterns that double as moving meditation. The "Sixty-Four Graces" are paired forms practiced with a partner, teaching both combat application and the theological principle that opposition creates harmony, a controversial interpretation of the Eternal Faith that draws both fascination and criticism from more orthodox Academies."
 A285_tradition: "Void Hand and Broken Rhythm"
 A285_tradition_desc: "Founded by survivors of a monastery destroyed during the Undying Emperor's reign, the Ashes monks practice a system built around asymmetry and unpredictability. Their signature style abandons conventional rhythm, they train to strike on odd counts, pause at unexpected moments, and deliberately create openings that prove to be traps. They favor the messer and dagger combination, with extensive grappling and ringen work learned from their Swabian founders. Their philosophy holds that structure itself failed when their first monastery fell, so they built a school around controlled chaos and the acceptance of incompleteness."
 A286_tradition: "The Four Pillars Method"
 A286_tradition_desc: "The most diplomatically connected Academy, the Warriors maintain relationships with lowland fighting schools and continuously adapt their curriculum with new techniques. Their system is built around mastery of four weapon categories: longsword, spear, dagger, and unarmed grappling, the "four pillars" supporting any martial education. They're pragmatists who argue that no single tradition holds all answers, and their monks often travel to study in lowland academies before returning to teach. Some call them eclectic; others call them dilettantes. They're undeniably effective in mixed-weapon tournaments."
 A287_tradition: "The Tyrant's Answer"
 A287_tradition_desc: "The Disciples preserve the techniques developed specifically to kill armored knights and mounted enforcers. Their pollaxe work is vicious and direct, built around powerful strikes to joints and visor slits, while their anti-cavalry techniques teach systematic hamstringing and unhorsing. They practice extensive armored combat, teaching their monks to fight in full harness so they understand exactly how to exploit its weaknesses. Their philosophy rejects the chivalric pretenses of lowland combat, fighting isn't beautiful performance, it's the tool that shatters crowns and breaks chains."
 A288_tradition: "Snow Ghost Fighting"
 A288_tradition_desc: "Operating in the highest valleys where snow lingers eight months of the year, the Pale Abbots developed a system built around environmental exploitation. Their footwork training begins by learning to move silently through snow, then progresses to maintaining balance on ice, and finally to using winter conditions as weapons. They favor the war hammer and mace, weapons effective against both armor and frozen flesh, and train extensively in fighting while encumbered by heavy winter gear. Their advanced students learn to use snowdrifts for cover, ice-slicked slopes for tactical advantage, and the sound-deadening properties of snowfall for ambush."
 A289_tradition: "Strength of the Mountain"
 A289_tradition_desc: "The Highland Bears practice the most physically demanding style in the confederation, built around raw strength, clinch fighting, and devastating throws. Their ringen curriculum draws from alpine wrestling traditions, teaching monks to use superior conditioning and grip strength to dominate opponents. They favor heavy weapons, greatswords, two-handed axes, war hammers, and train by carrying stones up mountain paths and grappling while wearing weighted vests. Their philosophy holds that technique without strength is theory, and their fighters are notorious for simply overpowering more refined opponents through superior athleticism."
 A290_tradition: "The Perfect Form Discipline"
 A290_tradition_desc: "The Twelfth Temple teaches that every technique has an ideal execution, and their training focuses on achieving perfection through endless repetition. Their sword work draws from Italian traditions, particularly Fiore dei Liberi's systematic approach to technique categorization. Monks drill specific plays thousands of times until they become reflexive, and advancement requires demonstrating techniques against resistance with near-flawless form. Critics call them rigid; their students simply execute fundamental techniques with terrifying precision, proving that "basic" done perfectly defeats "advanced" done sloppily."
 A291_tradition: "Strike Like Diving Talons"
 A291_tradition_desc: "The Hawks specialize in explosive, single-tempo attacks launched from unexpected angles. Their system emphasizes reading stance and micro-movements to identify the split-second when an opponent is committed and vulnerable, then attacking with total commitment in that instant. They favor the rapier and sidesword, weapons that reward precision and timing over raw power, and their advanced training involves blindfolded sparring to heighten sensitivity to sound and air movement. Their philosophy teaches that hesitation is death, better to commit to the wrong attack decisively than to execute the right one tentatively."
 A292_tradition: "The Soundless Step"
 A292_tradition_desc: "The Path monks integrate meditative practice directly into martial training, teaching that internal stillness manifests as external efficiency. Their unarmed system draws heavily from yogic traditions, emphasizing breath control, flexibility, and the redirection of force through relaxation rather than tension. They practice moving without sound, striking without telegraph, and most distinctively, they teach advanced students to fight while maintaining meditative breathing patterns. Their signature technique involves using an opponent's aggression against them through minimal, precise interventions rather than forceful blocks."
 A293_tradition: "The Clarion Defense"
 A293_tradition_desc: "Founded specifically to protect pilgrim routes through the mountains, the Bell monks developed a defensive system built around formation fighting and coordinated group tactics. Their spear and shield work emphasizes maintaining formation integrity while protecting civilians, and they drill extensively in fighting outnumbered against bandits and raiders. The "Clarion" refers to their practice of using voice commands and bell signals to coordinate tactical movements, they're one of the few Academies to truly systematize group combat rather than focusing primarily on individual dueling."
 A294_tradition: "The Empty Hand Returns"
 A294_tradition_desc: "The Silent Peak teaches a deceptive fighting system where techniques appear incomplete or inefficient until the practitioner understands the hidden completion. Their armed work focuses on dagger and short weapons, optimized for the narrow mountain paths where long weapons become liabilities. They're renowned for their ability to disarm opponents and then use the captured weapon against its owner, the "empty hand returns" holding steel. Their training emphasizes adaptability and opportunism, teaching students to flow between armed and unarmed combat seamlessly."
 A295_tradition: "The Ordeal Combat Doctrine"
 A295_tradition_desc: "The Vigil Judges maintain the legal tradition of trial by combat within the Stone Oath confederation, and their system reflects this judicial function. They train extensively in formal, regulated dueling across multiple weapon sets, as they must be prepared to serve as neutral champions or judges in disputes between Academies. Their style emphasizes measured, controlled violence, the ability to wound without killing, to disarm without maiming, to demonstrate superiority without dishonor. They study legal precedent as intensively as combat technique, and their advanced students can argue theological points of law while simultaneously fighting."
 A296_tradition: "Dawn Blade Philosophy"
 A296_tradition_desc: "The Amethyst monks train exclusively at high altitude where the dawn sky turns deep purple, and they've developed a fighting system synchronized with diurnal rhythms and atmospheric conditions. Their sword work incorporates principles of light and shadow, teaching students to use the blinding glare of sunrise and sunset as weapons. They practice at specific times of day, believing that fighting at dawn sharpens perception while evening training builds endurance. Their philosophy intertwines martial practice with astronomical observation, treating the movement of celestial bodies as a macro-pattern reflecting proper combat timing."
 A297_tradition: "The Last Service"
 A297_tradition_desc: "Founded by monks who served as executioners during the revolution against the Undying Emperor, the Final Sorrows preserve techniques for efficient, merciful killing. Their system focuses on single, decisive strikes that end fights immediately, they teach precise targeting of fatal points on the human body and train to overcome the psychological resistance to killing. They favor the executioner's sword and great axe, weapons designed to sever in one blow. Their philosophy is grim but necessary: sometimes the greatest mercy is a quick death, and someone must have the skill and resolve to deliver it."
 A298_tradition: "The Harvest Forms"
 A298_tradition_desc: "The Autumn monks developed their system around the agricultural rhythms of their prosperous valley holdings, and their techniques reflect the biomechanics of farming labor. Their polearm work evolved from scythe and flail techniques, teaching wide, sweeping cuts that clear multiple opponents like wheat before a blade. They emphasize economy of motion learned from year-round physical labor, and their conditioning comes from actual farmwork rather than abstract training. Their philosophy holds that martial skill should grow from practical movement patterns, making their style accessible to common farmers while remaining effective against trained fighters."
 A299_tradition: "Controlled Descent"
 A299_tradition_desc: "The Eagles teach a fighting system built around measured, proportional response, the martial expression of mercy within violence. Their longsword work emphasizes winding and binding, controlling the opponent's weapon while creating opportunities to strike non-lethal targets. They train extensively in subduing rather than killing, in disabling rather than destroying, reflecting their theological position that even justified violence should be tempered by compassion. Their advanced students learn to read an opponent's skill level during engagement and adjust their response accordingly, overwhelming force against the dangerous, restraint against the merely foolish."
 A300_tradition: "The Unpredictable Path"
 A300_tradition_desc: "The most controversial Academy, the Drunken Fist monks practice a system that deliberately appears uncontrolled and chaotic while maintaining hidden structure beneath the disorder. Their footwork staggers and weaves, their guards seem vulnerable, their strikes come from impossible angles. Whether they actually drink during training remains a subject of rumor and debate, but their effectiveness is undeniable, opponents trained in conventional systems struggle to apply their techniques against movement that violates expected patterns. Their philosophy embraces paradox: rigid discipline creates the foundation for apparent chaos, and true freedom comes from mastering constraint."
 A301_tradition: "Swarm Tactics"
 A301_tradition_desc: "he Sunstone Bee developed their system for operating in coordinated small units rather than individual combat, treating the fighting group as a single organism. Their short spear and shield work emphasizes rapid position switching, with individuals rotating between aggressive and defensive roles fluidly. They drill in groups of five or seven, practicing coordinated attacks where each fighter's movement creates openings for their companions. Their name refers to both their yellow-and-black training garments and their tactical philosophy: like bees, they're individually fragile but collectively overwhelming, and they're willing to sacrifice individual safety for group success."
 A302_tradition: "Whirlwind Forms"
 A302_tradition_desc: "The Tornado monks practice a high-energy, continuously moving style that never allows them to become stationary targets. Their system builds around spinning strikes and rotating footwork, using centrifugal force to generate power while constantly changing angles. They favor weapons that reward momentum, the two-handed saber, the chain whip, and weighted pole arms, and their training emphasizes cardiovascular endurance over raw strength. Their philosophy teaches that stillness is death; a fighter in motion controls tempo and space, while a stationary fighter merely reacts. Critics call it exhausting showmanship. Their students call it surviving against multiple opponents."
 A303_tradition: "The Demonstrative Path"
 A303_tradition_desc: "The Radiant Star openly embraces the performative aspects of martial arts, teaching that public demonstration serves both practical and theological purposes. Their system incorporates elaborate flourishes, dramatic poses, and techniques designed to be visually impressive while remaining combat-effective. They've developed the most sophisticated acrobatic curriculum in the confederation, including aerial techniques and spectacular disarms. Their philosophy holds that martial beauty glorifies the divine and that inspiring awe can end conflicts before violence begins. They're simultaneously the most popular Academy for public exhibitions and the most dismissed by purists, until those purists actually fight them and discover that flash doesn't mean ineffective."
 A304_the_storm_peaks: "The Storm Peaks"
 A304_the_storm_peaks_desc: "Every mountaintop in the Aitan range has been marked by us. The paths are treacherous, the winds is relentless, and the peaks are home to monsters, yet Aitas remains our home. This isolation suits us well, closer to the vaults and ancient machineries we not yet know. The universe is yet un-measured, and not yet fully pondered."
 bonwesforian_blood_borne: "Bloodborn"
 bonwesforian_blood_borne_desc: ""Let the contract be sealed in mingled blood, witnessed by the red moon..."\n\nThe first colonists who came to Bonwesfor found a land transformed by cataclysm, its soil bleeding red. The old families who'd survived the transformation understood what outsiders didn't, the land was changed, and survival required adaptation. Blood contracts weren't tradition but necessity; the magically contaminated earth responds to blood, recognizes it, enforces oaths sealed in it. Those who break blood pacts sicken and suffer misfortune because the land itself holds them accountable. The fragile peace between old blood families, desperate Ringed City refugees, and Commonweal authorities was forged through these binding rites. Everyone contributes blood. Everyone is held to the same cursed standard. It's the only equality Bonwesfor offers."
 bonwesforian_fen_wardens: "Fen Wardens"
 bonwesforian_fen_wardens_desc: "For generations, Bonwesforian folk have navigated the treacherous bloodmarsh fens, learning every safe path through the red-tinged waters and knowing which iron-rich bogs would swallow a man whole. This knowledge proved invaluable during border conflicts with neighboring territories. A local marshal, Rothgar the Red-Handed, formalized these marsh scouts into proper military units, later known as the Fen Wardens. Armed with Bonwesfor steel and intimate knowledge of terrain that breaks foreign armies, these rangers excel at ambush, rapid movement through "impassable" marshland, and turning the blood-red fens into a defensive nightmare for any invader foolish enough to march into the lowlands."
 bonwesforian_shadow_of_the_city: "Shadow of the Colosuss"
 bonwesforian_shadow_of_the_city_desc: "The ancient Ringed City looms over Bonwesfor like a geometric accusation, pristine stone circles that cast long shadows over those blood-soaked marshlands. In times long past, an entire super stucture's worth of sewage flowed into what became Bonwesfor. Wealthy Bonwesforian merchants build manors imitating the rings' perfection, but rendered in red brick that weeps rust-colored streaks, these precise angles look like mausoleums. Meanwhile, the Ringed City's outer districts have quietly adopted Bonwesfor's practical architecture, raised foundations, efficient drainage, while maintaining they have nothing to learn from marsh-folk. Neither population acknowledges their architectural dialogue, just as neither speaks of what the ancient city was built to do, or why it required so much blood. The shadow remains, and under it, both populations endure."
 bonwesforian_the_surgeons_calling: "Surgeon's Calling"
 bonwesforian_the_surgeons_calling_desc: "Bonwesforian physicians have performed transfusions that should fail, surgeries that should kill patients, amputations that never infect. Understanding blood at a fundamental level, for their blood is thicker, darker, with properties that shouldn't exist. The medical school dissects constantly, studying how contamination alters organs, tracking mutations across generations, developing procedures that work with the corruption rather than against it. Other regions find Bonwesfor doctors invaluable and deeply unsettling, they're brilliant but too comfortable with cutting, too casual about blood, too good at knowing which patients won't survive. The Church debates whether this knowledge is medical science or something darker. Bonwesfor surgeons ignore the debate and keep saving lives, one contaminated body at a time."
 
 bonwesforian_tainted_harvest: "Tainted Harvest"
 bonwesforian_tainted_harvest_desc: "The soil bleeds.\n\nNot metaphorically, cut into the deep earth and red liquid seeps out, iron and alchemical residue and something else, something that makes crops grow with unnatural vigor. Bonwesfor farmers have learned to manage this through generations of horrible trial and error: exactly how much blood to add to already-contaminated soil, which crops adapt best, how to prevent the plants from growing wrong. The yields are exceptional. The grain has a pink tinge. The vegetables are oversized. Livestock fed on Bonwesfor fodder grow huge and aggressive, their meat dark and rich. Eating this food long-term changes you, your blood thickens, your body adapts, you develop dependencies.\n\nBonwesfor feeds half of Torrent, and half of Torrent is slowly becoming contaminated without realizing it. The old blood families know this. They've been exporting the curse for generations. What else are they supposed to do? Let people starve?"
 
 bonwesforian_blood_moon_rising: "Land of the Blood Moon"
 bonwesforian_blood_moon_rising_desc: "When the autumn harvest begins, travelers departing Bonwesfor witness something impossible: they look back and see the moon hanging rus-red and swollen over the marshlands, yet when they look up at their own sky, it appears normal-pale silver, unchanged. The blood moon exists only over Bonwesfor. Stand at the border and watch it shift from crimson to white as your perspective crosses an invisible line. Under the crimson glow, the contamination in people's blood activates: violence spikes, the Fen Wardens' night vision sharpens to near-supernatural levels, pregnant women go into early labor, and always, someone goes missing into the deep fens. The old blood families claim they can hear the land breathing during blood moons, a slow pulse matching their own heartbeat. Track the disappearances over decades and the pattern is undeniable, the bog body count grows month by month. Foreign scholars can explain the optics but not why the contamination remains geographically contained, why it persists after centuries, or why standing under that red light feels like being watched."
 
 bonwesforian_the_crimson_vintners: "The Crimson Vintners"
 bonwesforian_the_crimson_vintners_desc: "Bloodwort wine isn't just wine, it's contamination in liquid form, refined and aged until it becomes something nobles across Torrent crave despite knowing better. The bloodwort vines grow in soil enriched with blood and alchemical runoff, producing grapes that are nearly black, their juice deep crimson. Fermented in contaminated water, aged in barrels sealed with blood-contracts, the resulting wine has properties no natural vintage possesses: it heightens senses, quickens healing, produces euphoria, and slowly, subtly contaminates those who drink it regularly. Wealthy consumers develop dependencies, find normal wine insipid, notice their blood runs a bit darker. The vintners know exactly what they're doing. They're exporting the curse one bottle at a time, creating customers who can't quit, spreading Bonwesfor's corruption through the upper classes. Some do it for profit. Some do it for revenge against a world that looks down on them. Most do it because it's just business."

 takkev_horsemanship: "Tajjevi Horsemanship"
 takkev_horsemanship_desc: "The Tajjevi highlanders have bred hardy horses and raised light cavalry for generations."
 takkev_desert_warfare: "Takkev Desert Warfare"
 takkev_desert_warfare_desc: "Centuries of fighting across the arid highlands and passes of Takkev have shaped the Tajjevi art of desert warfare."
 takkev_cavalry_advance: "Tajjevi Cavalry"
 takkev_cavalry_advance_desc: "Unlocks Tajjevi Cavalry for the highlanders of Takkev."

 khyresh_the_crater_garden: "The Thousand Gardens"
 khyresh_the_crater_garden_desc: "Beyond The Crater's walls, water is worth more than its weight in gold. Within them, there are fountains, flooded courtyards, groves heavy with fruit the desert would not allow. Orginally begun by the ancient Khyreshi as a means by which to express their power and wealth, succesive generations have taken to added and cultivating their gardens. The practice as since spread throughout Khyreshi culture, as now most villages and towns boast public gardens, serving as places of spiritual cultivation and relaxation."
 khyresh_the_crater_civilization: "The Crater of Civilization"
 khyresh_the_crater_civilization_desc: "Surrounded on all sides by the crater's great walls, sheltered from a mercilous desert beyond, the earliest Khyreshi civilization grew in comfort and peace."
 khyresh_star_blades: "Starforged Steel"
 khyresh_star_blades_desc: "Forged under the glow of a clear night sky, and smelted from ore found only within the crater's ancient walls, the Star Blades of Khyresh are renowned throughout the world for their unparalleled quality."
 khyresh_the_crater_coast: "Our Sea"
 khyresh_the_crater_coast_desc: "All roads may lead to Moras, but every sea in the world finds its way to Khyresh."

 torrentor_age_1: "Coalition Veterans"
 torrentor_age_1_desc: "At its zentih, the armies of The Junil's Alliance were the most formidable fighting force thus far ever assembled by the mortals of this realm. A verstaile army, of each peoples supporting each other in a synergistic capacity. A giantsborne spear wall, supported by elven mages to ward off dark magics, with the armored fist of Ardranic heavy calvary on the flanks. Each had their place, and together they were unstopable. The unholy forces of the Undying Emperor tried countless times to break us, but we triumphed. While we look aupon this days with bittersweet regret for what came after, the spread of military tactics and doctrines between the nations has bolstered them all."

 torrentor_martial_traditions: "Martial Traditions"
 torrentor_martial_traditions_desc: "The Torrentor peoples have maintained strong military traditions passed down through generations, allowing them to raise and organize forces with remarkable efficiency."

 torrentor_renaissance_merchants: "Renaissance Merchants"
 torrentor_renaissance_merchants_desc: "The merchant houses of the Torrentor lands have flourished during the Renaissance, establishing trade networks that span the continent and beyond."

 torrentor_exploratory_spirit: "Exploratory Spirit"
 torrentor_exploratory_spirit_desc: "Driven by curiosity and opportunity, Torrentor merchants and adventurers have pushed the boundaries of known trade routes, seeking new markets and resources."

 torrentor_unified_customs: "Unified Customs"
 torrentor_unified_customs_desc: "Through centuries of coexistence under the Commonweal, the various Torrentor cultures have developed shared customs and practices that facilitate integration and cooperation."

 torrentor_crown_authority: "Crown Authority"
 torrentor_crown_authority_desc: "The central authority of the crown has been strengthened across the Torrentor lands, consolidating power and establishing a more unified administrative structure."

 torrentor_modern_identity: "Modern Identity"
 torrentor_modern_identity_desc: "The Torrentor peoples have forged a modern identity that transcends traditional boundaries, embracing progress and innovation while maintaining their distinct cultural heritage."

 hac_the_covenant: "The Covenant of Ends"
 hac_the_covenant_desc: "The Coalition that marched with The Junil signed a document in the aftermath of the Undying Emperor's defeat. The Eternal Faith calls it the Covenant of Ends, the end of the war, the end of the old world, the beginning of the new. It was drafted by the Junil with input from every major faction in the Coalition: human lords, elven grove-wardens, ratfolk trade councils, giantsborn clan-speakers, the representatives of a dozen migrant peoples who had crossed half the known world to find somewhere that wasn't broken.\n\nIt establishes the Holy Commonweal as a commonwealth in the original sense: held in common, governed in common, its authority deriving from the consent of its constituent peoples rather than from bloodline or divine right. It establishes rotating leadership, collective decision-making, protections for minority communities that were extraordinarily progressive for the period. It treats the elven, ratfolk and giantsborn signatories as equal partners without qualification or caveat.\n\nIt is, by every modern metric of the Holy Commonweal's actual governance, almost entirely unenforced."
 hac_the_compact: "The Compact of Edorinn"
 hac_the_compact_desc: "In 1107, the Junil's victorious coalition formalized what the Covenant had only promised: a permanent union of the peoples of western Edorinn. The Compact of Edorinn bound the thirteen founding tribes and their allies into the Holy Commonweal, pledging mutual defense, shared governance, and the right of every signatory community to preserve its own customs, tongue, and faith within the greater whole.\n\nWhere earlier agreements had ended the war, the Compact began the work of living together. It created the institutions that would outlast any single Supreme Commander and made room for the many cultures swept westward by the Cataclysm to find a place in the new order without surrendering what made them distinct."
 
 beren_order_of_the_peak: "Order of the Grey Oak"
 beren_order_of_the_peak_desc: "Founded by Lady Adela the Resolute, the Order of the Grey Oak stands as Berenland's most prestigious military brotherhood. Knights of the Grey Oak swear to defend the Berenland, protect travelers on the border roads, and uphold justice in the marches where authority grows thin. Their badge, a grey oak on green, is recognized throughout the borderlands as a mark of proven valor and steady honor. Unlike lowland orders grown ceremonial, the Grey Oak maintains its founding purpose: its knights still ride patrol along disputed borders, garrison the march-forts, and lead the muster when beacons flare warning of invasion. Membership is selective, with roughly four hundred sworn knights at any time, but they have proven themselves to be worth armies."
 sorlkol_warrior_monks: "Warrior Monk Tradition"
 sorlkol_warrior_monks_desc: "The Academies train warrior-monks who combine martial mastery with religious devotion to the Eternal Faith, serving as both defenders and enforcers of the Stone Oath compact."
 stone_oath_trade_network: "Mountain Trade Network"
 stone_oath_trade_network_desc: "Maturation of inter-Academy commerce and pass toll systems connects mountain Academies to distant lowland markets through established trading relationships."
 stone_oath_academy_system: "Academy Fortress System"
 stone_oath_academy_system_desc: "Each Academy functions as fortified monastery, administrative center, and martial training ground, the foundation of territorial control across the mountain cantons."
 stone_oath_pass_trade: "Pass Trade Routes"
 stone_oath_pass_trade_desc: "Ancient caravan routes through Academy-controlled passes facilitate trade between eastern and western Edorinn, generating tariff revenue and commercial connections."
 stone_oath_mountain_warfare: "Mountain Pass Doctrine"
 stone_oath_mountain_warfare_desc: "Centuries defending high-altitude passes have created unique tactical doctrines exploiting terrain, altitude, and chokepoints against lowland armies."
 stone_oath_lynx_goats: "Lynx-Goat Cavalry Tradition"
 stone_oath_lynx_goats_desc: "Select Academies maintain cavalry mounted on lynx-goats, carnivorous hybrid beasts combining feline predatory instincts with caprine sure-footedness, capable of navigating sheer cliffs and narrow passes where horses would stumble."
 sorlkol_butter_economy: "Ibex-Cattle Dairy"
 sorlkol_butter_economy_desc: "Academy herds of ibex-cattle, graze on nearly vertical alpine meadows inaccessible to normal livestock, producing extraordinarily rich milk that yields premium butter and cheese prized across Edorinn."
 
 A46_the_wryne_benefactor: "The Wryne Benefactor"
 A46_the_wryne_benefactor_desc: "The County of Wryne has long been plagued by the usual troubles -smuggling rings, corrupt officials, and organized criminal guilds who grow bold in the shadows. Yet in recent decades, a curious pattern has emerged. Crime has plummeted in Wryne's cities, but not through the usual channels of law enforcement. Thieves are found bound in elaborate knots hanging from lampposts. Corrupt magistrates discover incriminating evidence of their own schemes delivered anonymously to the Crown. Smugglers speak in terrified whispers of a winged shadow that descends from the rooftops without warning, moving with inhuman speed and striking with brutal efficiency. The County Guard insists they have no special operatives working the night watch, yet someone clearly does. The local nobility, when pressed, speak only of a "concerned citizen" who funds orphanages and infrastructure projects through anonymous donations—always delivered at night, always in cash, always accompanied by detailed reports of criminal activity that somehow escaped official notice. The common folk have taken to calling this mysterious figure the "Night Guardian," and mothers now warn misbehaving children that if they turn to crime, the shadow will find them. Wryne's criminals have learned to fear the darkness, and the County prospers for it."
 
 A46_caped_crusaders: "Legacy of the Caped Crusader"
 A46_caped_crusaders_desc: "During the Moran Crusades, Wryne County sent forth one of its most celebrated champions: Sir Bertain of Wryne, whose distinctive black cape became legendary across the battlefields of Godhand. While other knights favored practical tabards, Sir Bertain insisted on his flowing cloak, claiming it struck fear into the unliving hordes and gave him an imposing silhouette against the pale southern skies. His comrades mocked him at first—until they witnessed him use the weighted cape to deflect arrows, entangle skeletal warriors, and even glide short distances from fortress walls during desperate sieges. The "Caped Crusader," as he became known, returned home a hero, and his signature garment became a symbol of Wryne's martial prowess. To this day, the County Guard's elite units wear ceremonial black capes in his honor, and the most prestigious military decoration one can receive is the Order of the Cape—a clasp shaped like a bat-winged mantle. Cynics note that Sir Bertain's cape was perhaps more dramatic than practical, but none can deny its effectiveness as a symbol. The sight of those black capes billowing in the wind has come to represent justice, protection, and the unshakeable resolve of Wryne's defenders."

 ratfolk_warren_craft: "Warrencraft"
 ratfolk_warren_craft_desc: "Ratfolk do not see garbage. They see components. This perceptual difference — infuriating to those who share living space with them — produces craftspeople of extraordinary resourcefulness. A ratfolk tinker working from a scrap pile will produce something functional. Whether it will be beautiful is a separate question the tinker considers beneath their dignity to answer."
 ratfolk_tunnel_networks: "The Warm Warrens"
 ratfolk_tunnel_networks_desc: "There is a particular quality of light in a ratfolk home — always more candles than necessary, furniture arranged so that everyone is close enough to touch, the smell of food at every hour because there is always someone just back from somewhere. Guests are fed before they are asked why they came. Children belong collectively to whichever adult they happen to be nearest, old people are not sent anywhere but simply incorporated, their chair moved closer to the fire. Outsiders who expected squalor describe something else entirely: the unsettling warmth of a people who have decided, in the face of every reason not to, that the people around them are worth the trouble. Everyone who has ever been welcomed into a ratfolk warren and then had to leave describes the leaving as the hard part."
 ratfolk_swarm_tactics: "Swarm Tactics"
 ratfolk_swarm_tactics_desc: "Ratfolk armies rely on numbers and coordination rather than individual prowess. Drilled to fight in dense formations and to replace fallen comrades without breaking, they field more manpower and strike harder with their infantry when the tide of bodies rolls forward."
 ratfolk_undermarket_guilds: "Undermarket Guilds"
 ratfolk_undermarket_guilds_desc: "Merchant councils that coordinate trade through the tunnel routes have formalized into guilds. They extend the reach of ratfolk commerce and strengthen the hand of those who control the flow of goods through the undermarkets."
 ratfolk_breeding_grounds: "Breeding Grounds"
 ratfolk_breeding_grounds_desc: "Managed warrens dedicated to ample litters and grain stores have become a pillar of ratfolk society. Surplus food and rapid population growth allow more of the young to rise into soldiers, clerks, and merchants."
 ratfolk_scout_bands: "Scout Bands"
 ratfolk_scout_bands_desc: "Light bands trained to move through hills and narrow passes gather intelligence and harass invaders. Their presence raises army tradition and makes hostile territory costlier for enemies who do not know the paths."
 ratfolk_warren_guard: "Warren Guard"
 ratfolk_warren_guard_desc: "Elite garrisons raised from the deepest warrens are equipped and trained to hold tunnels and fortified burrows. Unlocks the Warren Guard unit and the Warren Barracks building."
 ratfolk_warren_handgonners: "Rattokar’s Thunder"
 ratfolk_warren_handgonners_desc: "Rattokar the Great is remembered for many things — the unification of the Freeholdic city-states, the Grimwall Accords, the administrative reforms his successors dismantled within a generation and spent the next centuries quietly reinstating. Yet his chroniclers argue most fiercely about the guns. Whether he invented gunpowder, acquired it, or merely grasped its meaning first is unclear. What is clear is what he did with it.\n\nBetween 1261 and 1308, his armies swept through the Adventurer Kingdoms with a consistency that their hosts could not explain and refused to attribute to tactical genius — it was easier to blame the weapons.  Rattokar looked at ratfolk levies—small, lightly built, dismissed for generations—and saw that their disadvantages no longer mattered. Plate and warhorse had begun to lose their power in smoke and noise.\n\nRattokar died in 1337, and his empire unraveled almost immediately, his self-appointed heirs united only in their refusal to agree. The guns, however, did not go back into the box. That particular thunder, once loosed, found its way into every ratfolk community that remembered what Rattokar had proven — that the battlefield had changed, and that it had changed in their favor."
 ratfolk_far_tunnels: "World of Warrencraft"
 ratfolk_far_tunnels_desc: "Where ratfolk go, ratfolk follow. Not immediately, and not always intentionally — but a ratfolk factor who settles in a new city will, within a generation, have a nephew in the next one, and a litter-mate's daughter in the one after that. What this produces, over centuries of dispersal, is something that looks from the outside like a trading network and feels from the inside like an extended family that happens to span the continents. Letters travel between these communities carrying prices, warnings, opportunities, and gossip in roughly equal measure. Credit extends across distances that would make a human merchant nervous, backed not by contracts or courts but by the knowledge that everyone in the warren knows who you are and who your grandmother was. A ratfolk merchant arriving in an unfamiliar city finds a community that will house him, feed him, and tell him who to trust and who to avoid before he has unpacked his bags. His competitors, who have none of this, find the arrangement difficult to explain and impossible to replicate."
 ratfolk_grain_hoards: "Grain Hoards"
 ratfolk_grain_hoards_desc: "Centralized granaries and cellars beneath settlements stabilize supply and raw output. Development creeps upward and the realm draws more from its mines, fields, and forests."
 ratfolk_plague_resilience: "The Plague Survivors"
 ratfolk_plague_resilience_desc: "Whether ratfolk spread disease, endure it, or simply understand it better than most is a matter of ongoing scholarly dispute that ratfolk themselves find exhausting. What is undeniable: ratfolk community healers have developed practical disease management traditions born of necessity."
 ratfolk_tunnel_runners: "Tunnel Runners"
 ratfolk_tunnel_runners_desc: "Specialized troops and depots use the undermarket to move goods and strike from unexpected directions. Unlocks the Tunnel Runners unit and the Undermarket Depot building."
 ratfolk_scribal_warrens: "Scribal Warrens"
 ratfolk_scribal_warrens_desc: "Scriptoria and schools established in the warrens spread letters and calculation. Research quickens and literacy rises as knowledge is no longer the preserve of a few surface scholars."
 ratfolk_estate_burrows: "Estate Burrows"
 ratfolk_estate_burrows_desc: "The crown's presence in the undermarket is formalized through estate burrows—administrative nodes that channel crown authority and give the assembly's voice a firmer base of support."
 ratfolk_plague_corps: "Plague Corps"
 ratfolk_plague_corps_desc: "Veteran regiments that have survived sieges and contagion are organized into standing Plague Corps, and breeding warrens are expanded to support them. Unlocks the Plague Corps unit and the Breeding Warren building."
 ratfolk_grand_undermarkets: "Grand Undermarkets"
 ratfolk_grand_undermarkets_desc: "The greatest tunnel-hubs become grand undermarkets: tariff posts, warehouses, and exchanges that improve trade efficiency and reduce the cost of building in urban warren districts."
 ratfolk_warren_garrisons: "Warren Garrisons"
 ratfolk_warren_garrisons_desc: "Garrison doctrine is standardized so that every major warren can hold more troops and present a stiffer defense. Garrison size and defensive bonuses rise across the realm."
 ratfolk_people_assembly: "Senatus Populusque Rattus"
 ratfolk_people_assembly_desc: "The ratfolk have never been comfortable with the idea that one person should make decisions for all of them. Too many opinions, too many cousins with grievances, too many litter-mates who remember things differently. What emerged from this collective stubbornness was not democracy in any philosophical sense — it was something more practical and considerably louder. The assembly meets, everyone speaks, nobody agrees, and eventually a consensus claws its way out of the argument like a rat from a flooded drain. It is not elegant. What it is, is legitimate — and a populace that feels heard pays its taxes with significantly less creative accounting than one that does not."
 ratfolk_warren_clockwork: "Small Hands, Precise Work"
 ratfolk_warren_clockwork_desc: "Ratfolk fingers are narrow and dexterous in ways that make watchmakers and surgeons envious. The finest clockwork in the Pellene was assembled by ratfolk hands. So was the most delicate lock ever made — and, on the other side of the ledger, the most elegant device for opening it without a key. Ratfolk take no political position on which application is more impressive."
 ratfolk_traditions: "The Weight of Numbers"
 ratfolk_traditions_desc: "A ratfolk soldier is, by every measurable standard, not a particularly imposing sight. They stand chest-height to a human infantryman, cannot generate the leverage needed to wield a lance from horseback without sliding off the back of the animal. What the ratfolk lack in individual menace is compensated for in headcount. A lord who calls his ratfolk subjects to war gets more bodies than he budgeted for, because ratfolk communities send their people in clusters — a brother follows a brother, a litter-mate refuses to stay home. The gap between that levy and a well-trained human pike-line, let alone Elven or Giantsborn warriors, is real, and ratfolk military thinkers have spent centuries either trying to close it or finding ways to make it irrelevant."
 ratfolk_the_survivor_endorsement: "The Survivor's Endorsement"
 ratfolk_the_survivor_endorsement_desc: "History is written by the victorious, and and well, the victorious have rarely been ratfolk. What ratfolk have been, consistently, is present — on the morning after, in the city that is still standing, at the table where the new terms are being negotiated. Other kindreds call this opportunism. They have called it cowardice, betrayal, a failure of conviction.\n\nRatfolk commanders who have changed their allegiance mid-campaign, ratfolk merchants who resupplied the winning army after provisioning the losing one, ratfolk communities that opened their gates when the mathematics of resistance stopped making sense — all of them have heard the same words. What those critics rarely account for is that the alternative was often extinction, and that a people who opted for extinction in exchange the sake of honour would not be around to be criticized. The ratfolk who backed the wrong side in the Peargate Conspiracy are remembered as traitors. The ratfolk who switched are remembered, which is the part that matters."
 ratfolk_underestimated: "The Same Mistake, Again"
 ratfolk_underestimated_desc: "There is a ratfolk tradition, practiced in communities across the world with minor regional variations, of keeping a specific kind of book. Not a grudge book — grudge books are for wrongs that require redress. This is something different: a record of assumptions. The merchant who was certain the ratfolk clerk couldn't read the contract. The general who was confident the ratfolk quarter of the city wouldn't fight back. The lord who inherited his father's contempt wholesale, without also inheriting the footnote about how his father's contempt had gone for him. The book is not kept out of bitterness, exactly. It is kept the way a farmer keeps weather records — because patterns are useful, because the same season comes back around, and because there is a particular practical value in knowing, before a negotiation begins, that the man across the table has already decided what you are.\n\nRatfolk communities that have maintained these records for several generations report a curious finding: the assumptions do not change. The names change, the centuries change, the specific context of the slight changes.The assumption is always the same one, arrived at fresh, by someone utterly convinced of its originality.\n\nThe books are very long."
 
 ratfolk_brewing_expertise: "Ratfolk Brewing Expertise"
 ratfolk_brewing_expertise_desc: "Ratfolk brewing begins with the premise that anything that can rot can, with sufficient encouragement, become something worth drinking. Grape skins, overripe grain, the rinds of fruit that nobody else wanted — all of it goes into the vat, because waste is a philosophical position ratfolk do not hold. The results vary enormously. Ratfolk communities are intensely loyal to their specific local brew and openly contemptuous of everyone else's, a cultural divide that has caused more genuine inter-community friction than most political disputes. What every version shares is strength, a smell that precedes the cup, and the quality of tasting strongly of wherever it was made. Visiting dignitaries who are offered it as hospitality and decline have, uniformly, made a social error they did not realize until too late."
 
 ratfolk_alchemists: "Wrong Ingredients"
 ratfolk_alchemists_desc: "The first ratfolk alchemist was almost certainly trying to do something else entirely. This is true of the second one as well, and the third, and frankly most of the ones since. Ratfolk alchemy does not begin with a hypothesis — it begins with a smell, a hunch, and the specific brand of confidence that only emerges in someone who has not yet learned what they should be afraid of. The recipe calls for powdered dragon scale. You have powdered slate, a dead beetle, and a very strong feeling.\n\nYou try it. \n\nSometimes it works. \n\nSometimes it works too well, in a direction nobody anticipated, at a volume that carries three streets over. The community has long since established that the alchemist's workshop goes at the edge of the settlement, downwind, with a clear gap between it and anything load-bearing. Not because the ratfolk are pessimistic. Because they are, after generations of this, extremely accurate. The alchemists themselves take the explosions in stride — each one is, technically, a result. You write it down. You note what not to combine next time. You start again. The truly dangerous ratfolk alchemist is not the one who blows up the workshop. It is the one who has stopped blowing up the workshop and started blowing up exactly what they intended to."
 
 draquatin_construction_speed: "From the Ashes"
 draquatin_construction_speed_desc: "In the year 1255, calamity struck Daqueland. The dragon referred to as the Scion of the World Breaker had arrived and made Crelzerte their first target. The Scion mercilessly burned everything in sight with their flaming breath, sparing no structure from destruction. After the heroine, Ellenor the Dragonslayer, slew the great beast and the blaze subsided, nothing of the once proud city remained besides smoldering rubble.\n\nFrom all throughout the land, nobles and common folk alike came to the city to rebuild. Even though their fields and villages lay devastated by the same dragon, they could not let the pride of Draquatin civilization stay defeated. The reconstruction, fueled by the grief of their fallen kin, was completed in less than a decade. With heavy hearts the old Crelzerte was cast away, and a new, eternal Crelzerte was built in its place."
 draquatin_sail_tradition: "To Sail is to Live"
 draquatin_sail_tradition_desc: "Whether in clear waters or stormy seas, whether far upriver or out on the open ocean, we live to sail. In ancient times, the ancestors of the Draquatin people, led by Draquar the Wayfinder, sailed across the Great Sea from the unknown lands of the west to settle in the Bay of the Dragon. Upon landfall, he signed a pact of peace with the Ardrainic tribes, unifying the two distant peoples into the first Draquatin. Since then, our people have grown and changed, but our maritime tradition has remained unaltered.\n\nAs the old Draquatin saying goes, “If water brings life, then to sail is to live.”"
 draquatin_fireproof_hulls: "Fireproof Hulls"
 draquatin_fireproof_hulls_desc: "During the attack of the Scion of the World Breaker, the Draquatin navies were powerless to fight back. Any attack on the dragon caused immediate and fatal retaliation, always ending in the vessel being engulfed in flames. To prevent future defeats by fire, naval vessels now undergo fireproofing methods. The hulls of ships are to be coated in a mixture of vinegar and alum that acts as a fire retardant. Crew members are trained to fetch seawater using rigging on the sides of the boats to climb to the ocean’s surface. Although dragon attacks are not to be expected in the modern day, enemy ships planning on using fire to their advantage will be unpleasantly surprised to see our ships completely unaffected."
 draquatin_water_magic: "Academy of Liquid Sorcery"
 draquatin_water_magic_desc: "In the damp fields of the Water Meadows, students of the Academy of Liquid Sorcery study the art of water manipulation. The academy is located in the middle of a freshwater lake that is only a short distance from the coastline. Magic-enhanced fountains line the entrance, spewing water high into the air, and beautiful lapis lazuli frescos depict sea life and coastal scenery along the main hall.\n\nMages from the academy learn how to move water telepathically, cast spells that pump liquids through complex pumping mechanisms, drain seawater to aid in land reclamation, and even breathe underwater. The academy is patronized by the Wryne dynasty, who rely on the magical prowess of its alumni to maintain their luxurious palaces. The cities of Daqueland owe their famous canals and mighty aqueducts to the tireless work of the Academy of Liquid Sorcery."
 draquatin_gardening: "Land of Gardens"
 draquatin_gardening_desc: "The land of Daqueland has been used to grow bountiful harvests since it was first inhabited. Its fertility can be attributed to the constant stream of fertile soil distributed from the southern mountains by river. This highly productive sediment means that despite its small size, Daqueland can hold a disproportionately large population.\n\nOne unexpected side effect of the fertile land alongside Daqueland’s mild climate is that recreational gardening is made relatively easy. Every plot of land will most likely have a display of flowers regardless of the size or the owner’s wealth. The nobles especially love building massive opulent gardens with greenhouses and exotic plants to show off their status. As cities grow and lush green turns to the grey of gravel and stone, it would be smart to build public gardens to bolster the people’s well-being."
 draquatin_dragon_loans: "The Dragon Bank"
 draquatin_dragon_loans_desc: "The Dragon Bank of Crelzerte is the most influential financial institution in all of Daqueland and one of the most powerful banks of Western Edorinn. It was founded in 1267, shortly after Crelzerte was rebuilt, by a mysterious newcomer with wealth of unknown origin and no known family. Rumors spread that the bank’s founder was of draconic origin, although they are yet to be confirmed true. This suspicion quickly turned to gratitude as the bank offered generous loans to locals throughout the region. Since then, the Dragon Bank has only grown in power and wealth and will continue to grow for the foreseeable future."
 draquatin_western_seas: "Western Seas"
 draquatin_western_seas_desc: "The Draquatin have always dreamt of the mythical lands to the west, “Courtine” in Draquatin Ardrainic, which they claimed to originate from. Although it is most likely untrue, this belief has manifested itself into a desire to rediscover this unknown homeland. Before the invention of the caravel, it had been viewed as impossible to realize the dream of finally returning, but now the open oceans are ready to be explored. Draquatin sailors are giddy with excitement at the prospect of finding where the lands of the west reside and why their ancestors travelled so far to leave them."
 draquatin_tonvagues: "The Tonvague"
 draquatin_tonvagues_desc: "A type of caravel ship first built in the port of Angoulon, the Tonvague is a marvel of its era. Every detail of the ship is made with aerodynamics in mind while maintaining a size large enough to hold decent cargo. The hull of the ship is long and slender, tapering into a sharp-ended bow to minimize drag. Two tall masts flanked by large lateen sails catch the wind and propel it forward with grace. The Tonvague quickly became a symbol of Draquatin maritime supremacy that will surely last for generations."
 draquatin_moon_ports: "Moon's Fall Shipyards"
 draquatin_moon_ports_desc: "As Daqueland has some of Edorinn’s greatest port cities, it is only fitting that it should have some of Edorinn’s greatest shipyards. The Moon’s Fall Sea is the crossroads that all sailors must pass to travel the coasts of Edorinn, and the Draquatin are its stewards. We have mighty rivals, both abroad and at home, so to continue to assert our naval power into the future, we must build great dockyards to accommodate a grand new armada."
 draquatin_dragonslayer_order: "The Order of the Dragonslayer"
 draquatin_dragonslayer_order_desc: "During the Reformation, an order of warrior monks was founded in Daqueland to combat the rapidly advancing heretics. The monks called themselves the Order of the Dragonslayer and aimed to emulate the deeds of Ellenor the Dragonslayer. Unlike the traditional warrior monks who wielded great war hammers, the Order of the Dragonslayer utilized a diverse array of polearms to imitate Ellenor’s weapon of choice.\n\nThe holy order did not only fight in Daqueland but also ventured to the blood-soaked battlefields of the Inner Sea to fight in the War in Heaven. There, the order gained notoriety for their fierce ability in hand-to-hand combat, with some saying a single monk could defeat ten heretics at once. After religious tensions died down, the Order of the Dragonslayer was dismantled, but Ellenor is still revered in Draquatin society to this day."
 draquatin_professional_marines: "Professional Marines"
 draquatin_professional_marines_desc: "As the ambitions of Draquatin states shift outward, their militaries need to be able to respond to faraway threats quickly and efficiently. Inspired by the Pwasciards to the north, the first Draquatin marines were established. Trained on land and sea, in all types of weather, and in fiercely competitive war games, Draquatin marines have no shortage of practice. Once they are deemed ready, the marines are then shipped to fight in distant colonial wars and to garrison far off outposts. Although the Pwasciard marines may outpace our own on land, the Draquatin marines have already surpassed them on the open ocean."
 draquatin_marble_decade: "The Marble Decade"
 draquatin_marble_decade_desc: "The Marble Decade, lasting from 1668 to 1680, marked a sudden artistic and architectural golden era throughout the Daqueland region. Defined by the ubiquitous usage of marble, the Marble Decade saw the development of a Neo-Moran Baroque hybrid style of architecture. The Château de Onors, built by the Crelzerte nobleman Pons Alibért in 1673, exemplifies the style with its massive central dome and ornate pillars with grand open hallways dominating the interior, covered with expensive artwork and all surrounded by an expansive network of gardens. By the end of the decade, the cities of Daqueland were all painted with the reflective white of marble.\n\n Alongside the marvels of architecture, the fine arts were also innovated upon. Marble sculptures inspired by the artistry of the Moran Empire began to be created on a scale only seen during the late Renaissance over a century prior. Demand for paintings, literature, and music, both religious and secular, grew rapidly, and artists from all around Western Edorinn came flocking to Daqueland to receive patronage. Mighty organs blared hymns praising the All-Being from newly pale temples, and master chefs prepared lavish feasts in kitchens made purely of marble.\n\n As quickly and suddenly as the Marble Decade began, it faded. In part due to shortages of marble caused by the craze, it became financially unsuitable to build with it; most switched to using limestone, though some architects refused to stop and died penniless with hearts of marble. In the end, the Marble Decade was best known to the world as the decade in which Draquatin culture reached its peak, but in the white cities of Daqueland, the Marble Decade has left a mark that will never disappear."
 draquatin_republic_revolutions: "Dreams of Freedom"
 draquatin_republic_revolutions_desc: "With the long overdue destruction of the Holy Commonweal of Etra, the Draquatin people begin to have their first taste of real freedom in hundreds of years. In earlier times, the newly formed Draquatin cities had acted as gateways for the poor masses of society to have a chance to climb the social ladder, but over the centuries the upper estates created an unchanging hierarchy to maintain their wealth and power. Wasn't it Draquar the Wayfinder who wrote, “The common folk are the key to prosperity"? Was it not the goal of the free cities to maintain self-governance and liberty?\n\n If the old dream of the Draquatin was power, we cast that dream to the fires and dream a new one. A new dream of revolution that topples the kings and oligarchs of old and replaces them with the power of the people. A new dream of fair laws and natural rights to ensure that the innocent shall never be abused again. A new dream of independence from all who dare to oppress us. The Draquatin people will rise from the flames of tyranny and create a new dream of freedom."
 draquatin_monarchy_revolutions: "Aristocratic Temperament"
 draquatin_monarchy_revolutions_desc: "The nobles of Daqueland have gained notoriety for their flamboyance and great sense of style. They wear expensive and colorful robes and jewelry made from fine gemstones, yet they do not act cocky or rude. One thing Draquatin nobles are known for that is much more important is their humility and respect. On diplomatic missions, they will study the local culture and language, wear local garb, and taste local cuisine, all with an air of dignity and grace. We need these small advantages as hard times are looming ahead.\n\n Although the tide of revolution has reached the shores of Daqueland, its waves are unlikely to break monarchy's grip. The loyal armies are strong and ready to fight to the death for our great leader. After the dust settles, Daqueland will prosper under us, and peace will be secured for many years. Now then, let us ride in defense of our homeland; let us ride to eternal victory!"
 typheraii_the_first_murder: "The First Kin-Slaying"
 typheraii_the_first_murder_desc: "Among the Elves of the Typhrarii there exists a grievous tale of a Great King who ruled at the morning of the world, and his four children begotten of him. The names of the King and his progeny are lost and re-made by each lore master who recites this tale, yet the shape itself remains the same. And as this story goes, in that age, Elvenkind had not yet known the taste of death. They walked in bliss beneath skies, bathed in the golden light of world yet new. They roamed the world, as namers of mountains, as lords of beasts and men.\n\nBut as the seasons turned into ages, a terrible shadow crept into the hearts of the King’s Children, and ceaseless hunger, which only a crown could assuage, grew inside of their stomachs. In chambers unlit by honest lights they conspired, delving into the deepest darks of the world to speak with Things-Beyond-Reality which dwell at those margins of this world. Thus, did they grows in cruelty, and cunning alike, sharpening their knives.\n\nUntil at last the anointed hour striked.\n\nAnd The Many fell upon The One, aupon their father dear, and served onto him the shape of death. Yet by slaying the father, they also slew the brother, sister, mother, son and daughter, as they rendered onto the whole Elven-race the nature of death. Yet even still, before the last breathe passed from between his lips, the King, crying out in great sorrow, took his own life-blood as regeant, and cast a curse onto his children – that they should never know peace among themselves, nor their kin among their sibling’s kin."
 darothari_unlit_chambers: "The Problem Child"
 darothari_unlit_chambers_desc: "The Darothari, known as the Dark Elves by the peoples of the Commonweal, are descended from those Elves who in ancient times moved into the dark tunnels and twisting caverns beneath the Aita Mountains, as a result they have diverged drastically from their surface-dwelling Elven Kin. Being of far paler skin, longer ears, smaller of stature, and poorer of eye-sight."
 aldorai_greenwood_ways: "The Lost Child"
 aldorai_greenwood_ways_desc: "The Aldorai, known as the Green Elves by the people of the Commonweal, are descended from those Elves who dwelt in the Green Sea having mingled with the nymphs, satyrs and other forest spirits of their homeland. Dwelling primarily within the hollows, those little valleys between the hills. Reclusive and xenophobic, they are seldom seen far from their homelands."
 hyriovari_the_high_claim: "The Golden Child"
 hyriovari_the_high_claim_desc: "The Hyriovari, known as the Golden Elves by the peoples of the Commonweal, are the most populous of the Typheraii and have left the deepest mark upon history. Passionate lovers of life and the world, loving the sword and the word in equal measure. Their tactics once dominated the battlefield; their philosophies dominate the mind. Yet both reached their apex long ago, and the years since have found the Hyriovari spent, in mind and in body. Universities which have produced the finest commentaries on the commentaries on the shadows on the wall. Soldiers drilled in the finest tactics the world had, a thousand years ago. Only time will time weather this will be the twilight, or the dark before the dawn of the Hyriovari."
 sarusthari_steppe_host: "The Black Sheep"
 sarusthari_steppe_host_desc: "The Sarusthari, known as the Bronze Elves by the peoples of the Commonweal, inhabit the vast sea of grass known as the Great Swards. They and they alone have formed the deep bond required to the ride the dinosaurs of the Great Swards. According to their origin myth, this unique bond is a result of when one of the Elven Kings sons, laid with a Snake-Legged women; from their union became the first Sarusthari."
 
 darothari_webbound_labor: "Daylight Denied"
 darothari_webbound_labor_desc: "The Panei had no word for war. They had a word for friendship, four, in fact. Three for love. The Darrothari had two words for the Panei: ideal slaves."
 
 A02_and_they_shall_know_fear: "And They Shall Know Fear"
 A02_and_they_shall_know_fear_desc: "The risen dead hold themselves above us — above the old laws of the flesh. They name our grief weakness. They name our trembling cowardice. They name our mourning a frailty unbefitting their cold and patient bones. They have forgotten.\n\nOnce in the ages before, before the Torrent unmade the world, the Morans knelt and wept and feared as all living things must. The thrones they raised in life are dust. Dust, too, can be made to scream.\n\nIt is decreed by the Order: We shall return unto them that which they believe themselves to have outgrown The dead shall learn again to flinch, learn again to break, and learn at last — beneath our crimson banners — that fear is the truest prayer the flesh has ever offered. And they have forgotten how to pray." 
 
 A12_the_hollow_vigil: "The Hollow Vigil"
 A12_the_hollow_vigil_desc: "Beneath the canopy of a sacred grove of Ardraine, a young man swore before gods old and new, foreign and domestic, of lead and oak, to never be a friend of Moran.\n\nBefore the senate of old Iborros, Azir swore an oath to see Moras burnt, its fields salted, its people in chains.\n\nOn a cross beneath a hot Imperium sun, a slave who had dared lay arms upon his master swore, with the last breath in him, to be the End of Moran.\n\nThese are three of countless. The countless will have their vengeance.\n\nThe Relic Armor remembers every oath. Whoever dons it is the instrument of those wills, and ceases, by degrees, to be anything else."

 A410_kings_of_fire_and_ice: "Kings of Fire and Ice"
 A410_kings_of_fire_and_ice_desc: "In the first days, the giantsborne were a people great of strength, but ignorant like children. Seeing this, God directed his Angels to come down before the Frost and Fire giantsborne as teachers and bestow upon our forefather’s great wisdom and knowledge. Yet the father did not teach son all of what he learned, and he did not ask his father. In time the teachings were forgotten, and they began to war upon each other, wickedness growing in their hearts. Those who loved heat coveted the tops of dormant volcanoes, and those who loved the cold sought dominion over the four corners of the world. For many years they warred, spilling much blood on both sides.\n\nNow in the East arose the Elves, and among them the Great Elven King, and he hearing of the sinful nature and weakened state encroached upon the lands of the giantsborne; and we, weakened from our internal war, were bested by the armies of the Elf King and made to pay homage to him.\n\nThe King of Fire learned from a merchant the great wisdom of the Frost Queen, and travelled to her, seeking peace. The Frost Queen received him, and they were enthralled by each other's displays of learning, knowledge, and their great beauty; and by the end of their thirty days together, peace was brokered between their Kingdoms; And a son was born to them, Issar, for whom the land is named. With peace in their realms, the giantsborne of Frost and Fire turned towards the west and met the Great Elven King in battle; slaying him. In turn, his Kingdom was shattered and divided by his greedy children."
 
 A410_the_rise_of_the_diarchy: "Rise of the Diarchy"
 A410_the_rise_of_the_diarchy_desc: "The Kingdom was prosperous for many years, and those born from the wedlock of the King of Fire and the Forst Queen ruled wisely and justly. Until a wicked woman succeeded in dethroning the Issarid dynasty and installing the Sharissid dynasty, which ruled for 16 monarchs. They did not rule wisely and justly yet ruled until God unleashed the cataclysm upon the world, and the Twins Talhalla and Zarita, direct descendants of the King of Fire and the Queen of Frost, overthrew the Dark Disciple sent by the Undying Emperor to oversee the land. Not knowing who the eldest of them was, they agreed to rule co-equally: Talhalla as King of the Frost Giantsborne, for his features were like that of them; and Zarita as King of the Fire Giantsborne, for his features were too like that of them. The descendents of Talhalla and Zarita have ruled jointly since those days, during the Spring and Summer the sons of Zarita rule, while in the Fall and Winter, the sons of Talhalla rule."
 
 A410_center_of_trade: "Rise of the Diarchy"
 A410_center_of_trade_desc: "By the virtue of geography, all trade flowing from East to West, or vice versa travels through our lands. "

 A325_the_host_is_not_replaceable: "The Host Is Not Replaceable"
 A325_the_host_is_not_replaceable_desc: "Egypt had the money. Asia had the land. What Naiha has is the recruiting pool, and the pool does not refill. Every Foot Companion killed is gone: Hyriovari do not breed a phalanx back into being, and no settler from Hyriosia will take his place. The Host is therefore spent as a miser spends coin. Quality is not pride. It is the only arithmetic that leaves an army standing."
 A325_foot_companions: "Foot Companions"
 A325_foot_companions_desc: "They still drill as Phaetheon drilled them: a hedge of pike, a single animal on the flat. On open ground the Foot Companions are untouchable. In hills and wood the hedge breaks, files open, and the animal becomes men again. Cynoscephalae is a lesson the Host has already paid for. Choose the ground, or do not fight."
 A325_hawk_riders: "Hawk-Riders"
 A325_hawk_riders_desc: "The king's own. The Companion cavalry of Cynoar still ride as hetairoi, not as a levy of gentlemen playing at war. They are few, expensive, and the anax's right hand: the charge that ends a battle the pike has already decided, if the pike has been allowed to decide it."
 A325_tombs_of_ematis: "Tombs of Ematis"
 A325_tombs_of_ematis_desc: "The royal tombs of Ematis hold Phaetheon's ancestors, his horses, his sun-disk, and a story. They do not hold Phaetheon. The Kynarides keep the doors, fly the banner, and answer questions about the missing cortege with the patience of people who have been answering them for a thousand years. Legitimacy, here, is a performance in a house whose master is elsewhere."
 A325_royal_monopolies: "Royal Monopolies"
 A325_royal_monopolies_desc: "The silver of Aolaldh, Armnos, and Cexat, and the timber of Adolel and Axinitach, are not estate-rights. They are the anax's. Phaetheon's kings paid the Host from mines and forests held in the crown's own name; the Kynarides kept the ledgers when they kept nothing else. A kingdom that cannot replace its soldiers can at least pay the ones it still has."
 A325_the_wall: "The Wall"
 A325_the_wall_desc: "Hyriosia calls us rustic pretenders. We call them alive. The answer to every commentary from the south is the same: [GetCountry('A354').GetName] presses the Alar hills, and behind them the steppe-host of [GetCountry('A330').GetName]. Naiha bleeds on the northern frontier so that Hyriosia may write. We say so, loudly and often, to cousins who remain unimpressed."
 A325_the_fetters: "The Fetters"
 A325_the_fetters_desc: "Phaetheon did not annex Hyriosia. He held three gates, extracted tribute and troops, and let the duchies hate one another more than they hated him. Occupation of people who despise you is a Host-killer: garrisons that never come home, levies that never refill. The Fetters are hegemony. Annexation is a second Phaetheon ride, and we have already seen how those end."
 A325_a_second_hegemony: "A Second Hegemony"
 A325_a_second_hegemony_desc: "To proclaim a Reunited Kingdom is to declare the Kin-Slaying's punishment served — by the heirs of the Companions who last committed it. It is not growth. It is spending the Host on purpose. If the curse can be beaten, it will be beaten once. There will not be a third sun."