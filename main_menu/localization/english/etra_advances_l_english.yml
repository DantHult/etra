l_english:
 #
 human_horse_advance: "Human-Horse Bonding"
 human_horse_advance_desc: "If you speak the truth, have a foot on the stirrup.\n\nThe bond between horse and man is one which no other kindred has been able to replicate. The ratfolk have numbers, the elves have expertise, the giantsborne have strength, the beastfolk have claws and teeth - but humanity has the horse and the dog."
 
 rising_from_ruins: "Rising from Ruins"
 rising_from_ruins_desc: "No nation has suffered more from the Day and its aftermath then we have. First, the magical cataclysm swept across the land, devastating a once-beautiful realm. Then our forefathers rose from their graves and saw fit to wage a grand war of conquest. After that came the blasted crusaders and adventurers from over the mountains, coming down as supposed heroes. Only to have been worse then the undead. Only in recent years have we finally had the chance to rebuild from what remains."
 rovina_ruined_no_longer: "Ruined no Longer"
 rovina_ruined_no_longer_desc: "Our realms were not always called as the 'Ruined Realms'. In the before times it was beautiful. Art flourished, the people were merry and many, the fields were golden, the gods smiled aupon us. Though it may never be as it oncec was, with our hands have we captured a piece of what was."
 
 venturian_legacy_of_adventurers: "Legacy of Adventurers"
 venturian_legacy_of_adventurers_desc: "The Venturians trace their beginnings to the great adventuring companies from over the Aita Mountains. They were mercenaries, crusaders, and wandering warbands who marched south in search of plunder, glory, faith or a new life. As the crusades faded away, many opted to lay down their swords and claim freeholds in these fertile lands. Gradually they intermixed among themselves, and the local population of the Godhand Peninsula. Now they are neither wholly northern nor truly native, the Venturians have become something in-between."
 
 venturian_peasant_heritage: "Peasant Heritage"
 venturian_peasant_heritage_desc: "As the old social order has been greatly disrupted, the upper strata never quite regained the firm grip on society as they hold elsewhere. In these lands, the distinction between a freeholding farmer and local nobility is thin, leaving a countryside where the lowborn carry an air of dignity, and independence."
 
 venturian_empowered_assemblies: "Empowered Assemblies"
 venturian_empowered_assemblies_desc: "Born from the semi-democratic nature of the old adventuring companies, where a member holds a near-equal voice, and reinforced by the traditions of the old republican communes which had dotted the peninsula, assemblies of the populace have been the norm. Over time, they have been formalized into local assemblies, where freeholders gather to debate, decide, and govern their communities."
 
 freeholder_cultivate_vineyards: "Cultivate Vineyards"
 freeholder_cultivate_vineyards_desc: "Gently rolling hills are bathed in eternal golden sunlight, as they stretch as far as the eye can see, with their rich, warmed soils perfect for vineyards and orchards. With careful tending, these lands could sustain a thriving international wine industry, producing vintages to delight both lowborn and emperors alike.
 
 freeholder_learning_from_the_ancients: "Learning from the Ancients"
 freeholder_learning_from_the_ancients_desc: "From the mouths and minds of those who authored ancient words, great wisdom awaits. The knowledge of those who came before is ours to claim, if we are willing to listen."
 
 
 freeholder_land_of_promise: "Lands of Opportunity"
 freeholder_land_of_promise_desc: "The fertile lands of our domain are a coveted destination for many migrants of the lower strata that seek a better and more prosperous life. Many of them seek fortune here, and in doing so will increase our own fortunes."
 
 freeholder_multi_culturalism: "Freeholder Multi-culturalism"
 freeholder_multi_culturalism_desc: "Northern warriors brandishing cold steel, wandering scholars drawing wisdom from the past, southern merchants peddling their wares, and riverine peasants tending their crops. All these peoples hail from countless nations, races, religions, and classes. By necessity, our state has learned to handle them. Every culture is bent and shaped to serve the interests of the realm."
 
 the_great_rivers: "The Fertile River"
 the_great_rivers_desc: "Our realm, nicknamed the Green Realm, owes its lifeblood to the great river which flows through it. These rivers are vital for our continued existence and prosperity as they supply much grain for our many mouths and for the merchants across all of $europe$."
 
 freeholder_frontier_warriors: "Plowshares into Swords"
 freeholder_frontier_warriors_desc: "Here even the weak say, 'I am strong.’ Although peace may hold with our undead neighbors for now, the threat of war can never fully fade. As rivals eye our borders, and danger lingers at the edges. Fortunately, when a shopkeepers can be retired adventurers, and behind every peasant is a strong-sword arm, our people are always ready to repel any would-be invaders."
 
 
 eternalist_mere_mortal_men: "The Mysteries"
 eternalist_mere_mortal_men_desc: "You search for thunder and wonders, chasing signs in blood and flame as if the All-Being needs to shout. Yet The Will is felt most in the stillest, simplest miracles- the ones you've grown too proud to notice."
  
 eternalist_esus: "They-Who-Masks-Truths-With-Lies"
 eternalist_esus_desc: "The Masked One wears a thousand faces, and all of them are lying. Or telling the truth. Or both. Theologians have gone mad trying to catalogue the contradictions: A statement is true when spoken at dawn, false by noon, meaningless by dusk, and simultaneously all three when whispered in the dark. The trickster god delights in this-mortal certainty is the joke, and They-Who-Masks is always laughing behind whatever face they're wearing today.\n\nYet here's the deeper paradox that keeps the Faith's scholars awake: this god of deception has granted mortals more genuine insights than a dozen gods of wisdom. Every lie contains a truth if you squint. Every truth becomes a lie when context shifts. Ask the wrong question and meaning dissolves. Ask the right one and you get an answer that's true-and-false-and-meaningless, all braided together like a rope that holds and slips simultaneously.\n\nThe clergy debate whether They-Who-Masks is the All-Being's sense of humor or its acknowledgment that reality itself is too slippery for mortal comprehension. Perhaps both. Perhaps neither. Perhaps the question itself is the wrong shape to receive an answer. The Masked One would approve of the uncertainty-after all, the only thing more dangerous than a lie is a truth you're absolutely certain of.\n\nSome say this face of the All-Being teaches humility. Others say it teaches wisdom. The Masked One says it teaches nothing, which might be the only honest thing They've ever claimed."
 
 A01_expand_ynarheimian_guard_advance: "Expand the Varangian Guard"
 A01_expand_ynarheimian_guard_advance_desc: "The Varangians have served our country for centuries with distinguished honor and unwavering faith. By expanding their ranks, we will further secure the stability and protection of $A01$."
 
 A01_the_new_forging: "The New Forging"
 A01_the_new_forging_desc: "Of all the advancements we have observed, metallurgy has wounded us deeply. They forge steel beyond anything our smiths could achieve. Their manufacturies produce arms faster then our forges. Worse still, their metal-whisperers weave enchantments into their blades as easily as a scribes inks parchment. Their steel sings with wards, their shields gleam with runes, and even a common spear hold magics our empire would have deemed extravagant. This truth was made undeniable upon the fields of the Acosan Plain, where the legendary blades Requiem and Faithkeeper crossed. It is said that Requiem, an ancient imperial blade of great renown, shattered into ten thousand fragments the instant it met Faithkeeper. Less dramatic, but no less instructive, wherein the countless battles when our arms and armaments proved itself worthless against modern steel. The dead do not age, but neither must we remain old. If the Eternal Empire is to endure, we will have to adapt. We shall unmake our shame within the sweltering heat of forge-fire, and from it new steel shall arise."
 
 A01_new_auxilia: "New Auxilia"
 A01_new_auxilia_desc: "A clever general wastes no assets in war and mercenaries are not an exception. The Empire once drew auxilia from every corner of the world: islander bowmen and singlers, southern cavalry, and sellswords who earned citizenship through bloodshed. We shall revive this practice. Our central doctrine, that of a heavy infantry core, shall remain immutable. But with the support of foreign sellswords, the gaps within our war-machine may once more be filled. Of particular promise are the horsemen of foreign realms, whose swiftness and flexibility grant access to tactics our legionaries alone would not provide."
 
 eternalist_inquistion: "The Inquisition"
 eternalist_inquistion_desc: "If the warrior priests are the hammers of the Eternal Faith, then undoubtedly the inquisitors are its shield. Henceforth, where ever practitioners of forbidden arts dwell, let them know dread, for the righteous judgment of the Eternal Faith draws near. Let them burn, as only judging fire purifies the land, body and soul. And when the faithful behold the robes and sacred emblems of the inquisitors, they shall know the warm embrace of the All-Being, for They will know what is Their's."
 
 
 eternalist_warrior_priest: "Warrior Priests"
 eternalist_warrior_priest_desc: "The High-Temple has long utilizated religious orders of warriors bound by sacred vows. Such orders are dedicated to defending the Eternal Faith and serving the All-Being in spiritual and martial capacities. They combine elements of devotion, discipline, and political influence, acting as the Faith’s diplomats, enforcers, protectors, and agents in the world. Such orders have struck terror into the hearts of the Faith’s enemies, crushing the skulls of heathens and heretics alike. Wielding mighty warhammers, the size of men, with such skill and strength beyond that of ordinary men. Such warriors are said to be the fury of All-Being manifested in the mortal realm."

 eternalist_sacred_canon: "The Sacred Canon"
 eternalist_sacred_canon_desc: "Ink-stained fingers trace the same passages across a hundred temple scriptoriums. The High-Temple's scholars have gathered every sacred text, every marginal notation, every blistering theological dispute into one authoritative whole. Here lies the paradox codified: the All-Being who is everything and nothing, whose nature splinters into a thousand divine faces yet remains eternally singular. Students bend over these pages until their eyes burn, wrestling with contradictions that sharpen the mind like a whetstone. Each question answered births three more, and in this endless pursuit of the unknowable, the faithful grow closer to truth."

 eternalist_pilgrim_roads: "Pilgrim Roads"
 eternalist_pilgrim_roads_desc: "The monk's bare feet and the merchant's laden cart wear the same dust into the stones. Ancient paths once trod only by the devout now hum with the jangle of coin and the creak of wagon wheels. Where pilgrims seek shrines, traders find markets. Where temples rise, warehouses cluster. The faithful carry prayers to distant saints; gold flows back along the same routes, settling in temple coffers and royal treasuries alike. The roads remember no difference between commerce and devotion."

 eternalist_temple_schools: "Temple Schools"
 eternalist_temple_schools_desc: "The scratch of quills fills chambers that once echoed only with prayer. Children learn their letters beside novice monks, both mastering the curves of sacred script. The clergy have hoarded knowledge since before Saint Elspeth's revelation, but now they crack open their libraries. Scribes and clerks emerge from temple schools with ink-darkened fingers and heads full of liturgy and ledgers both. Literacy spreads like dawn across the realm, and with it, the All-Being's word finds new throats to speak it."

 eternalist_missionary_zeal: "Missionary Zeal"
 eternalist_missionary_zeal_desc: "They arrive in villages where the Old Gods of Wood and Lead still receive blood offerings beneath oak trees. Missionaries with rolled parchments and unwavering eyes, speaking of the one-who-is-many with the fervor of absolute certainty. Temples sprout in market squares. Children learn new prayers. The Faith doesn't ask-it explains, it demonstrates, it builds until ignorance has nowhere left to hide. What begins with a single preacher ends with a chapel, and the All-Being's dominion expands another village, another valley, another conquered heart."

 eternalist_embrace_of_truth: "Embrace of Truth"
 eternalist_embrace_of_truth_desc: "The Faith does not flinch from strange wisdom. A philosopher's radical theory, a foreign scholar's startling proof, an inventor's heretical mechanism-all are examined, debated, and if sound, absorbed. The All-Being contains all truth, the theologians reason, so how can any genuine discovery threaten the eternal? This flexibility has saved the Faith from the rigidity that kills lesser creeds. Innovation flows into the temple libraries, and the ancient Faith remains perpetually young."

 eternalist_cultural_legacy: "Cultural Legacy"
 eternalist_cultural_legacy_desc: "The Faith no longer needs to convince; it simply is. Peasants mark holy days they can't quite explain. Artists paint divine faces they learned at their grandmother's knee. Even those who question doctrine find themselves using the Faith's metaphors, its moral framework, its calendar. The All-Being's symbols decorate tavern signs and marriage contracts, woven so deeply into daily life that to remove them would be to unravel culture itself. This is not conversion-this is saturation."

 eternalist_orthodox_edicts: "Orthodox Edicts"
 eternalist_orthodox_edicts_desc: "The High-Temple's pronouncements arrive in leather bindings, sealed with sacred wax. These edicts settle centuries of doctrinal squabbling with the finality of a judge's hammer. They define what the faithful must believe, must do, must reject. Priests cite them to end arguments. Rulers quote them to justify decrees. When crown and temple speak with one voice, the cost of enforcing the All-Being's will plummets. Uniformity has a price, but also a discount."

 eternalist_five_precepts: "The Five Precepts"
 eternalist_five_precepts_desc: "Five rules, carved in temple stone and whispered by mothers to children. Don't steal. Don't murder. Don't bear false witness. Honor your parents. Honor the All-Being. Simple enough for a child to grasp, profound enough for a philosopher to spend a lifetime interpreting. Where these precepts take root, disorder finds thin soil. The discontented still nurse their grievances, but fewer are willing to act on them when divine prohibition weighs against insurrection."

 eternalist_confessional_faith: "Confessional Faith"
 eternalist_confessional_faith_desc: "The bishops sit at council tables now, their authority stamped with the royal seal. Clergy swear oaths to the crown alongside their vows to the All-Being, and somehow the contradiction never seems to trouble them. The Faith has become a pillar of state, inseparable from governance itself. When the church is satisfied, its vast network of believers follows. Loyalty cascades from pulpit to pew, from sermon to hearth. The regime that guards the Faith inherits the faithful's devotion."

 eternalist_communities_of_faith: "Communities of Faith"
 eternalist_communities_of_faith_desc: "Monasteries cling to mountainsides like barnacles. Lay communes work communal fields, their shared labor a form of prayer. These communities radiate an otherworldly prestige-their gardens are too perfect, their chants too pure, their members too serene. Pilgrims flock to them. Nobles endow them. The crown that protects such holy enclaves basks in reflected glory. Devotion, when properly organized, becomes a political asset."

 eternalist_sacred_offerings: "Sacred Offerings"
 eternalist_sacred_offerings_desc: "Coins clink into collection plates. Merchants deed warehouses to temples. Nobles bequeath estates "for the poor and the All-Being's glory." The faithful give because giving brings them closer to the divine, and the clergy accept because accepting brings them closer to the people. This circulation of wealth binds priest to beggar to merchant in a web of obligation and grace. When the estates see their silver transformed into charity and incense, their satisfaction recovers from the inevitable wounds of governance."

 eternalist_glory_of_the_all_being: "Glory of the All-Being"
 eternalist_glory_of_the_all_being_desc: "All order descends from the All-Being. The king rules because the divine architecture demands it. The estates hold their stations because the cosmic design requires it. When the crown defends the Faith, it defends this essential truth: that hierarchy is holy, that obedience is worship, that resistance is heresy. The estates see their place in the great pattern and shoulder their duties with less complaint. Power legitimized by divinity sits lighter on the throne."

 eternalist_endurance_of_the_faithful: "Endurance of the Faithful"
 eternalist_endurance_of_the_faithful_desc: "Armies march. Villages burn. Plague sweeps through cities. And the faithful? They endure. Priests speak of temporary suffering and eternal reward, of the All-Being's incomprehensible plan, of meaning hidden in apparent chaos. This conviction doesn't prevent disaster, but it hastens recovery. The bereaved find solace in prayer. The traumatized find purpose in rebuilding. Faith transforms catastrophe into trial, and trials can be overcome. The realm heals faster when hope has divine sanction."

 eternalist_resistance_to_persecution: "Resistance to Persecution"
 eternalist_resistance_to_persecution_desc: "They burned our temples.\nWe prayed in cellars.\nThey executed our priests.\nWe ordained new ones in secret.\n\nPersecution should have crushed the Faith, but instead it forged something harder. The oppressed faithful learned to whisper their creed with such conviction that even their persecutors began to listen. There's a potency to a religion that refuses to die, a magnetism to martyrs who smile at the stake. Converts come easier to a Faith that has proven it can survive anything."

 eternalist_meditation_on_eternity: "Meditation on Eternity"
 eternalist_meditation_on_eternity_desc: "In isolated monasteries, the highest mystics sit motionless for days, contemplating the All-Being's eternal nature. Their insights emerge as poetry that princes quote, philosophy that scholars debate, art that transcends borders. These meditations on the infinite reshape culture itself-not through force, but through the sheer gravity of profound thought. Diplomats trained in the Faith's intellectual tradition speak with an authority that crosses languages. The Eternal Faith spreads not just through missionaries, but through the irresistible pull of its ideas."

 A01_imperial_seductresses_a_codex: "Imperial Seductresses: A Codex"
 A01_imperial_seductresses_a_codex_desc: "A sprawling literary work attributed to the eccentric chronicler Valerius Softquill, equal parts scandalous historical biography, tavern smut, and scholarly commentary on women who are immortalized in poetry. Ridiculed in learned circles, adored in drinking halls, and collected in secret by half the nobility. Copies circulate in plain covers, though everyone knows exactly what it is."
 
 A01_archivum_vitae: "Archivum Vitae"
 A01_archivum_vitae_desc: ""We consult ourselves across centuries." - An old saying among the Moranum\n\nIn Moranum culture, memory is legacy. Every free citizen is expected to maintain their own Archivum Vitae: a growing record of their existence, kept across decades or centuries. Written in steady layers of parchment, bone-etched tablets, or whispered dictations to spectral scribes, these chronicles contain triumphs, failures, loves, grudges, and mundane minutiae.\n\nWhat begins as a diary becomes a manual of self - a guide for the future self to consult when memory fades or priorities shift. In death, the chronicle rarely ends. Undead return to their own writings like old friends (or bitter rivals), debating former choices and continuing the text anew. Some volumes contradict themselves, some reveal forgotten ambitions, and some are locked away out of embarrassment.\n\nThese life-records pass through families, lovers, students, and rivals. They inspire plays, fuel scandals, solve cold-forgotten disputes, and anchor identity when centuries wear thin."
 
 
 A01_what_can_change_the_nature_of_a_man: "De Natura Hominis"
 A01_what_can_change_the_nature_of_a_man_desc: ""I have lived three lives, and in each I was myself, yet not myself. So what, then, is a man?"\n- fragment attributed to the philosopher Aulus the Thrice-Born"
 
 
 A01_bread_and_circuses: "Shadows and Spectacles"
 A01_bread_and_circuses_desc: ""Eyes captivated by shadows, stomachs filled by the state. In this, the people are tethered to eternity." \n\nThe Moran Imperium rules over a population of both the living and the undead. To maintain control, prevent unrest, and stave off boredom among its immortal citizens, the Imperium stages grand necrotic spectacles: gladiatorial arenas, ritual displays of undead power, and carefully rationed provisions. By captivating eyes and filling stomachs alike, the state secures loyalty, glorifies the Imperator, and ensures the eternal stability of the Imperium." 
 
 A01_the_eternal_empire: "The Eternal Empire"
 A01_the_eternal_empire_desc: "We are destined to rise again. No land is beyond reach, no throne beyond claim. The Eternal Empire will expand, reclaim what was lost. From all the lands from shores of Dawn to the lands of dusk, all nations shall bow before us."
 
 A01_the_mask: "The Masking"
 A01_the_mask_desc: "To those unaccustomed to gazing upon our majestic true forms, great fear is instinctive; after all, we are the visible incarnation of the inveitable fate which awaits them. The living do not appreciate reminders of their mortality. While this fear can be useful in certain circumstances, it often hinders trade, diplomacy, and daily affairs.\n\nTo move more freely among the living, the Moran have taken to donning elaborate masks and heavy garments that obscure their bodies. In these disguises, they can conduct business, mingle with mortals, and navigate the world without provoking as much panic or hostility. Some, however, have embraced these masks as their true expression, and extensions of their being. Changing their visage according to mood, station, or personal style."
 
 A01_wandering_scribe: "The Record of the One Who walks"
 A01_wandering_scribe_desc: "Tales circulate of a lone chronicler who wanders the breadth of the lands from here to there, committing every hamlet, ruin, tavern, and every strange character to parchment with a deadpan honesty. His writings have begun to be copied endlessly and shared in secret, revealing uncomfortable truths. Inspired by his example, a new generation of itinerant scribes have begun to map, record, and bear witness to the world as it is, not as the world wishes itself to be."
 
 sordrenic_sailors: "Men of the Sea"
 sordrenic_sailors_desc: "Beyond the shores of home, the sea is at times, cold, gods-forsaken, full of bloodthirsty raiders, ice, sea monsters and other horrors. To our northern cousions these threats are enough to make them hesitate from stepping foot into water deeper then a puddle. They shall never know the thrill of losing sight of land, and what it is like to make the deepest of connections in the temple of the deep blue mother. And when those land-lobies ask why? Why we could possibily choose such a fate? We will answer with this:\n“Because I! ...  am a man! ... of the sea!."
 sordrenic_trade_power: "Trade Power"
 sordrenic_trade_power_desc: "The deep blue mother's gentle embrace caresses our shores, beckoning our people to engage in trade endeavors. Our bustling commercial cities and strategic trade posts scattered throughout the seas will play a crucial role in realizing our ambition to become the dominant force in trade."
 sordrenic_new_world: "Wanderlust"
 sordrenic_new_world_desc: "With each new discovery, new lands can be reclaimed by brave colonists and bring valuable trades to the Motherland. We will send a few loyal colonists that will form the backbone of our colonies. For a strange wanderlust compels the salt sordrenics to seek out the wonders of the world. Even the most fiercest of storms, or savagest of sea monsters has a beauty that is mesmerizing. Oh what other marvels might we find in the world, past the humble yet familar shores of our motherland?"
 sordrenic_marine_infantry: "No Paradise For Cowards" 
 sordrenic_marine_infantry_desc: "With a strong navy comes the need to have the crews of those ships able to fight in every situation, including those where they fight outside the vessels. In order to overcome that problem, we will regulate our marine infantry so they become a powerful tool."
 sordrenic_ambition: "Rulers of the Waves"
 sordrenic_ambition_desc: "A massive sea presence is required for any nation attempting to rule the waters. Our fleet will be so imposing that the shores of our enemies will always be surrounded by our vessels."
 sordrenic_colonial_governors: "Loyal Governors"
 sordrenic_colonial_governors_desc: "By sending the most capable of our men to govern our colonies and outposts in the name of our rulers, we will ensure that they stay calm and loyal, while we profit the most."
 
 A169_serpents_bay: "Serpent's Bay"
 A169_serpents_bay_desc: "The coves of Little Serpent are named for the pale sandbars that coil through the shallows like sleeping serpents. Human quarry families have worked those shifting banks for generations, reading the tide by moonlight, singing charms against sinkholes, and marking safe paths with carved stakes of driftwood. What outsiders dismiss as common sand is the foundation of our hearths, windows, roads, and harbor works. By binding the bayfolk guilds to the crown and protecting their old rights, the Serpent's Bay can be harvested with discipline instead of desperation, turning a dangerous shore into the quiet wealth of the realm."
 serpentar_house_of_cowards: "House of Cowards"
 serpentar_house_of_cowards_desc: "The Serpentar name has survived by refusing to mistake dead heirs for glory. Their enemies call them cowards for closing the gates, flooding the ditches, and waiting behind stone while hunger and rain do what pride cannot. In Little Serpent, Emmonum, and every hall that bends to their blood, the insult has become a family doctrine: a living ruler can rebuild a burned town, but a brave corpse rules nothing. Let poets mock them from safe taverns; the House of Cowards endures behind walls that do not break."

 stone_sordrenic_tradition: "A Stream Through Stone"
 stone_sordrenic_tradition_desc: "Stone yields to no one, except the water that remembers every crack, every hidden seam. Our grandfathers' grandfathers learned to rule as water rules: not by breaking through, but by finding the way that was always there and expanding from there. The passes remember our footsteps; the high valleys echo with generations of whispered oaths. Where Northern lords shout their authority from gilded halls, we simply endure, and the mountains themselves become our throne."
 stone_sordrenic_tenacity: "Rock and Stone"
 stone_sordrenic_tenacity_desc: "Let them come with their bright banners and summer campaigns. We've buried seven dynasties of would-be conquerors in these valleys, and we'll bury three if we must. Our grandmothers still tell the story of the Siege of Ravens' Gap-forty-two days without resupply, eating boot leather and moss, until the enemy broke first. Every farmstead is a fortress; every shepherd knows which boulder marks the weapons cache. When you're born to stone, you learn that survival isn't glory-it's just Tuesday."
 stone_sordrenic_keepers_of_the_gate: "Keepers of the Passes"
 stone_sordrenic_keepers_of_the_gate_desc: "Our coastal cousins boast of their harbors and merchant guilds, their flowy poetry praising gentle Inner Sea breezes-but they've never guided a caravan down the thousand steps of the Devil's Stair in monsoon season. The rift's verticality is our monopoly and our curse: every bolt of silk climbing toward Ardraine must pay our tariffs, trust our guides, pray to our saints. We lose two traders in ten to rockslides, bandits, or simple exhaustion, but the profits on the eight who survive make empires jealous. The northern markets need what the south produces, and we're the blood vessel connecting them-one that demands payment for every heartbeat."
 stone_sordrenic_mercantile_expansion: "Mercantile Expansion"
 stone_sordrenic_mercantile_expansion_desc: "You don't haggle in five languages across three climate zones without absorbing something. Our merchants return from distant plateaus with more than exotic goods-they bring irrigation wisdom from desert kingdoms, metallurgy secrets whispered in mountain smithies, architectural innovations from peoples who also build on the edge of geological catastrophe. A proper Sordrenic trader can assess obsidian quality by firelight, recite philosophy to impress educated buyers, calculate compound interest faster than a Crelzertian banker, and knows exactly which local tyrant prefers flattery to silver. Commerce carved these valleys as surely as water did."
 stone_sordrenic_a_strong_rule: "A Strong Rule"
 stone_sordrenic_a_strong_rule_desc: "Three cousins, two brothers, and a distant uncle all claimed the high seat at Grandmother's funeral-we lost half the eastern valleys to feuding before the body was even cold. You can still see the burn marks on the Council Hall doors from when Lord Petran's faction tried to smoke out Lady Mira's supporters. \n\nEnough. Our people are tired of choosing which second cousin to die for, tired of trade routes closed by family spite, tired of explaining to bewildered foreigners which banner currently means safe passage. One ruler, one law, one nation-or we'll have none at all."
 stone_sordrenic_pandurs_recruitment: "Caminaires"
 stone_sordrenic_pandurs_recruitment_desc: "The Caminaires  aren't pretty like the High Kingdom's ceremonial guards-they're the men who know every smuggler's cave and sheep-thief's hideout in fifty miles. In peacetime, they're the ones who drag drunks out of the tavern and track down cattle rustlers; when war comes, they melt into the crags like morning mist and turn every ambush pass into a killing ground. Light infantry sounds almost delicate until you've seen them descend like carrion on an enemy baggage train, strip it clean, and vanish before the vanguard even knows they've been hit. Every valley needs its watchmen; we're simply ensuring ours know how to fight."
 
 elven_artisanry: "Elven Artisanry"
 elven_artisanry_desc: "Elven cities have long stood as beacons of art and refinement even in the darkest of times. In ages past, the lavish courts of ours set the standard by which all culture was judged, as all across Etra people looked at them in awe for inspiration. By renewing our traditions of patronage and craftsmanship, we shall ensure that the culture of our people flourishes once more."
 elven_discipline: "War Remembered"
 elven_discipline_desc: "Elven soldiery are not like the masses of ratfolk or human, as each elf has perfected at least one of the paths of war. A foe is met first with a never ending torrent of arrows, and then a staunch line of spears."
 elven_metal_movable_type: "Metal Movable Type" 
 elven_metal_movable_type_desc: "Though movable type is an old invention, it was long regarded as an expensive novelty, reserved only for the rich and powerful. Its true potential was realized only through the patient course of elven refinement. By casting letters in enduring metal and standardizing their use, elven artisans transformed printing into a precise and efficient craft. The result is a system capable of producing books in volumes no other people can rival." 
 elven_grand_code: "Grand Magistrates" 
 elven_grand_code_desc: "While elven courts are no less hotbeds of intrigue and factional struggle then any other, their greatest strength lies in the close bonds shared between the cabinet and its princes. These ties of trust and long-standing friendship allow a prince’s will to be carried out swiftly and faithfully through their closest advisors." 
 elven_diplomats: "Sharp Tongues"
 elven_diplomats_desc: "Lacking numbers, we have opted to use a far more subtler weapon. Diplomacy is equally as effective as hundreds of soliders in battle, as rivals are guided into wars of our making whilst ensuring that the elven realms remain untouched."
 elven_long_lived: "Centuries of Command"
 elven_long_lived_desc: "A hardened Elven general has seen doctrines and technology come and go like the seasons themselves. While embracing the new ways of warfare, the lessons of the past serve well."
 elven_experimental_riflemen: "Experimental Riflemen"
 elven_experimental_riflemen_desc: "From longbow to these new experimental rifles, elven mastery of ranged warfare has reached its zenith. These sharpshooters combine unmatched eyesight with generations of inherited technique."

 erlfolk_endurance_of_the_long_dark: "Endurance of the Long Dark"
 erlfolk_endurance_of_the_long_dark_desc: ""The willow knows what the storm does not: that the power to endure harm outlives the power to inflict it."\n— Rhalaeth Ironbark\n\nEach Forest Spirit is a living relic of an age long past, bearing the wisdom of millennia within their gnarled forms. They serve as guides, as caretakers, and at times as resting places for the court itself, their hollowed trunks cradling weary travelers through the night. Yet beneath that serene patience lies an unyielding resolve. When the Realm is threatened, these gentle giants wake as something far older and harder: they bring their vast strength and their deep-rooted bond to the land to bear against any who would defile their sacred home, and they crush them. The willow bends, and endures, and does not forget the axe."
 
 giantsborn_tradition: "Battleborn"
 giantsborn_tradition_desc: "By virtue of their sheer size and strength, the giantsborn dominate the battlefield. Wielding arms and wearing armor that would crush the smaller kindred, a battleline of Giantsborn warriors are a fearsome sight."
 giantsborn_people_of_war: "People of War"
 giantsborn_people_of_war_desc: "Wars can be a long and tiring affair. If we are to keep our independence, we need to be prepared to endure hard times. Luckily, our people are as tenacious as the land they call their home, and resist foreign invaders to the last."
 giantsborn_calpixcayotl: "The Tribute Provinces"
 giantsborn_calpixcayotl_desc: "A system of subjugated local warlords and rulers, they send us gifts of allegiance as a sign of our overlordship. To refine and centralize this system would only tighten our grip over them."
 giantsborn_tradition_of_conquest: "Tradition of Conquest"
 giantsborn_tradition_of_conquest_desc: "Conquering people can be a tricky business, not everyone is ready for our enlightened government. Still, we have discovered that there are easier ways than building a mountain of skulls to bring people into our empire. It is something that our ancestors never learned."
 giantsborn_return_of_quetzalcoatl: "Return of the Titans"
 giantsborn_return_of_quetzalcoatl_desc: "In times of consolidation, the Giantsborn have turned to ancient symbols of authority. Through these rituals, the bonds between ruler and the estates are reinforced."
 giantsborn_monuments_to_greatness: "Monuments to Greatness"
 giantsborn_monuments_to_greatness_desc: "Large in stature and ambition, across their realms the Giantsborn rise monuments that seek to challenge time. Vast works of stone and labor that stand as undeniable proof of their greatness, all who look aupon their works and despair."
 
 tiefling_infernal_heritage: "Blood of the Damned, Children of the Saint"
 tiefling_infernal_heritage_desc: "Every child born with horns and tail learns the same lesson: the world judges them before they draw breath. But the blood that marks us as cursed also refuses to break. Our warriors bear scars-from battle, yes, but also from stones thrown by frightened villagers, from brands meant to "purify." That pain becomes armor. What was meant to destroy us instead forges soldiers who cannot be shaken, who have survived worse than any enemy can offer."
 tiefling_oathbound_warriors: "Vows to Dead Saints"
 tiefling_oathbound_warriors_desc: "We swear our oaths to the Commonweal, to the people of Torrent, to Junil's memory-so many vows they tangle in our throats. We swear our oaths not because we are brave, but because we are desperate. Every vow is a plea: Let my service prove our worth. Warriors train until their bodies break because Junil gave us an electorship, a seat among the great powers of the realm, and every day we must prove we deserve it. They fight with the fury of those carrying a dead saint's reputation on their shoulders, terrified that one failure will undo centuries of his mercy."
 tiefling_sanctified_blades: "Steel Blessed by Doubtful Priests"
 tiefling_sanctified_blades_desc: "The priests of the Commonweal bless our weapons-some with conviction, many with barely concealed revulsion. Each consecration is a test: will you honor Junil's legacy or confirm our fears? Our soldiers feel the weight of every grudging prayer, every blessing given because law demands it, not because hearts believe. In battle, they fight as if each victory might finally convince the faithful that Junil saw something real. That his gift wasn't mistake or madness, but vision."
 tiefling_pact_of_the_torrent: "Damnation Refused"
 tiefling_pact_of_the_torrent_desc: "There once was a city whose name is now ash, a place of such profound sin that divine wrath itself took place. It was dragged down screaming into the dark pit below, every soul within condemned for crimes we inherit but never committed. Yet our ancestors refused damnation. Through the howling dark and endless torment, through layers of hell that broke stronger souls, they clawed their way back. What they emerged as from that pit was escapees, scarred by the climb, marked by the flames, transformed by passage through damnation itself.\n\nWe are punished twice, once for our ancestors' sins and once again for their virtue. Damned for the city that fell, and damned again for having the strength to return. We carry the impossible weight of crimes committed before our great-grandparents drew breath, and we will carry it until the world finally understands what we have always known-that climbing out of hell is harder than falling in, and those who make that climb deserve something better than eternal suspicion."
 tiefling_crusade_zeal: "Fervor Born of Fear"
 tiefling_crusade_zeal_desc: "When the call to holy war comes, we answer first-not because we are faithful, but because we must be. To refuse is to confirm every whispered accusation. So we march when others rest, fight when others flee, endure cold and hunger and exhaustion because suffering is familiar. It's proof. It's penance. The zeal that drives our armies isn't righteous-it's the fevered energy of drowning souls clawing toward air, toward worthiness, toward the impossible dream of salvation."
 tiefling_temple_legions: "Congregations of the Condemned"
 tiefling_temple_legions_desc: "Our temples are not places of peace. They are fortresses where the faithful drill and pray with equal intensity, where every sermon ends with the command to prove yourselves worthy. The legions that emerge are not just soldiers-they are congregants armed and armored, fighting to earn their place in a heaven that may bar them at the gates. When the realm calls, they assemble with terrifying speed, driven by the knowledge that hesitation confirms suspicion, that slowness is damnation."
 tiefling_devotional_fury: "Rage Dressed as Righteousness"
 tiefling_devotional_fury_desc: "In battle, the line between faith and fury blurs. Our soldiers fight with a violence that terrifies allies and enemies alike-not from cruelty, but from desperation. Each blow is a prayer screamed through gritted teeth. Each kill is proof: See? I serve. I am good. I am not what you think I am. The traditions passed down aren't just tactics-they're survival strategies etched in blood, the accumulated wisdom of generations who learned that mercy earns only suspicion, that only overwhelming devotion might earn scraps of trust."
 tiefling_blood_pact_rites: "Covenants of Self-Loathing"
 tiefling_blood_pact_rites_desc: "We perform the old rites because we hate what we are and cling to anything that might change it. The blood pacts bind us not to darkness, as outsiders whisper, but to impossible standards of purity. Through ceremony and sacrifice, we swear to be better than, to overcome our nature through sheer force of will. The fervor with which we embrace the faith is the fervor of those trying to burn away their own skin, to transform damnation into devotion through sheer, desperate conviction."
 tiefling_hellforged_resilience: "Endurance of the Unwanted"
 tiefling_hellforged_resilience_desc: "We do not break because we cannot afford to. Every tiefling child grows up hearing it: They're watching. They're waiting for you to fail. To confirm what they already believe. So we endure. Hunger, exhaustion, wounds that would fell others-we bear them in silence, afraid that complaint is weakness, that weakness is proof. The mercenaries who join our ranks find that service demands not just skill, but the ability to suffer without flinching, to carry burdens with a smile because showing pain invites judgment."
 tiefling_righteous_conquest: "Redemption Through Subjugation"
 tiefling_righteous_conquest_desc: "We tell ourselves that conquest is salvation for those we conquer-that bringing them into the fold of true faith redeems both them and us. But the truth sits heavier: every territory claimed is another chance to prove ourselves. Another population that might, eventually, see past our horns. Another desperate gambit that if we are righteous enough, faithful enough, perfect enough, the stain of our birth might finally wash clean. We offer redemption because we crave it. We demand conversion because we pray it might save us."
 tiefling_infernal_legacy: "The Joke Written in Flesh"
 tiefling_infernal_legacy_desc: "We are the living answer to the question: What happens when you give devils a chance? And we will burn ourselves out proving the answer is "They become the most faithful of all." And then the ultimate cruelty: we are no more evil than anyone else. Humans murder, giantsborn scheme, Elves war-but when we stumble, it confirms ancient prejudice. When we excel, it's suspect. We have built a culture of warriors and zealots not from inherent nature, but from brutal necessity. Our legacy is not infernal power-it's generations of children taught to hate their own reflections, to fight twice as hard for half the respect, to die proving what should never need proof. We are the punchline to a cosmic joke: damned by appearance, saved by desperation, and good precisely because the world demands we be better than everyone else just to be seen as equal."
 
