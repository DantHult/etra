 country_history_rattolini: "The warrens echo with skittered whispers for a great tragedy has befallen Ratkind: Father dearest, the greatest of all Ratkind, the true exemplar of our race, before whom even humans lowered themselves, the patron sought by the finest poets, blessed by the many and the one, the first Rat King since the days of yore, now lies dead. His corpse was scarcely cold before his many duplicitous progeny began carving up their 'inheritances,'  by way of the sword and with the backing of a will as dubious as their author.\n\nVaults once sealed are pried open, sworn oaths have grown conveniently faint, even the most loyal captains must consider finding new pay-masters. Old famial rivalries, suppressed under the crushing authority of the Great Rat, have roared back to life with a feral intensity. And all the noise this produces travels well beyond the warren walls. As exiled princes, men with a strong sword-arm or the backing of some Undead Lord, listen intently, with their ear to the wall.\n\nFor all of Ratticar’s blessings, his greatest flaw was also his greatest boon: his longevity. He outlived his first-born son, and that son’s first-born in turn, leaving only a young pup as the heir to the kingdom, and an impossible legacy. Whilst the young pup bears the blood, the titles, the name, he lacks the claws: Every cousin, uncle, and half-forgotten broodmate now circles the Kingdom as how vultures circle carrion, each certain that #italic They and They Alone#! are what the throne of Ratkind truly deserves, and they are the #italic True#! heir to the title of Great Rat King.\n\nOnly time will tell what will happen to this Kingdom of gnawing ambition and frayed kinship."
 country_history_A02: "Hail, Sword-Brethren!\nHear now the words that bind our Order, and give strength to our purpose. For this is the History of our Order, which all Scarlets shall know.\nWhen the clarion call thundered across the lands from the High Temples: A Righteous Crusade declared upon the foul Undead. We did not hesitate. We rode out in the name of the good, the living, the beautiful, and the Gods above. Side by side we stood with adventurers from across Edorinn, and the Rovina, liberating the living from the bondage of the dead. Smiting the Undead wherever they crawled, driving them back from into whatever hole or abyss that they came out from. With great wisdom, and even greater sacrifice, we forged what are now known as the Freeholds. Consecrating land which was cursed. Those were some of the brightest days of our Order. \n\nBut we were betrayed\nCorrupted by greed, our supposed allies, oath breakers all, opted to clutch their meagre and ill-gotten gains. Some even stooped as low as making peace, and worse yet – accepting a status of servitude from the Dead. Kings and dukes, they may posture as, but beggars from the muck is all they are. And now merchants complain of “unfair” taxes, nobles grumble over levies and laws, and soft-bellied lords demand we lay down our arms. They forget who delivered them from Evil; they forget what price freedom from the grave demands.\nWe shall remind them.\nWhile that accursed Empire festers and squats in the South, masquerading in the grandeur of old, deluding themselves that they were once the legendary ancients, the living shall know no true peace, no divine safety, no freedom. Until the so-called undying-Imperators are cast down and the land is made pure once more, our crusade cannot end.\nThe Scarlet Order stands resolute.\nLet Evil tremble."

 country_history_godhand: "The origins of the peoples and states that make up the Freeholds, normally the bits of land in the northern lands of the Godhand Peninsula, are varied. As nations flowed into it across the years. Bound by the White Mountains to the north, the twin seas to east and west, and the ancient provincial lines of Moran Superior to the south, these lands are a patchwork of old blood and new purpose. The largest and most common of these groups are characterized by two groups.\n\nFirst, the crusaders and mercenaries from across Etra who once marched beneath holy fire and simply never left, choosing to remain in the land for a myriad of reasons. The forts evolved into towns, the camps settled down into keeps, and oaths became laws.\n\nSecond, the remnants of what are now called commonly called Ruined Kingdoms, those battered realms and nations that claim lineage from the ages before the Day, when the world had not yet cracked beneath the sheer magical forces it unleashed. Though shattered, scattered, and scarred, the peoples have endured despite it all, and their surviving lineages now mingle with the crusaders.\n\nAnd so as the Freeholds are today: Caught between two epochs, the ancient and modern, the new and the old. And not a single nation but an assortment of survivors, settlers, heirs, and dreamers."
 
 country_history_A01: "In life we had not just forged an Empire, but The Empire. The one by which all others shall be judged, and shall be found wanting, even our own. The Occuli foresaw it to be the final Empire of Empires, and those visions may still be correct. From a lone, unremarkable city among many, we rose. We came. We saw. We conquered. And brought civilization to all corners of this world. And in time, the Empire stretched from the lands of dusk to the shores of dawn.\n\nA thousand nations bent the knee: the Lion Lords of the burning South, the Giant-Kings who strode from the lands of frost and terror, and all the nations between. Our banners touched the heavens atop conquered mountains by the sword; wild frontiers were transformed into well-cultivated farmlands by the plow; We begun to burn brighter then the stars themselves. Such was the glory of Moran.\n\nNow we gaze upon our old works with new, cold, unblinking eyes.\n\nFor we can no longer be counted amongst the living, but as undying echoes. Bound to the mortal world by means, or for destiny, still obscured. As in the catacylasm known as The Day, we walked out from the tombs, graves, and nercopolies. We walked the roads and ruins of The Empire-That-Was, adapting to what Fortune has granted us.\n\nAnd yet, we shall not exist as shades of decline, but as Moran anew."
 
 country_history_A26: "I am Valerius Draconis, general of the First Legion, slayer of the dragon Archeon, and many more accolades, yet foremost among them, a faithful servant of the Empire-That-Was. Though death has stripped the flesh from my bones, my will remains much the same. In life I shattered a thousand foes; in un-life I shall break ten thousand more, should Fortune demand it of me.\n\nFor death does not release the servant, as the duty of a good soldier does not perish with the body. For in the days before, did the memory of soldier’s valor not stir their comrades to feats beyond their lonesome strength? So as it was, so shall it be, as my memory endures, and so let my example compel those who follow in this new life. My final command, as directed by They-Who-With-True-Authority, was to safeguard the lands of Ellyria. So long as thought persists within my being, and the heavens see fit to permit this charge, I shall stand the watch.\n\nI will uphold my oath until the world’s ending, and beyond if need be."
 
 country_history_A163: "Bourfort's lords do not present themselves as mere keepers of a hillfort. House de Hauteclaire claims its honor from Armand the First Banner, the knight who raised a white-and-gold standard above Bourfort's old watchtower when the western marches still paid tribute in iron, hostages, and hurried prayers. His descendants turned the watchtower into a court, married into the better blood of the Berenguer, and filled the chapel vault with charters proving every oath they had ever been owed.\n\nThe late Theobald kept that inheritance by sword and ledger alike, breaking raiders in the field while binding lesser burgs to Bourfort through debt, marriage, and carefully remembered favors. Now Valerand de Hauteclaire inherits both the polished dignity and the sharpened obligations of his house. He is young enough to hunger for a greater title, but old enough to know that prestige is never inherited whole. It must be performed, defended, and made useful."

 country_history_A51: "To walk in the city of [ShowLocationName('commonweal51')] is to see the world as it once was - as it could be yet again. The elves of Ihonntaur are self-assured, dignified, regal; they know themselves to be the center of civilization, Elven or otherwise, in all of [ShowSubContinentName('western_europe')]. For with the degradiation of the High Kingdom who else still holds the threads that reach back to the ages before? Who else carries the pedigree to be entrusted with the preservation of the Holy Commonweal and the fullfillment of its dreams? \n\nWhen it was revealed by the diviners what the [end_times|e] was and would yet be, the Elves withdrew. Folding their cities and the better part of their civilization into another dimension and let the ruin of that age pass over them. And when they returned, they returned in triumph, as saviors, casting their lot with the Junil's fellowship at the hour of greatest need.\n\nNow the Princes of Illhoneate sit among the electors of the Commonweal, and there are few powers in its politics they do not touch."

 country_history_erlfolk: "The Erlfolk never withdrew. When the High Elves folded their cities into another world and departed, the Erlfolk remained in Etra, left to rot, as they tell it, in the ruin of that age. Yet they did not rot. They survived; they persisted; they endured the long dark and stood against the Undying Emperor while the high cities sheltered elsewhere.\n\nIt is this that hardens their scorn for the Illhoneate. The Princes withdrew, returned in triumph, and now presume to speak for all Elvenkind, but it was the Erlfolk who stayed, who bled, who held the world together with their own hands while it came apart. They, not the exiles who fled and came home garlanded, are the true heirs to the mantle of Elven legacy."

 country_history_hawairqi: "Once, the Hawairqi lived among the skies, dwelling atop floating islands, the largest of which was called the Floating Continent. These sky-islands were bound to one another by a great many airships and flying machines.\n\nThat was until the [undying_emperor|e].\n\nThe Hawairqi had weathered the Cataclysm relatively unscathed, so when the Emperor marched from the South at the head of a great host, they answered with the largest air-fleet the world had ever seen — or ever would. At first the battle went well: the airships and flying machines unleashed their payloads and strafed the grounded armies below, sweeping aside what little air-power dared oppose them.\n\nThen the Emperor spoke a terrible edict upon the battlefield — the Grounding.\n\nFirst the birds fell from the skies. Then men. Then the flying machines. And at last the floating islands themselves came down to meet the earth. From that day, the people of the skies have remained forever grounded. They rose from the wreckage, enacted what vengeance they could upon their adversaries, and carved out a place for themselves below within the Holy Commonweal."

 country_history_A325: "We were the hawks who ate the sun.\n\nA thousand years ago [ShowCultureName('hyriovari_culture')] still knew how to spend a Host. Phaetheon took the High Claim and made it flesh: he drilled the Foot Companions until the pike was a single animal, yoked [ShowAreaName('typhrea_area_1')] through three garrisons rather than a hundred occupations, broke the other three kinds in the field, and rode until the world that could feed that army ran out. Then he died. The Companions did what Companions do. One house took [ShowLocationName('etra304')] and the tombs at [ShowLocationName('etra66')]. Another took the body into the dark. [ShowAreaName('typhrea_area_1')] slipped the Fetters. The north came down.\n\nWe are that house. The Kynarides were Companions, not his blood. We fly his sun. We keep his empty tomb. We tell a marriage-story no archive will swear to. Hyriosia writes commentaries on why we were never quite Golden enough. We answer that they are alive because we still keep the pass against [GetCountry('A354').GetName] and the storm behind them.\n\nThe Host is not replaceable. Every Companion spent is a Companion we will not see again; our kind does not breed a phalanx back into being. That is arithmetic, not twilight. We have rebuilt the drill, the mines, the timber, the Wall. We can do this again. We cannot do it twice."

 country_history_A332: "Arinera is a thesis statement as much as it is a country, ruled for roughly hundred and fifty years by the dragon queen who first conceived it. Vaeaelionys was once a companion of the Junil, those who defeated the [undying_emperor|e] but she left when the war was over and the time came to transition from the great coalition to the Holy Commonweal. She believed that, given the nature of their world, mortals would need a strong and unyielding hand to rule them, and that the Junil's dream would only condemn the world to more pointless violence, as the apocalypse had shown.\n\nFor years she travelled in search of a people who might become the catalyst for her grand experiment, until in time she returned to the land of her youth. There she took the volcano of [ShowLocationName('etra864')] for her seat and the scattered Vothivrian for her inheritance, and proclaimed to the assembled tribes the Dominion of Arinera, her power and legitimacy acknowledged by Eternalist clergy and Vothivrian lord alike. Since then, lesser thrones have bent or broken before the red-and-gold banners of Arinera.\n\nVaeaelionys is ancient compared to most mortal rulers and shows no sign of mental or physical decline. What Arinera shall become when that endurance ends, no diviner dares predict; but while Vaeaelionys yet rules, her enemies hear the beat of wings, and tremble."

 country_history_europe: "At least Thrice has Etra perished. Once by Flame, Once by Frost, Once by Steel, and very nearly a fourth time: As terrible magical cataclysm erupted and shattered the world, birthed and stopped by hands unknown. In nearly three hundred years since that day, from the ashes of what once was, arose the realms reborn.\n\nNow the myriads of people of Eborrin stand at the precipice between greatness and calamity. \n\nAt the center of the continent lies the perpetually stagnating [GetUniqueInternationalOrganization('hre').GetName], a patchwork realm birthed from the fellowship of peoples who defeated the [undying_emperor|e] and ushered in the present age. Its founder, the Junil, envisioned a Blue and Gold Dream: to forevermore secure the universal wellbeing of all its peoples, the obliteration of evil, and the stability of the world. Since its founding, though, the realm has slowly descended into aristocracy and dysfunction.\n\nTo the South, the Pennisula of Godhand is divided between the Northern Freeholds, a multitude of petty kingdoms that were established by highly ambitious adventurers, and the southernly Undead Empire of Moran. They are a race of undead beings who used to be one of the mightiest Empires in the ancient age.\n\nTo the South East, in Typhrea, the ancient Kingdoms of Elves continue their rivalry and in-fighting as they always have\n\nWhat our country becomes now is not yet written, the entire world is on the verge of major changes, and it will be up to you to lead through this period."
