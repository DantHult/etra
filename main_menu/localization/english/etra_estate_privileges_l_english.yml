l_english:
 cyrewin_chartered_factors: "Charter of the Long Factors"
 cyrewin_chartered_factors_desc: "The Long Factors are Cyrewin's senior merchant combine: their syndics hold standing seats on the commerce bench and speak as of right in the Ring Moot. Their charters bind warehouses, caravan-serais, and offshore factors into one ledger, while their treaties with the [ShowEstateTypeName('nobles_estate')] keep tariffs predictable and disputes out of the streets. Love them or buy them out, you cannot run the ring-trade without them."
 cyrewin_shieldmarshal_charter: "Shieldmarshal Charter"
 cyrewin_shieldmarshal_charter_desc: "Shieldmarshals are elected captains drawn from the old soldier-houses, tasked with muster, walls, and the defense of the outer ring. Elsewhere such offices end at the drill-yard; here the charter also charges them to voice the commons before the Moot, to sit as assessors in trade quarrels, and to answer for the condition of arsenals and sea-gates. It concentrates steel and speech in the same hands—dangerous when ambitious, invaluable when honest."
 cyrewin_ring_compacts: "Compacts of the Ring"
 cyrewin_ring_compacts_desc: "The Compacts are not one law but a sheaf of agreements inked between the magnates and the Moot: which levies may be raised, which posts require election, and what a syndic may demand of a sworn house. They shelter the great families from capricious seizure while binding them to fund courts, lamps, and patrols along the ring. Break a Compact and you do not merely anger nobles—you unravel the trust that keeps Cyrewin's markets open at dawn."
