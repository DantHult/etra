l_english:
 A42_f: "Sordren"
 A42_f_desc: "Since the earliest days of our civilization, Sordren has been divided, whether internally by its many competing polities, or occupied by foreigners at the hands of our common enemies. Over the centuries, our power dwindled as we were conquered, split up, and our treasures taken by conquerors. It is an insult to our extensive legacy of art, sport, and invention to exist in such a fragmented state! To unite the Sordrenic lands under one flag and one ruler is our only path back to the greatness of our past."
 A52_f: "$A52$"
 A52_f_desc: "This year will mark the beginning of an evolutionary period for our nation. The old feudal ways must make way for a more modern, centralized state."
