 A317_f: "Serenland"
 A317_f_desc: "For generations, the Serens made merchants fat and lords comfortable, yet no single hand claimed has thus far claimed it in its entirity. A hundred petty masters, river counts, abbey-princes, guild monopolies, bled the great water red with competing tolls and jurisdictions. The levies, the barge rights, the chokepoints that once filled separate coffers now flow to unified purpose. Ardraine's ambitions bend around us, Torrenter clans find common cause through us, and foreign kingdoms discover they need what only we control. The river runs through our fingers. So does everything it carries."

