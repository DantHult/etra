 Rattopaese_f: "$A13$"
 Rattopaese_f_desc: "Once, the Verminus dynasty ruled all the Lands of the Rat from a single throne. That unity was shattered by succession quarrels and uncle-kings. To reunite Rattopaese is to restore the legacy of the Verminus line and end the age of fratricidal war."
 A320_f: "Sorlkol"
 A320_f_desc: "Placeholder description for Sorlkol formable."
 A377_f: "$A377$"
 A377_f_desc: "At the morning of the world a Great King ruled the [ShowCultureGroupName('typheraii_group')], and his four children murdered him for that crown. With his last breath he cursed them: that they should never know peace among themselves, nor their kin among their sibling's kin. High and Dark, Wood and Steppe have kept that curse more faithfully than any law, spilling one another's blood across [ShowAreaName('typhrea_area_1')], [ShowAreaName('cynoar_area')], [ShowAreaName('mare_arborum_area')], [ShowAreaName('erebum_area')], and [ShowAreaName('ashon_area')] for for countless years. Now one nation holds all four homelands, and a King has been avenged a thousand times over. Let there be peace."
 A378_f: "$A378$"
 A378_f_desc: "The High Throne stands empty and the Mandate is broken. Petty warlords carve the Iborric heartland into rival domains, each claiming the legacy of a vanished empire while the rivers run with the blood of kin. Only by reuniting [ShowRegionName('iboros_region')] under a single crown can the [ShowCultureGroupName('iborian_group')] people restore the Iboric Mandate and end this age of division."

