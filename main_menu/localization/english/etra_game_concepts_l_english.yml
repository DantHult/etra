l_english:
 game_concept_end_times: "The Cataclysm"
 game_concept_end_times_desc: "The magically induced apocalypse that ended the Old World and all but unmade Etra. Known also as the Great Torrent and the Day; one event, many names."   
 game_concept_day_of_apokatastasis: "Day of Apokatastasis"
 game_concept_day_of_apokatastasis_desc: "The 1066 awakening of the ancient Morans from tombs, battlefields, and forgotten necropolises. It came amid the Great Torrent, the Day, the Cataclysm, the Longest Monday, or the Wound which did not heal; names for the moment after which the world was never the same."
 game_concept_compact_of_adune: "Compact of Edorinn"
 game_concept_compact_of_adune_desc: "The 1107 settlement that formalized the Junil's coalition into the Holy Commonweal. Born from the thirteen tribes' war against the Undying Emperor, it promised order after the Cataclysm and bound western Edorinn to a common cause: for the greater good."
 game_concept_the_junil: "The Junil"
 game_concept_the_junil_desc: "The leader who first appeared after the Undying Emperor grew bored of its completed conquest. In 1097, thirteen tribes named the Junil Supreme Commander, forming the coalition that fought across western Edorinn and later became the Holy Commonweal. The Junil vanished from worldly affairs around 1133, leaving no recorded death, funeral, succession, or final statement."
 game_concept_undying_emperor: "Undying Emperor"
 game_concept_undying_emperor_desc: "An eldritch intelligence that entered Etra through the cracks opened by the Cataclysm. First appearing around 1068, they reshaped the newly awakened Morans, bent coincidence into intention, and conquered the weakened world during the Sixteen Year Conquest before withdrawing behind the mountains of Aita after the Meeting at Three Oaks. They have since believed to departed this world."
 game_concept_war_of_37_imperators: "War of 37 Imperators"
 game_concept_war_of_37_imperators_desc: "The Moran civil war that erupted in 1178, when the internal tensions of the New Moran Empire finally broke. Each Imperator refused to yield power to another, tearing the empire apart long before the Crusades reached their height."
 game_concept_godhand_crusades: "Godhand Crusades"
 game_concept_godhand_crusades_desc: "The Holy Commonweal's crusades against the undead in Godhand, fought from 1195 to 1291. They began as the Commonweal struggled to justify itself in a world that no longer needed it, rose to their high-water mark at Moras, and ended in an uneasy truce after years of war drained both sides."
 game_concept_long_siege_of_moras: "Long Siege of Moras"
 game_concept_long_siege_of_moras_desc: "The 1238-1248 siege that marked the high-water mark of the Godhand Crusades. Commonweal armies, driven by holy fervor, closed around Moras and sought what they called the end of an abomination, until [GetCharacter('A01_decius').GetName] broke the siege and ensured the eternal city would never again be directly threatened."
 game_concept_pale_one: "The Pale One"
 game_concept_pale_one_desc: "A fearful name that spread through Commonweal lands after [GetCharacter('A01_decius').GetName] broke the siege of Moras. Some used it for [GetCharacter('A01_decius').GetName] himself, others for the Undying Emperor's lingering curse, and others for any pale sickness, famine, or disaster believed to have followed the undead out of Godhand."
