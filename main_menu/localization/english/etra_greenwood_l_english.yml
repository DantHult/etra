l_english:
 etra_paths_beneath_the_boughs: "Paths Beneath the Boughs"
 etra_paths_beneath_the_boughs_desc: "A stranger sees a tangle of roots and thorns. A warden sees the old paths between the hollows, the caches that can feed a company, and the clearings where the hunting families gather when the horns sound."
 etra_warden_lodge: "Warden Lodge"
 etra_warden_lodge_desc: "The hunters who keep this lodge know which paths will bear an army and where to keep its stores dry. When called to war, they muster as Greenwood Rangers."
 etra_warden_lodge_upkeep: "Warden Lodge Upkeep"
 etra_rights_of_the_hunt: "Rights of the Hunt"
 etra_rights_of_the_hunt_desc: "Recognize the hunting families' right to keep their own woodland customs. In return, the wardens bring more of those families to the muster at every lodge we hold."
 etra_requires_held_greenwood: "Own and control a Forest or Woods location."
 a_etra_greenwood_rangers: "Greenwood Rangers"
 a_etra_greenwood_rangers_desc: "Hunters and pathfinders who use the cover of the woods to bring their bows to bear."
 etra_levy_greenwood_rangers: "Greenwood Rangers"
 a_etra_greenwood_rangers_renaissance: "Greenwood Rangers"
 a_etra_greenwood_rangers_renaissance_desc: "Longbow companies drawn from the families that keep the old forest paths."
 etra_levy_greenwood_rangers_renaissance: "Greenwood Rangers"
 a_etra_greenwood_rangers_discovery: "Greenwood Rangers"
 a_etra_greenwood_rangers_discovery_desc: "Woodland marksmen and scouts who inherited the wardens' old paths and learned to fight with powder."
 etra_levy_greenwood_rangers_discovery: "Greenwood Rangers"
 a_etra_greenwood_rangers_reformation: "Greenwood Rangers"
 a_etra_greenwood_rangers_reformation_desc: "Woodland marksmen and scouts who inherited the wardens' old paths and learned to fight with powder."
 etra_levy_greenwood_rangers_reformation: "Greenwood Rangers"
 a_etra_greenwood_rangers_absolutism: "Greenwood Rangers"
 a_etra_greenwood_rangers_absolutism_desc: "Woodland marksmen and scouts who inherited the wardens' old paths and learned to fight with powder."
 etra_levy_greenwood_rangers_absolutism: "Greenwood Rangers"
 a_etra_greenwood_rangers_revolutions: "Greenwood Rangers"
 a_etra_greenwood_rangers_revolutions_desc: "Woodland marksmen and scouts who inherited the wardens' old paths and learned to fight with powder."
 etra_levy_greenwood_rangers_revolutions: "Greenwood Rangers"
 etra_oaths_of_root_and_bough: "Oaths of Root and Bough"
 etra_oaths_of_root_and_bough_desc: "Those who have kept faith with the old groves may ask their eldest spirits to stand beside them. An oath sworn beneath a living bough binds the keeper and the tree alike."
 etra_sacred_grove: "Sacred Grove"
 etra_sacred_grove_desc: "Under the care of the grove keepers, great living trees shelter travelers and keep provisions through the lean months. The oldest spirits may answer a summons from these woods."
 etra_sacred_grove_upkeep: "Sacred Grove Upkeep"
 etra_sanctuary_of_the_elders: "Sanctuary of the Elders"
 etra_sanctuary_of_the_elders_desc: "Entrust the clergy with the old sanctuaries. The grove keepers help the land recover after fire and war, and the elders gain a greater voice in the realm."
 etra_requires_held_sacred_grove: "Own and control a Forest or Woods location with a completed Sacred Grove."
 a_etra_elderwood_guardians: "Elderwood Guardians"
 a_etra_elderwood_guardians_desc: "Ancient living trees who shelter travelers in peace and stand beside the wardens when their forests are threatened."
 etra_elderwood_first_grove_limit: "First held Sacred Grove"
 etra_elderwood_second_grove_limit: "Second held Sacred Grove"
