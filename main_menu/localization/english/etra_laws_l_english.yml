 lux_aeterna: "Eternal Law"
 lux_aeterna_desc: "Establishing a legal code for undying beings presented an unprecedented challenge in Human history. The gods above administer a flawless system for divine, immortal beings, but how are mere mortals to capture even a spark of such divine order and transmute it into written law, so that all may be accounted for? To answer this question, successive Emperors, jurists and the finest legal minds in human history have undertaken the arduous task of crafting such a legal framework, drawing upon the centuries of rulings, customs, and the accumulated wisdom of the ancients.\n\nThe Eternal Law is the culmination of this effort: a codification of laws designed to govern both the living and the undying within the Empire. It unites traditional practices with formal statutes to ensure consistency, justice, and order across all provinces. By binding mortals and immortals alike to a shared framework, the Eternal Lex preserves the cohesion of the Empire and guarantees that authority, governance, and the rule of law endure across the ages."

 vexvec_matron_unions: "Matron Unions"
 vexvec_matron_unions_desc: "The sovereign may bind up to four consorts in recognized union at once—each bond a public contract, ranked by rite rather than by first come. This mirrors the old polygynous courts in number, but inverts their custom: the crown sits with the matron, and the husbands are the ones multiplied."

