 bourfort_widow_of_the_empire: "Widow of the Empire"
 bourfort_widow_of_the_empire_desc: "Bourfort is recovering from the pale famine that emptied its old Commonweal granaries. Memorial stores, public rolls, and a hard-earned fear of another failure have made the town more careful with food and sickness alike."
 STATIC_MODIFIER_NAME_bourfort_widow_of_the_empire: "Widow of the Empire"
