 bourfort_grannery_of_the_empire: "Grannery of the Empire"
 bourfort_grannery_of_the_empire_desc: "Bourfort's rebuilt granary system has become a permanent institution of storage, audit, and public relief, preserving vast reserves of food and increasing the city's ability to feed the surrounding realm."
