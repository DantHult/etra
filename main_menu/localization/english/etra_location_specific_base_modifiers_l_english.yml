 hormisetr_serpants_bay: "Serpants Bay"
 hormisetr_serpants_bay_desc: "The sheltered coves below Hormisetr are fed by warm shallows and pale sandbars, a fortunate shore where fishing huts, gardens, and new families crowd close to the water."
