l_english:
 etra_red_turban_rebellions: "Red Brotherhood Rebellions"
 etra_red_turban_rebellions_desc: "The [ShowCultureGroupName('iborian_group')] are revolting against their [GetCountry('A378').GetCulture.GetName] overlords. The rebels have declared the establishment of their independent states, throwing the entirety of [GetCountry('A378').GetName] into a civil war that threatens to devour us..."
 etra_red_turban_rebellions_strongest_red_turban_rebel_tt: "The [GetInternationalOrganizationType('etra_red_turban_rebels').GetName] have a leader who will need to own #Y 80.00%#! of the [locations|e] in [ShowRegionName('iboros_region')]"
 ETRA_RTR_EMPEROR: "The [GetUniqueInternationalOrganization('iboric_mandate').GetLeaderTitle] of the [GetUniqueInternationalOrganization('iboric_mandate').GetNameWithNoTooltip] [THIS.GetLocation.GetOwner.GetName]"
 ETRA_RTR_STRONGEST_REBEL: "Strongest Rebel Warlord [THIS.GetLocation.GetOwner.GetName] ($etra_rtr_iborros_allegiance$: #R [THIS.GetLocation.GetOwner.MakeScope.GetVariable('etra_rtr_iborros_allegiance').GetValue]#!)"
 ETRA_RTR_LOYALIST: "Loyalist [THIS.GetLocation.GetOwner.GetName] ($etra_rtr_iborros_allegiance$: #G [THIS.GetLocation.GetOwner.MakeScope.GetVariable('etra_rtr_iborros_allegiance').GetValue]#!)"
 ETRA_RTR_REBEL: "Rebel [THIS.GetLocation.GetOwner.GetName] ($etra_rtr_iborros_allegiance$: #R [THIS.GetLocation.GetOwner.MakeScope.GetVariable('etra_rtr_iborros_allegiance').GetValue]#!)"
 ETRA_RTR_NEUTRAL: "Autonomous and neutral [THIS.GetLocation.GetOwner.GetName] ($etra_rtr_iborros_allegiance$: #Y [THIS.GetLocation.GetOwner.MakeScope.GetVariable('etra_rtr_iborros_allegiance').GetValue]#!)"
 ETRA_RTR_LOYALISTS_TITLE: "Loyalists of [GetCountry('A378').GetNameWithNoTooltip]"
 ETRA_RTR_NEUTRALS_TITLE: "Neutral"
 ETRA_RTR_REBELS_TITLE: "Rebels against [GetCountry('A378').GetNameWithNoTooltip]"
 ETRA_RTR_YUAN_VICTORY: "[GetCountry('A378').GetAdjectiveWithNoTooltip] Victory"
 ETRA_RTR_REBELS_VICTORY: "[GetUniqueInternationalOrganization('etra_red_turban_rebels').GetLeaderCountry.GetAdjectiveWithNoTooltip] Victory" 
 ETRA_RTR_REBELS_VICTORY_DEFAULT: "Rebellion Victory"
 ETRA_RTR_SITUATION_TITLE: "The [GetCountry('A378').GetAdjectiveWithNoTooltip] Allegiance"
 ETRA_RTR_SITUATION_TOOLTIP: "Every country released during this situation has a predefined #Y $etra_rtr_iborros_allegiance$#! value which reflects their loyalty towards [GetCountry('A378').GetName]. When below #R 0.00%#!, these states will join the [GetInternationalOrganizationType('etra_red_turban_rebels').GetName]. Warring states that have over #Y 0.00%#! $etra_rtr_iborros_allegiance$ will be neutral instead, while those with over #G 50.00%#! count as loyal"
 ETRA_RTR_HOLDER_OF_THE_MIDDLE_KINGDOM: "The Iborric Mandate"
 ETRA_RTR_STRONGEST_REBEL_TITLE: "The Greatest Red Brotherhood Threat"
 ETRA_RTR_GRAPH_TITLE_TT: "Power of the Country"
 ETRA_RTR_GRAPH_TT: "[great_power_score|e]: [Country.GetGreatPowerScore|Y]"
 ETRA_RTR_GRAPH_FLAVOR_CHINA_TT: "#italic [GetCountry('A378').GetName] is always the antagonist of the [GetInternationalOrganizationType('etra_red_turban_rebels').GetName]#!"
 ETRA_RTR_GRAPH_FLAVOR_REBEL_TT: "#italic The strongest of the [GetUniqueInternationalOrganization('etra_red_turban_rebels').GetName] is determined by the military strength of the members on a monthly basis. Whoever has the highest military strength automatically becomes the warlord#!"
 etra_rtr_grant_titles: "Grant Titles"
 etra_rtr_grant_titles_desc: "#flavor The promise of rank and favor in the Golden Bull Throne's court would seduce anyone. By granting special titles and privileges to the rebel factions, we might persuade them to become our loyalists, or at least accept a temporary truce...#!\n\n[actor.GetName] will spend #R 5#! Legitimacy and transfer a portion of their [income|e] to raise the $etra_rtr_iborros_allegiance$ of a target country by #G +15#!"
 etra_rtr_grant_titles_select_country: "Select [ShowGovernmentReformNameWithNoTooltip('etra_warring_state')]"
 etra_rtr_grant_titles_no_countries: "$no_valid_countries$"
 etra_rtr_negotiate_with_rebels: "Negotiate with Rebels"
 etra_rtr_negotiate_with_rebels_desc: "#flavor Not all rebels are ambitious warlords who seek our throne. Those who just wish for a peaceful life of relative autonomy make up the bulk of our rebellious population. By negotiating and investing in solutions for their problems, we can potentially ease their rebellious natures.#!\n\n[actor.GetName] reduce the progress of one [rebel|e] faction by #G -30.00%#!"
 etra_rtr_negotiate_with_rebels_select_rebels: "Select Rebel Faction"
 etra_rtr_negotiate_with_rebels_no_rebels: "$no_valid_rebels$"
 etra_rtr_negotiate_with_rebels_tt: "The target [rebels|e] lose [ShowNamedValue('rebel_progress_severe_bonus')|+=2%] progress"
 etra_rtr_call_loyalists_to_arms: "Call Loyalists to Arms"
 etra_rtr_call_loyalists_to_arms_no_countries: "$no_valid_countries$"
 etra_rtr_demand_annexation_no_countries: "$no_valid_countries$"
 antagonism_peace_etra_rtr_demand_all_iborric_territories: "Demand All Iborric Territories"
 etra_rtr_call_loyalists_to_arms_desc: "#flavor The lands of [GetCountry('A378').GetName] burn as marauding warlords soak the soil in blood. We must call on all who still swear loyalty to the Golden Bull Throne and the [GetInternationalOrganizationType('iboric_mandate').GetName] to take up arms!#!\n\nThe selected [ShowGovernmentReformName('etra_warring_state')] country which is #G loyal#! (equal or more than [ShowNamedValue('ETRA_RTR_IS_LOYAL_VALUE')|+=2] $etra_rtr_iborros_allegiance$) towards [actor.GetName] will join [ShowCasusBelliName('cb_etra_red_turban_rebellions')] wars on our side."
 etra_rtr_call_loyalists_to_arms_tt: "Every member of the [GetInternationalOrganizationType('etra_red_turban_rebels').GetName] is currently at war with [actor.GetName]"
 etra_rtr_call_loyalists_to_arms_select_country: "Select Loyalist of [GetCountry('A378').GetNameWithNoTooltip]"
 etra_rtr_call_loyalists_to_arms_ct: "The loyalist joins every active [ShowCasusBelliName('cb_etra_red_turban_rebellions')] [war|e] on the side of [actor.GetName] against the members of [GetInternationalOrganizationType('etra_red_turban_rebels').GetName]"
 etra_rtr_call_loyalists_to_arms_at: "The loyalist loses #R 5#! $etra_rtr_iborros_allegiance$"
 etra_rtr_appease_the_court: "Appease the Court"
 etra_rtr_appease_the_court_desc: "#flavor While the countryside is in open revolt, malicious factions within our very court seek the support of the warlords. Appeasing them might grant us their much-needed loyalty in these trying times...#!\n"
 etra_rtr_rekindle_revolt: "Rekindle the Revolt"
 etra_rtr_rekindle_revolt_desc: "#flavor Although we have forged a truce with our tyrannical former overlords, our ambition yearns to fight for the liberation of the [ShowCultureGroupName('iborian_group')] once again!#!\n"
 etra_rtr_rein_in_area: "Rein in Area"
 etra_rtr_rein_in_area_desc: "#flavor [ShowRegionName('iboros_region')] is densely settled land. By reining in areas we conquer from our enemies, we can secure the loyalty of the locals and ensure their support in these harrowing times of rebellion.#!\n\n[actor.GetName] adds the [ShowModifier('etra_rtr_rein_in_area_modifier')] to a conquered [area|e], and its locations become [integrated|e]."
 etra_rtr_rein_in_area_select_area_title: "Select Area to Rein In"
 etra_rtr_rein_in_area_no_areas: "@trigger_no! No valid [areas|e] available which have non-[core|e] [locations|e] and do not have the [ShowModifier('etra_rtr_rein_in_area_modifier')] [modifier|e] active."
 etra_rtr_rein_in_area_tt: "Every [location|e] becomes [integrated|e] and receives the [ShowModifier('etra_rtr_rein_in_area_modifier')] [modifier|e] for #Y 10#! years"
 etra_rtr_rein_in_area_at: "Every [location|e] in the target [area|e] becomes [integrated|e] and receives the [ShowModifier('etra_rtr_rein_in_area_modifier')] [modifier|e] for #Y 10#! years"
 etra_rtr_declare_war_for_regional_supremacy: "Declare War for Regional Supremacy"
 etra_rtr_declare_war_for_regional_supremacy_desc: "#flavor The [ShowSituationName('etra_red_turban_rebellions')] is not only a revolt against the oppressive current dynasty, but also a power struggle for the Golden Bull Throne itself. We must not allow any pretender to amass enough power to claim the [GetInternationalOrganizationType('iboric_mandate').GetName] for themselves!#!\n\n[actor.GetName] declares [ShowCasusBelliName('cb_etra_red_turban_rebellions_against_other_rebels')] against the target [country|e]."
 etra_rtr_declare_war_for_regional_supremacy_select_title: "Select [ShowGovernmentReformNameWithNoTooltip('etra_warring_state')]"
 etra_rtr_declare_war_for_regional_supremacy_no_countries: "@trigger_no! No valid [ShowGovernmentReformNameWithNoTooltip('etra_warring_state')] available that is not our [ally|e] nor [subject|e] and does NOT have a [truce|e] with us."
 etra_rtr_support_faction: "Support Faction"
 etra_rtr_support_faction_desc: "#flavor The lands of [GetCountry('A378').GetName] are burning under the onslaught of rebels who have risen up against their [GetCountry('A378').GetCulture.GetName] overlord. Our contributions could tip the balance in favor of either side.#!\n\nTransfer #Y 1 year#! worth of [gold|e] to a target country of the [ShowSituationName('etra_red_turban_rebellions')] in exchange for [ShowBiasValue('opinion_rtr_supported_side')|+=0] [opinion|e]"
 etra_rtr_declare_independence: "Declare Independence"
 etra_rtr_declare_independence_desc: "#flavor The [GetCountry('A378').GetLongName] is facing one of the most severe crises it has ever known. While a tragedy for [GetCountry('A378').GetGovernment.GetRulerOrRegent.GetName], it is an excellent opportunity for us to break the shackles binding us to the [GetCountry('A378').GetCulture.GetName] overlord.#!"
 etra_rtr_join_iborric_defense: "Join [GetCountry('A378').GetAdjectiveWithNoTooltip] Defense"
 etra_rtr_join_iborric_defense_desc: "#flavor Although the [ShowSituationName('etra_red_turban_rebellions')] might be an opportunity for us to break away from the [GetCountry('A378').GetLongName], it is their strength and our diplomatic bond which protects us from foreign threats. As such, we should aim to support the [GetCountry('A378').GetFlavorRank] in crushing the rebellions.#!"
 hint_etra_red_turban_rebellions: "Red Brotherhood Rebellions"
 hint_etra_red_turban_rebellions_hint_text: "$hint_etra_red_turban_rebellions_hint_text_1$\n\n$hint_etra_red_turban_rebellions_hint_text_2$\n\n$hint_etra_red_turban_rebellions_hint_text_3$"
 hint_etra_red_turban_rebellions_hint_text_1: "The [ShowSituationName('etra_red_turban_rebellions')] have broken out across the whole of [ShowRegionName('iboros_region')]! [GetCountry('A378').GetName] has lost the favor of the Mandate, and instability now rules their [GetCountry('A378').GetFlavorRank]!"
 hint_etra_red_turban_rebellions_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! [GetCountry('A378').GetName] must look to force [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] upon those who seek to break away from their rule.\n@arrow_bonus_tier_2! The [GetInternationalOrganizationType('etra_red_turban_rebels').GetName] can [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] against [GetCountry('A378').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! The [GetCountry('A378').GetLongName] will suffer many unique [events_with_icon|e] as their land is usurped by prospecting conquerors."
 hint_etra_red_turban_rebellions_hint_text_3: "#T Extra Hints:#!\n@hint! We may utilize many unique [actions_with_icon|e] in the [situation_with_icon|e] panel to help [integrate_with_icon|e] conquests and maintain high [control_with_icon|e].\n@hint! If we win the situation and restore the [GetInternationalOrganizationType('iboric_mandate').GetName], we will secure [cores|e] across [ShowRegionName('iboros_region')]."
 hint_etra_red_turban_rebellions_diplomatic: "\"Unending warfare leaves little room for idle talk and diplomacy...\""
 hint_etra_red_turban_rebellions_administrative: "\"It would be wise to properly utilize the actions of the situation. They are valuable tools that will help us emerge victorious.\""
 hint_etra_red_turban_rebellions_military: "\"Now all of [ShowRegionName('iboros_region')] knows we are here!\""
 etra_red_turban_rebels: "Red Brotherhood Rebels"
 etra_red_turban_rebels_desc: "A coalition of rebellious warlords fighting to overthrow Iborric imperial rule."
 etra_warring_state: "Warring State"
 etra_warring_state_desc: "A breakaway polity of the fractured Iborric Empire, focused on military expansion over administration."
 STATIC_MODIFIER_NAME_etra_rtr_red_turban_rebellions: "Red Brotherhood Rebellions"
 STATIC_MODIFIER_DESC_etra_rtr_red_turban_rebellions: "Due to open rebellion, the once-respected holder of the [GetInternationalOrganizationType('iboric_mandate').GetName] struggles to raise levies from the wider population."
 opinion_etra_rtr_red_turban_rebellions: "Red Brotherhood Rebellions"
 cb_etra_red_turban_rebellions: "Red Brotherhood Rebellions"
 cb_etra_red_turban_rebellions_rein_in_rebels: "Rein in Rebels"
 cb_etra_red_turban_rebellions_against_other_rebels: "War for Regional Supremacy"
 etra_red_turban_rebellions_WAR_NAME: "$ORDER$A378 War for the Mandate"
 etra_red_turban_rebellions_AGAINST_OTHER_REBELS_WAR_NAME: "$ORDER$War for Regional Supremacy"
 unlocked_etra_warring_state: "$etra_warring_state$ unlocked"

 # Peace treaties
 etra_rtr_rein_in_rebellion: "Rein in Rebellion"
 etra_rtr_rein_in_rebellion_entry: "$etra_rtr_rein_in_rebellion$"
 etra_rtr_rein_in_rebellion_entry_short: "$etra_rtr_rein_in_rebellion$"
 etra_rtr_rein_in_rebellion_desc: "Rein in the rebels and force them to swear allegiance to us once again!"
 etra_rtr_rein_in_rebellion_tt: "Rebels which are #G loyal#! (equal or more than [ShowNamedValue('ETRA_RTR_IS_LOYAL_VALUE')|+=2] $etra_rtr_iborros_allegiance$) towards us at the end of the [ShowSituationName('etra_red_turban_rebellions')] will be automatically annexed by us"
 etra_rtr_demand_occupied_territories: "Demand Occupied Territories"
 etra_rtr_demand_occupied_territories_entry: "$etra_rtr_demand_occupied_territories$"
 etra_rtr_demand_occupied_territories_entry_short: "$etra_rtr_demand_occupied_territories$"
 etra_rtr_demand_occupied_territories_desc: "Demand all [occupied|e] locations from the target [country|e]."
 etra_rtr_demand_occupied_territories_tt: "Every [loser.GetAdjective] [location|e] occupied by [winner.GetName] gets seized by [winner.GetNameWithNoTooltip]"
 etra_rtr_demand_occupied_territories_no_winner_loser_tt: "Any [location|e] the winner occupies from the loser is seized."
 etra_rtr_demand_all_iborric_territories: "Demand All Iborric Territories"
 etra_rtr_demand_all_iborric_territories_entry: "$etra_rtr_demand_all_iborric_territories$"
 etra_rtr_demand_all_iborric_territories_entry_short: "$etra_rtr_demand_all_iborric_territories$"
 etra_rtr_demand_all_iborric_territories_desc: "Demand every [location|e] owned by the target [country|e] and their [subjects|e], including unoccupied territories."
 etra_rtr_demand_all_iborric_territories_tt: "Every [loser.GetAdjective] [location|e], and every [location|e] owned by [loser.GetName]'s [subjects|e], is seized by [winner.GetNameWithNoTooltip]"
 etra_rtr_demand_complete_annexation: "Demand Complete Annexation"
 etra_rtr_demand_complete_annexation_entry: "$etra_rtr_demand_complete_annexation$"
 etra_rtr_demand_complete_annexation_entry_short: "$etra_rtr_demand_complete_annexation$"
 etra_rtr_demand_complete_annexation_desc: "Only under one banner can Iboros return to peace! Fully annexes the target [country|e] and integrates all their territories, no occupation required."

