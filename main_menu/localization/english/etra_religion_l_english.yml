l_english:

 adunan: "Edorrinic Faiths"   
 adunan_ADJ: "Edorrinic Faiths"  
 adunan_desc: ""
 imperial_creeds: "Imperial Creeds"
 imperial_creeds_desc: "The Imperial Creeds encompass the myriad faiths practiced by the undying Morans and the living converts drawn into their shadow. Within this vast and swollen umbrella lie innumerable mystery cults, philosophical schools, quasi-atheistic denials, worship of gods no mortal tongue has named, statolatrous devotion to the state. No matter the divergences, what binds these disparate faiths are the central questions which they seek to answer and which haunts them endlessly: Why and how did the Day of Apokatastasis happen? What truly was the Undying Emperor, and what judgment rendered onto that being? And most crucially: what must be done now? How should they live their eternal lives? And lastly: What awaits them when the end of infinity is discovered?\nAt the core of all these Creeds is the unshakable conviction that the Moranium Imperium is the axis upon which reality turns. Their will is the mechanism through which the Cosmo’s will is set into motion. Woe to those who would dare question their place in creation.\nAdherents swear that the Creeds reach back to the origination of time, when the One became the Many, and were bestowed from The Parents to The Children across a hitherto unbroken chain. This culminating in the closest humanity has reached to The Truth at the height of the Moranium Imperium. Outside scholars, however, argue that the Creeds are an echo. And it truly originated either on the Day of Apokatastasis or in its aftermath. Saying that the Creeds were fashioned into being from the scraps, ruins and fragmented memories of the dead."
 imperial_creeds_ADJ: "Imperial Creeds"
 
 manyfold: "The Eternal Truth"
 manyfold_desc: "The Eternal Truth is the dominant faith among the peoples of Edorinn. It is simulationsly polytheistic and monotheistic, as the central doctrine of the faith is that all gods are but persons of a single God. This paradox, the unity of one-and-many, has been the central mystery of the faith since its inception. Church Ancestors, philosophers, and mystics have debated it for generations, seeking to grasp the nature of that which can never be fully known.\n\nClergy teach the unity of the pantheon, the equal divinity and shared natures of each god, and the intricate relationships that bind them. Beneath the many-and-the-one, stand countless saints, angels, and other divine beings who tend to the workings of the world and mortals. Though the faith has been gravely weakened by the Day, it has maintained its hold over Edorrin through the patronage of the Holy Commonweal. Once merely one of many Adunic faiths many years ago, but with the support of secular powers it arose to become the singular central religious authority in Edorinn. It's rulings taken as final in matters of doctrine. Yet in elevating their orginal patron as the All-Being, the faith confronted an irony: As this divinity became the everything, it simultaneously became the nothing."
 manyfold_ADJ: "Eternalist"

 spider_cult_religion: "Ebony Web"
 spider_cult_religion_ADJ: "Webspinner"
 spider_cult_religion_desc: "The Spider-Faced One, as some clergy name Her, represents the most controversial interpretation of the Eternalist's god to emerge from the depths of Erebum in recent centuries. Where orthodox Eternalism speaks of god's many persons, the adherents of the Ebony Web insist on a literal truth: that god, in Her truest and most perfect form, is female, eight-limbed, and weaves the threads of fate with patient, predatory intelligence.\n\nThe faith arose roughly seventy years ago through the teachings of a wandering prophet. She only called herself an elven women, daughter of an elven women, and a mother of an elven women. Her sermons in the deep-vault temples of Erebum's shadowed cities spoke of a vision: the All-Being as the Great Weaver, whose web connects all things, whose patience spans centuries, whose hunger is as sacred as Her creativity. The sect has seen broken off with the wider Eternalist faith, and was sponsored by the secular commonwealth of Erebus."
 green_pact_religion: "Green Pact"
 green_pact_religion_ADJ: "Green Pactist"
 green_pact_religion_desc: "The Green Pact is a living covenant kept by frontier folk who treat wood, water, beast, and soil as partners rather than spoils. Its keepers teach that the Day tore open older bargains with the land, and that only renewed oaths under open canopy can hold hunger, storm, and settlement in balance.\n\nPactists raise no universal scripture. Local groves, hunt-stones, and seasonal rites carry the faith, and Eternalist clergy often dismiss them as rustic superstition. Where the Pact holds, logging is rationed by vow, raiding outsiders is framed as defense of the living border, and wild oaths bind wardens more tightly than city law."

 maw_of_ur_khal: "The Maw of Ur-Khal"
 maw_of_ur_khal_ADJ: "Mawite"
 maw_of_ur_khal_desc: "The Maw of Ur-Khal is a rough old faith kept in the highland holds around Borili and the darker roads of Oðrngorl. Its keepers teach that Ur-Khal was the first giant to hear the earth speak. When the Day of Apokatastasis cracked the world, he opened his jaws at the root of the mountains and swallowed a portion of the ruin, becoming not a god but a gate between hunger and mercy.\n\nThe sacred Maw is the absence he left behind. Followers feed it black bread, iron filings, broken teeth, the names of dead enemies, and oaths too heavy for ordinary shrines. They believe all stone, ore, water, fortresses, and bodies are borrowed from the deep earth and must one day be returned. Eternalist priests condemn the rites as a cannibal superstition, but Oðrngorl's rulers tolerate the cult among Borili Giantsborn and Mavisan highlanders because its vows bind miners, wardens, and border fighters to their halls. Mawites rarely seek converts; they say the Maw calls only those who have heard stone breathe."
 
 tajjev_rites: "Tajjevi Rites"
 tajjev_rites_ADJ: "Tajjevi Ritualist"
 tajjev_rites_desc: "Long separated from the greater Eternalist faith, the spiritual practices of the Tajjevi peoples have drifted far from mainstream doctrine."
 
 folk_adunan: "Folk Edorrinic"
 folk_adunan_ADJ: "Folk Edorrinic"
 folk_adunan_desc: "The distinction between Edorrinic and Folk Adunan faiths originates in the Greater-Moran empire and its cultural sphere. Edorrinic faiths share a common scriptural foundation - the largely the same recongized holy texts, recognized and debated across their various traditions. Folk Adunan faiths claim no such canon. The term encompasses a broad range of beliefs: local traditions centered on regional spirits or deities, and the various racial-religious practices that have developed among Etra's many kindreds."

 the_forgotten_ones: "The Forgotten Ones"
 the_forgotten_ones_ADJ: "Forgotten"
 the_forgotten_ones_desc: "The Forgotten Ones are the buried, nameless, and half-remembered powers worshipped where older roads run beneath newer kingdoms. Their faiths rarely share scripture or priesthood, but they agree that some gods were not slain, disproven, or absorbed into cleaner pantheons. They were sealed away, swallowed by the earth, or made unspeakable by those who inherited the surface world."
 
 faith_saurethii: "Pyrrhakic"
 faith_saurethii_ADJ: "Pyrrhakic"
 faith_saurethii_desc: "The tall grass whipsers one name. Above the spirits of wind and grass and buried dead, there is one true god, Pyrrhakos. Other powers exist, the Saurethii do not deny it, but they are lesser things, worthy of neither sacrifice nor praise. Pyrrhakos alone commands the sky above and the steppe below.\n\nFor the faithful hold this: that the ancestors are not gone. They ride still, just beyond the horizon of the living world, and they are riding closer. When Pyrrhakos's promise is fulfilled, when the Elves are united, when the old rites are honored, when the living and dead are no longer strangers to one another, the boundary will collapse, and the ancestors will return to ride alongside their children."
