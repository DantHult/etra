l_english:

 creed_of_the_undying_axis: "Creed of the Undying Axis"
 creed_of_the_undying_axis_desc: "Hold that the Moranium Imperium remains the hinge of creation, and that eternal life is a duty owed to the Cosmo's will."
 creed_of_apokatastasis_memory: "Memory of Apokatastasis"
 creed_of_apokatastasis_memory_desc: "Treat the Day as the central mystery. Study its fragments, preserve its scars, and judge every doctrine by how it answers the Undying Emperor."

 doctrine_of_the_many_and_one: "Doctrine of the Many-and-One"
 doctrine_of_the_many_and_one_desc: "Teach that every god is a person of a single God, and that orthodoxy is the careful mapping of those persons rather than their denial."
 commonweal_patronage_canon: "Commonweal Patronage Canon"
 commonweal_patronage_canon_desc: "Lean on the Holy Commonweal's rulings as final in doctrine, binding clergy and princes to one public canon."

 rite_of_the_bound_sword: "Rite of the Bound Sword"
 rite_of_the_bound_sword_desc: "Bind war-oaths to Tajjevi liturgy so that conquest and conversion march under the same flame."
 rite_of_the_separated_flame: "Rite of the Separated Flame"
 rite_of_the_separated_flame_desc: "Affirm the Tajjevi break from Eternalist authority while still claiming the old fire as rightful inheritance."

 aspect_of_the_great_weaver: "Aspect of the Great Weaver"
 aspect_of_the_great_weaver_desc: "Name god as the Spider-Faced Weaver whose web joins fate, hunger, and craft across Erebum's vaults."
 aspect_of_patient_hunger: "Aspect of Patient Hunger"
 aspect_of_patient_hunger_desc: "Honor patience as sacred predation: wait, bind, and strike when the thread is ready."

 pact_of_living_wood: "Pact of Living Wood"
 pact_of_living_wood_desc: "Keep the Green Pact by treating forest, field, and beast as covenant partners rather than mere resources."
 pact_of_wild_oaths: "Pact of Wild Oaths"
 pact_of_wild_oaths_desc: "Swear frontier vows beneath open canopy, binding hunters and wardens to the living land."

 vow_of_the_open_maw: "Vow of the Open Maw"
 vow_of_the_open_maw_desc: "Feed the Maw with iron, names, and heavy oaths, accepting hunger as the gate between ruin and mercy."
 vow_of_returned_stone: "Vow of Returned Stone"
 vow_of_returned_stone_desc: "Teach that ore, fortress, and body are borrowed from the deep earth and must one day be given back."

 aspect_of_pyrrhakos_sky: "Aspect of Pyrrhakos"
 aspect_of_pyrrhakos_sky_desc: "Raise Pyrrhakos alone above wind, grass, and lesser spirits as the true god of sky and steppe."
 aspect_of_returning_ancestors: "Aspect of Returning Ancestors"
 aspect_of_returning_ancestors_desc: "Ride toward the horizon where the dead still ride, keeping rites that promise their return beside the living."
