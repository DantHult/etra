 takkev_clan_law: "Clan Law"
 takkev_clan_law_desc: "The highland clans of Takkev still judge water, pasture, and blood among themselves. How the crown treats that authority decides whether the tribes carry the realm or stand against it."
 takkev_reliance_on_local_tribes: "Reliance on Local Tribes"
 takkev_reliance_on_local_tribes_desc: "Local chiefs keep their people, their herds, and the paths between highland valleys. Recognize them, and their riders and headmen extend the reach of the crown through the land."
 takkev_refuse_recognition: "Refuse Recognition"
 takkev_refuse_recognition_desc: "The clans have claimed a say in local affairs for too long. Refuse them that seniority, and the crown's right to rule stands clearer, even if the tribes grow bitter."
 takkev_highland_council: "Highland Council"
 takkev_highland_council_desc: "Highland assemblies of household heads meet to settle water rights, the movement of herds, and the blood money owed between clans. What the council decides binds those who sat in it, and spares the crown a feud in every valley."
 takkev_veiled_cavalry: "Veiled Cavalry"
 takkev_veiled_cavalry_desc: "Unlocks Veiled Highland Cavalry for the highlanders of Takkev."
 a_takkev_veiled_cavalry: "Veiled Highland Cavalry"
 a_takkev_veiled_cavalry_desc: "Highland cavalry who ride veiled against sun, sand, and recognition. They fight harder than other Tajjevi cavalry in desert and hills, and they keep the same weakness on the coast."
