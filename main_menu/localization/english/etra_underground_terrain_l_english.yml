l_english:
 subterranean: "Subterranean"
 subterranean_desc: "Subterranean represents areas beneath the surface, where there is no natural sunlight, extreme cold or heat depending on depth, and a permanent absence of seasons."
 caverns: "Vast Caverns"
 caverns_desc: "Vast Caverns represents terrain vast underground chambers formed by either geological processes or other means. They offer more open space than narrow tunnels but still present extreme challenges for [armies|e] to maneuver and supply, and for any form of development beyond what can be sustained without natural light or surface resources."
 cave_fungus: "Underground Fauna"
 cave_fungus_desc: "These are subterranean areas where fungal growth and other lightless flora have colonized the rock and soil, providing some organic resources but creating a difficult and often hazardous environment for [armies|e] to operate in and nearly impossible conditions for conventional [building|e] development."