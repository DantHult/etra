l_english:
 # Regiment
 a_legionary: "Legionarii Skeletici"
 a_legionary_desc: "The professional heavy infantryman remains the cornerstone of the Moran war machine. These veterans were honored, retired, and laid to rest; their deeds praised long after they were safely dead and buried. Now the living must face them again. They re-enlist not out of duty or devotion, but because un-death offers few alternatives. Undead, eternal, and tireless.\n\nAlmost nothing has changed: The centurion's bark, the optio's whip, the daily call to muster, trench-digging, monotonous drills, all of it followed them into the grave. Once, they shattered tribes whose names have long since been forgotten. Now they carve down crusading heroes and rival Morans. It makes no difference. They no longer fight for the state, for glory, for gods, for honor, for comrades, or even for themselves. They fight because it is the only thing they have ever known. And so they march on in perfect lockstep, skeletal fingers wrapped around finely-crafted steel."
 
 a_undead_age_1_base: "Undead Base"
 a_undead_age_1_base_desc: "This is the base template used for Undead units, and shouldnt be seeing this, if you are seeing this please report the bug"
 a_legionary_levy: "$a_legionary$"
 a_legionary_levy_desc: "$a_legionary_desc$"
 
 a_ynarheimian: "Ynarheimian Custodes"
 a_ynarheimian_desc: "The memory of cold steel sliding between the ribs comes back, a flare of heat through the cold dead. Nothing instills a healthy paranoia quite like being stabbed in the back by one's closest friends, champions, bodyguards and, more often than one might suppose, the cooks. For this reason several patricians have continued the ancient practice of hiring their personal bodyguards from foreign stock: outsiders to Moran, untangled from its loyalties and intrigues, and faithful for it.\n\nNone are more prized than the Ynarheimian Custodes. Descendants of giants, seventh sons of seventh sons, destined at home for meagre scraps, the Goliaths set forth from their lands of frost and horror to earn their keep in the lands of the dead. For their ,often times, thuggish loyalty, great accolades and fabulous wealth have been heaped upon them. Against foes living and dead, they have earned every coin: hulking towers of muscle and finely-forged steel, wielding axes the size of men."
 
 a_ardrainien_sword_maiden: "Sword Maidens"
 a_ardrainien_sword_maiden_desc: "Elite heavy infantry of the Sisterhood of the Sword Maiden, armored in plate and sworn to the virtues of the Codes of Lumière and the Good. Each regiment carries a white banner into battle."

 a_bone_legion_age_1: "Bone Titan"
 a_bone_legion_age_1_desc: "Skeletal giants from the ruin of many, each Titan the ultimate representation of empire. When their usefulness expired, these soldiers were tipped into unmarked pits, perpetrators and victims of the same machine, indistinguishable in the ground. When The Day came, most Morans were restored. And from the mass graves rose the first Bone Titans: ribcages interlocked into barrel chests, fused spines, extra arms and scythe-blades sprouting from each shoulder.\n\nInside each is the storm. A wedding never had, the exact angle of a sword going in, a name called from somewhere behind. The memories tide through them, and they move with the unnatural certainty of a hundred dying men remembering at once how to fight. Silent until commanded, they wait beneath necropolises and old battlefields for the only thing left to them."
 
 a_triarii_levy: "Most Exalted Triarii"
 a_triarii_levy_desc: "Horses, and most other other mammals, grow anxious and panicked in the presence of an undead Moran. Every breeding program for a mount capable of bearing an undead rider has ended in failure. Thus, unlike in the mortal world the nobility of the Moranium Imperium march to war as their great forefaters once did: on foot, armored and disciplined, as heavy infantry bearing the name of those old units."
 
 a_accensi_levy: "Accensi Levies"
 a_accensi_levy_desc: "Drawn from the lowest strata of society, those individuals whose civic contributions are designated ‘non-critical,’ the Accensi constitute the most expendable regiments of the Empire. Lightly and barely armed, they are deployed as screens, casualty absorptive formations, or diversionary assets, thus enabling the true Legions advance unimpeded."
 
 a_moran_men_at_arms: "Reformed Legionarii Skeletici"
 a_moran_men_at_arms_desc: "There are no veterans of the Crusades. There are only the men who fought them and are still fighting. The Reformed Legions are not new soldiers. They are the same soldiers, the same skulls, the same century-old grudges over which centurion got which billet at Three Oaks. What changed is the steel they wear and the cadence they answer to.\n\nA soldier who has served two centuries does not enjoy being told everything he knew was wrong. He learns it anyway. He learned it at Moras, with crusader swords ringing on the gate, and he carries the lesson now in finer steel and tighter ranks. The officers giving him his new orders are sometimes men who served beneath him in the recent or distant past. He takes the orders. He has nothing else to do."
 
 a_moran_crossbowmen: "Arbalestarii"
 a_moran_crossbowmen_desc: "Moran never loved the bow. Living Morans favored the gladius and the pilum, and the sagittarii drew their numbers from the auxiliaries, archers from the southern coasts, peoples whose names the Legion forgot before it learned them. The arbalest is a different proposition. It descends in silhouette and in spirit from the manuballista, an engine the Empire knew in its living centuries, and a soldier who once cranked one will recognize the bolt-groove, the deliberate pace, the patient draw. It is not a foreign weapon. It is an old friend returned in a new shape.\n\nThe Arbalestarii care nothing for rate of fire. The complaint of every living crossbowman, that he winds while the archer empties his quiver, is no complaint at all to a soldier with no schedule and no breath. He winds. He looses. He winds again."
 
 a_moran_handgonners: "Bombardarii"
 a_moran_handgonners_desc: "The first Moran to carry powder was not a soldier. He was a curiosity, attached to a Marshal's siege train and watched with the suspicion that strange things attract in old armies. The Empire had taken cities for two centuries with the ram, the tower, the patient mine. The hand-bombard was loud, it was filthy, it killed a third of the men who fired it during the first decade. The traditionalists made their case.\n\nThey lost. The smoke obscures formations. The noise unmans living horses. And a Bombardarius standing in his own white cloud reloads at the cadence of any other drill. The Empire learned what powder was for before it learned to make it well."
 
