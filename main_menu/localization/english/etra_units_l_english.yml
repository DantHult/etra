 a_moran_arquebusiers: "Arcubusierii"
 a_moran_arquebusiers_desc: "The arquebus is the first weapon in the Eternal Empire's arsenal that no living Moran ever held. The pilum and gladius they learned in breath. The plate and halberd were strange but adjacent, heavier iron, longer hafts, the same body remembered in different proportions. The gun has no ancestor.\n\nYet, they are very good at it. The arquebus rewards patience, indifference to fear, willingness to stand in rank while the man beside you is unmade and to fire on the same beat regardless. The living arquebusier is a man performing fine motor work in smoke and noise; he flinches, he fumbles, he breaks. The Moran arquebusier loads at the same cadence under cavalry charge as in the parade yard. He does not flinch because he cannot. He does not fumble because he has done this ten thousand times. He breaks only when his bones do."
 
 a_moran_pikemen: "Phalangarii"
 a_moran_pikemen_desc: "The pike is not a Moran weapon. The legions broke phalanxes at Aenind and Boxice and a dozen lesser fields, and the men who broke them are still in service. Some of them now carry the pike. The veteran who shattered a square in his first life draws it eighteen feet long in his fourth, and if the irony troubles him he does not say so. The wars after Moras settled the argument: a line of arquebusiers cannot fend off horse, and the halberd has reach enough for the press but not for the charge. The Empire has taken up the weapon its grandfathers had spent generations defeating. Its grandfathers, in many cases, were the ones who took it up.\n\nThe Phalangarii drill in blocks of remarkable depth, deeper than any living army would attempt, because the rear ranks of a living block are wasted weight and the rear ranks of a Moran block are not. A pike that cannot be lowered in time can still be braced against the dead man behind you. Every rank fights. Every rank holds. The block does not waver because there is nothing in it to waver."
 
