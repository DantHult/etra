 levy_sorlkol_warrior_monk: "Garrison Monk Levy"
 levy_sorlkol_warrior_monk_desc: "Warrior-monks called from Academy fortresses to defend the confederation."

 a_sorlkol_warrior_monk: "Warrior Monks"
 a_sorlkol_warrior_monk_desc: "Professional monk-soldiers trained to defend Academy fortresses, combining religious conviction with systematic drill in polearm and formation fighting."
 a_sorlkol_lynx_goat_riders: "Lynx-Goat Riders"
 a_sorlkol_lynx_goat_riders_desc: "Select Academies maintain cavalry mounted on lynx-goats, carnivorous hybrid beasts combining feline predatory instincts with caprine sure-footedness, capable of navigating sheer cliffs and narrow passes where horses would stumble."

 a_takkev_cavalry: "Tajjevi Cavalry"
 a_takkev_cavalry_desc: "Light cavalry of the Tajjevi highlanders, raised for the arid hills and desert marches of Takkev. Swift on short remounts and hardened by highland forage, they raid, screen, and pursue rather than shatter ranks in a single charge."

 a_pwasciards_marines: "Marins de Guerre"
 a_pwasciards_marines_desc: "Infantry raised from sailors and dockworkers who have traded the deck for the field. Trained for amphibious landings and fighting in the wetlands and shores of the peninsula, they bring discipline and sea-hardened morale to the line."

 n_pwasciards_peninsula_galley: "Tideblades"
 n_pwasciards_peninsula_galley_desc: "Galleys built in Pwasciards ports for coastal dominance and escort duty. With a larger crew and improved speed for their class, they embody the Pwasiard's early naval pride and tactical doctrine."

 n_a412_barge_throne: "Barge-Throne"
 n_a412_barge_throne_desc: "A monster-towed pleasure barge stolen into war. Unique to the Taken Fleet: combat soul and story throne of the Imperator of the Deep. Ordinary navy loss applies; no recoverable barge-loss arc ships in Essential."

 a_ratfolk_warren_guard: "Warren Guard"
 a_ratfolk_warren_guard_desc: "Elite ratfolk infantry raised from the deepest warrens, trained to hold tunnels and fortified burrows. They fight in tight formations with spear and buckler, bred for endurance and stubborn defense in confined spaces."
 a_ratfolk_tunnel_runner: "Tunnel Runners"
 a_ratfolk_tunnel_runner_desc: "Light ratfolk infantry that use the undermarket network to outflank and raid. Fast and hardy, they excel in hills and broken terrain where their knowledge of hidden paths and narrow defiles gives them the edge."
 a_ratfolk_handgonners: "Rattokar's Thunderers"
 a_ratfolk_handgonners_desc: "Ratfolk infantry armed with handgonnes—short, heavy firearms that throw lead and smoke in confined spaces. Trained to fire in rotating ranks from tunnel mouths and hill positions, they shatter enemy formations before the warren guard closes with spear and buckler."
 a_ratfolk_plague_corps: "Plague Corps"
 a_ratfolk_plague_corps_desc: "Veteran ratfolk regiments who have survived pestilence and siege. Their resilience to disease and willingness to fight in contaminated ground make them feared in prolonged campaigns and garrison duty."

 # Vermen culture-group army line (parallel to vanilla infantry/cavalry)
 a_ratfolk_footmen: "Vermen Footmen"
 a_ratfolk_footmen_desc: "Professional heavy infantry of the warrens, packed into dense companies that make up in headcount what they lack in stature. Individually they break more easily than a human shield-wall; together they fill the field."
 a_ratfolk_archers: "Vermen Archers"
 a_ratfolk_archers_desc: "Light infantry bowmen raised in clusters from warren communities. Their arrows are many and their ranks deep, even when the shooting itself is unremarkable."
 a_ratfolk_footmen_levy: "Vermen Footmen Levy"
 a_ratfolk_footmen_levy_desc: "$a_ratfolk_footmen_desc$"
 a_ratfolk_feudal_levy: "Vermen Feudal Levy"
 a_ratfolk_feudal_levy_desc: "Peasant and laborer levies summoned under feudal obligation in Vermen lands. Brothers follow brothers; a litter-mate refuses to stay home."
 a_ratfolk_horsemen: "Vermen Horsemen"
 a_ratfolk_horsemen_desc: "Light cavalry of the Vermen kindred, and a poor bargain. Short riders slide in the saddle and cannot generate the leverage for a proper charge; they screen in numbers rather than harry a flank."
 a_ratfolk_armored_horsemen: "Vermen Armored Horsemen"
 a_ratfolk_armored_horsemen_desc: "Heavily armored Vermen cavalry, as much as the kindred can manage. The harness is too much for the rider and the rider too little for the horse. They are kept because a court without cavalry looks poor."

 a_ratfolk_men_at_arms: "Vermen Men-at-Arms"
 a_ratfolk_men_at_arms_desc: "Renaissance-era Vermen heavy infantry in whatever plate and half-plate can be cut down to fit. Slow to dress ranks, numerous enough that the line still holds."
 a_ratfolk_crossbowmen: "Vermen Crossbowmen"
 a_ratfolk_crossbowmen_desc: "Vermen light infantry armed with crossbows, bridging warren archery and the gunpowder age. The bolts come in sheets."
 a_ratfolk_men_at_arms_levy: "Vermen Men-at-Arms Levy"
 a_ratfolk_men_at_arms_levy_desc: "$a_ratfolk_men_at_arms_desc$"
 a_ratfolk_peasant_levy: "Vermen Peasant Levy"
 a_ratfolk_peasant_levy_desc: "Mass levies of Vermen peasants and laborers called in wartime. The warrens empty in clusters, not files."
 a_ratfolk_cavalrymen: "Vermen Cavalrymen"
 a_ratfolk_cavalrymen_desc: "Improved light cavalry of the Vermen realms, which is to say they fall off the horse slightly less often. They still cannot turn a flank the way a human rider would."
 a_ratfolk_heavy_cavalrymen: "Vermen Heavy Cavalrymen"
 a_ratfolk_heavy_cavalrymen_desc: "Shock cavalry in heavier harness, a role Vermen riders were never built for. The charge starts in a crowd and dies when the mounts refuse the weight."

 a_ratfolk_early_arquebusiers: "Vermen Early Arquebusiers"
 a_ratfolk_early_arquebusiers_desc: "Matchlock arquebusiers trained in Vermen companies, still learning the rhythms of powder warfare. They make up for unsteady aim with rotating ranks."
 a_ratfolk_halberdiers: "Vermen Halberdiers"
 a_ratfolk_halberdiers_desc: "Heavy infantry with halberds, holding the line by packing more shafts into the same frontage than a human company could."
 a_ratfolk_matchlock_levy: "Vermen Matchlock Levy"
 a_ratfolk_matchlock_levy_desc: "Levy infantry issued matchlock firearms for massed volleys."
 a_ratfolk_light_lancers: "Vermen Light Lancers"
 a_ratfolk_light_lancers_desc: "Light lance cavalry in name. A Vermen lancer cannot keep the seat or the leverage; they poke, they crowd, they do not break a line."
 a_ratfolk_lancers: "Vermen Lancers"
 a_ratfolk_lancers_desc: "Heavy lancers of Discovery-era Vermen armies. The lance is too long for the rider and the charge too slow for the name."

 a_ratfolk_arquebusiers: "Vermen Arquebusiers"
 a_ratfolk_arquebusiers_desc: "Flintlock-era arquebusiers formed in dense Vermen shot companies. Smoke and numbers do the work that marksmanship does not."
 a_ratfolk_pikemen: "Vermen Pikemen"
 a_ratfolk_pikemen_desc: "Pike blocks that protect shot and absorb cavalry charges by presenting more pikes than the enemy expected to count."
 a_ratfolk_flintlock_levy: "Vermen Flintlock Levy"
 a_ratfolk_flintlock_levy_desc: "Levy infantry armed with flintlock muskets."
 a_ratfolk_pistoleers: "Vermen Pistoleers"
 a_ratfolk_pistoleers_desc: "Light cavalry armed with pistols, fighting in a ragged caracole. The horses are better than the riders, and neither is impressive."
 a_ratfolk_heavy_lancers: "Vermen Heavy Lancers"
 a_ratfolk_heavy_lancers_desc: "Reformation-era heavy lancers in refined plate that still sits badly on a short frame. They arrive late and hit softly."

 a_ratfolk_hunters: "Vermen Hunters"
 a_ratfolk_hunters_desc: "Light infantry riflemen skilled at crowding a skirmish line rather than picking individuals. Aimed fire is a luxury; volume is the doctrine."
 a_ratfolk_musketeers: "Vermen Musketeers"
 a_ratfolk_musketeers_desc: "Heavy musket infantry of the Absolutist age, drilled for linear tactics in companies that look oversized until the first volley thins them."
 a_ratfolk_militiamen: "Vermen Militiamen"
 a_ratfolk_militiamen_desc: "Local militia mustered with muskets for warren defense and emergency field service."
 a_ratfolk_hussars: "Vermen Hussars"
 a_ratfolk_hussars_desc: "Light cavalry in the hussar style, worn as costume more than calling. They raid in packs and flee the same way; they do not ride down a broken enemy."
 a_ratfolk_gallop_cavalry: "Vermen Gallop Cavalry"
 a_ratfolk_gallop_cavalry_desc: "Heavy cavalry trained for the gallop charge of late Absolutism. Training does not add a cubit to a rider's reach."

 a_ratfolk_sharpshooters: "Vermen Sharpshooters"
 a_ratfolk_sharpshooters_desc: "Riflemen selected for the densest fire, not the finest eye. Independent marksmanship is rarer than another loaded rank."
 a_ratfolk_fusiliers: "Vermen Fusiliers"
 a_ratfolk_fusiliers_desc: "Line infantry of the Revolutionary age, the final heavy foot of the Vermen progression: still small, still many."
 a_ratfolk_grenadiers: "Vermen Grenadiers"
 a_ratfolk_grenadiers_desc: "Assault infantry armed with grenades, chosen for nerve rather than stature. They close in a crowd and throw until the ground is fire."
 a_ratfolk_conscripts: "Vermen Conscripts"
 a_ratfolk_conscripts_desc: "Mass conscript levies raised under revolutionary manpower laws. The warrens have never had a shortage of names to put on a roll."
 a_ratfolk_light_dragoons: "Vermen Light Dragoons"
 a_ratfolk_light_dragoons_desc: "Mounted infantry and light horse of the late game. They dismount readily, which is fortunate, because they were never riders first."
 a_ratfolk_cuirassiers: "Vermen Cuirassiers"
 a_ratfolk_cuirassiers_desc: "Cuirass-armored heavy cavalry, the last word in a mounted tradition that never suited them. The breastplate is honest; the charge is not."
 
 n_tonvague_caravel: "Tonvague"
 n_tonvague_caravel_desc: "A special caravel invented by the master shipwrights of Daqueland. Its sleek hull and powerful sails set it apart from the average seafaring vessel, and it seems as if no one else is able to perfect its design."
 a330_steppe_horse_archers_construction: "Raptors Riders Construction"
 a330_steppe_horse_archers_maintenance: "Raptors Riders Maintenance"
 sorlkol_academy_fortress_upkeep: "Sorlkol Academy Fortress Upkeep"
 sorlkol_dairy_production: "Sorlkol Dairy"
 a_a330_steppe_horde: "Raptorback "
 a_a330_steppe_horde_desc: "An endless tide of young riders mounted on swift dromaeosaurs, armed with composite bows and long lances, clad in boiled leather and riding with the reckless confidence of those who have not yet learned to fear. They are the bulk of every Saurethii warband—individually fragile, collectively overwhelming, their mounts' hunting calls echoing across the plains like a summer storm."
  a_a330_steppe_horse_archers: "Three-Horn Trialed"
 a_a330_steppe_horse_archers_desc: "The armored veterans of our kindred, riders who have survived countless seasons in the saddle and know their mounts' every breath and stride. Clad in layered lamellar and riding battle-scarred ceratopsians whose horns bear notches for each enemy formation broken, these champions anchor the warband and steady younger riders when the line wavers."

 # Elven culture-group army line (parallel to vanilla infantry/cavalry)
 a_elven_footmen: "Elven Footmen"
 a_elven_footmen_desc: "Professional heavy infantry of the elven realms, drilled for decades in shield-wall and close order. Longevity makes veterans the rule rather than the exception."
 a_elven_archers: "Elven Archers"
 a_elven_archers_desc: "Light infantry bowmen raised from elven communities. Patient marksmanship and long practice give them a steady hand on the line."
 a_elven_footmen_levy: "Elven Footmen Levy"
 a_elven_footmen_levy_desc: "$a_elven_footmen_desc$"
 a_elven_feudal_levy: "Elven Feudal Levy"
 a_elven_feudal_levy_desc: "Peasant and laborer levies summoned under feudal obligation in elven lands."
 a_elven_horsemen: "Elven Horsemen"
 a_elven_horsemen_desc: "Light cavalry of the elven kindred, used to screen, pursue, and harry flanks."
 a_elven_armored_horsemen: "Elven Armored Horsemen"
 a_elven_armored_horsemen_desc: "Heavily armored elven cavalry, reserved for nobles and well-equipped retainers."

 a_elven_men_at_arms: "Elven Men-at-Arms"
 a_elven_men_at_arms_desc: "Renaissance-era elven heavy infantry in plate and half-plate, the backbone of standing armies."
 a_elven_crossbowmen: "Elven Crossbowmen"
 a_elven_crossbowmen_desc: "Elven light infantry armed with crossbows, bridging the warbow tradition and the gunpowder age."
 a_elven_handgonners: "Elven Handgonners"
 a_elven_handgonners_desc: "Early gunpowder infantry among the elves, slow to reload but devastating at close range."
 a_elven_men_at_arms_levy: "Elven Men-at-Arms Levy"
 a_elven_men_at_arms_levy_desc: "$a_elven_men_at_arms_desc$"
 a_elven_peasant_levy: "Elven Peasant Levy"
 a_elven_peasant_levy_desc: "Mass levies of elven peasants and laborers called in wartime."
 a_elven_cavalrymen: "Elven Cavalrymen"
 a_elven_cavalrymen_desc: "Improved light cavalry of the elven realms, faster and better drilled than earlier horsemen."
 a_elven_heavy_cavalrymen: "Elven Heavy Cavalrymen"
 a_elven_heavy_cavalrymen_desc: "Shock cavalry in heavier harness, the hammer of elven field armies."

 a_elven_early_arquebusiers: "Elven Early Arquebusiers"
 a_elven_early_arquebusiers_desc: "Matchlock arquebusiers trained in elven companies, still learning the rhythms of powder warfare."
 a_elven_halberdiers: "Elven Halberdiers"
 a_elven_halberdiers_desc: "Heavy infantry with halberds, holding the line against horse and foot alike."
 a_elven_matchlock_levy: "Elven Matchlock Levy"
 a_elven_matchlock_levy_desc: "Levy infantry issued matchlock firearms for massed volleys."
 a_elven_light_lancers: "Elven Light Lancers"
 a_elven_light_lancers_desc: "Light lance cavalry for pursuit and flanking maneuvers."
 a_elven_lancers: "Elven Lancers"
 a_elven_lancers_desc: "Heavy lancers delivering the decisive charge of Discovery-era elven armies."

 a_elven_arquebusiers: "Elven Arquebusiers"
 a_elven_arquebusiers_desc: "Flintlock-era arquebusiers formed in disciplined elven shot companies."
 a_elven_pikemen: "Elven Pikemen"
 a_elven_pikemen_desc: "Pike blocks that protect shot and break cavalry charges."
 a_elven_flintlock_levy: "Elven Flintlock Levy"
 a_elven_flintlock_levy_desc: "Levy infantry armed with flintlock muskets."
 a_elven_pistoleers: "Elven Pistoleers"
 a_elven_pistoleers_desc: "Light cavalry armed with pistols, fighting in caracole and pursuit."
 a_elven_heavy_lancers: "Elven Heavy Lancers"
 a_elven_heavy_lancers_desc: "Reformation-era heavy lancers in refined plate and longer spears."

 a_elven_hunters: "Elven Hunters"
 a_elven_hunters_desc: "Light infantry riflemen skilled at skirmishing and aimed fire."
 a_elven_musketeers: "Elven Musketeers"
 a_elven_musketeers_desc: "Heavy musket infantry of the Absolutist age, drilled for linear tactics."
 a_elven_militiamen: "Elven Militiamen"
 a_elven_militiamen_desc: "Local militia mustered with muskets for home defense and emergency field service."
 a_elven_hussars: "Elven Hussars"
 a_elven_hussars_desc: "Swift light cavalry in the hussar style, favored for raids and pursuit."
 a_elven_gallop_cavalry: "Elven Gallop Cavalry"
 a_elven_gallop_cavalry_desc: "Heavy cavalry trained for the gallop charge of late Absolutism."

 a_elven_sharpshooters: "Elven Sharpshooters"
 a_elven_sharpshooters_desc: "Elite riflemen selected for marksmanship and independent fire."
 a_elven_fusiliers: "Elven Fusiliers"
 a_elven_fusiliers_desc: "Line infantry of the Revolutionary age, the final heavy foot of the elven progression."
 a_elven_grenadiers: "Elven Grenadiers"
 a_elven_grenadiers_desc: "Assault infantry armed with grenades, chosen for stature and nerve."
 a_elven_conscripts: "Elven Conscripts"
 a_elven_conscripts_desc: "Mass conscript levies raised under revolutionary manpower laws."
 a_elven_light_dragoons: "Elven Light Dragoons"
 a_elven_light_dragoons_desc: "Mounted infantry and light horse of the late game, flexible on campaign."
 a_elven_cuirassiers: "Elven Cuirassiers"
 a_elven_cuirassiers_desc: "Cuirass-armored heavy cavalry, the last word in elven mounted shock."

 # Giantsborn culture-group army line (parallel to vanilla infantry/cavalry)
 a_giantsborn_footmen: "Spear Wall"
 a_giantsborn_footmen_desc: "The mountain houses of Takyon do not march often, and never lightly. When their horns answer a ruler's call, the valleys fill with iron-bound shields, mail dragging over stone, and spears carried like ship masts over the heads of smaller men. This is the Giantsborn war: a spear wall of oath-bound kin, slow to form and slower to break."
 a_giantsborn_archers: "Pass Archers"
 a_giantsborn_archers_desc: "Giantsborn bows are built for hands that could split a lesser stave. The men who carry them are not skirmishers. They stand the slopes and passes, loosing shafts the size of javelins, then fall in behind the spear wall when the enemy closes."
 a_giantsborn_footmen_levy: "Oath Levy"
 a_giantsborn_footmen_levy_desc: "$a_giantsborn_footmen_desc$"
 a_giantsborn_feudal_levy: "Hall Levy"
 a_giantsborn_feudal_levy_desc: "When the halls empty, laborers and peasants come with whatever they can lift. They eat like soldiers and move like men carrying their own doors. The spear wall is made of such people, only less drilled."
 a_giantsborn_horsemen: "Burdened Horse"
 a_giantsborn_horsemen_desc: "A Giantsborn in the saddle is a bad bargain. Ordinary mounts founder under the weight; the better ones still panic at a rider who sits like a loaded wagon. They arrive late, in thin files, and they do not turn a flank so much as blunder into one."
 a_giantsborn_armored_horsemen: "Mail Riders"
 a_giantsborn_armored_horsemen_desc: "Heavy horse among the mountain houses means a man in iron on a beast already failing. The charge starts well enough and dies in the last fifty yards, when the mount breaks stride or the rider's mail drags him half out of the seat. They are kept because a court without cavalry looks poor, not because anyone trusts them."

 a_giantsborn_men_at_arms: "Ironbound"
 a_giantsborn_men_at_arms_desc: "Plate and half-plate cut for chests that would crush a human harness. The Ironbound hold the center as their fathers held it: shields rimmed in iron, spears like ship masts, a wall that does not hurry and does not give."
 a_giantsborn_crossbowmen: "Wall Crossbows"
 a_giantsborn_crossbowmen_desc: "Crossbows large enough to need a Giantsborn's draw. They stand the wall's intervals and shoot for the gaps, too heavy for the quick work lesser peoples expect of light foot."
 a_giantsborn_handgonners: "Hall Gonners"
 a_giantsborn_handgonners_desc: "The first powder weapons in Giantsborn hands are slow, loud, and hungry. A man this size does not dart with a handgonne. He plants it, fires it, and waits, while the spear wall takes the shock."
 a_giantsborn_men_at_arms_levy: "Ironbound Levy"
 a_giantsborn_men_at_arms_levy_desc: "$a_giantsborn_men_at_arms_desc$"
 a_giantsborn_peasant_levy: "Kin Levy"
 a_giantsborn_peasant_levy_desc: "Wartime drafts from the halls and high pastures. They eat the stores down and they do not run well, but they stand."
 a_giantsborn_cavalrymen: "Foundering Horse"
 a_giantsborn_cavalrymen_desc: "Better saddles have not solved the problem. The horses still founder. The files still arrive late and thin. Giantsborn cavalry of this age is an expensive way to be in the wrong place."
 a_giantsborn_heavy_cavalrymen: "Plate Riders"
 a_giantsborn_heavy_cavalrymen_desc: "A Giantsborn in full plate on horseback is a disaster with a banner. The mount goes first; the charge follows, late and ragged. Commanders who like winning keep these men on their feet."

 a_giantsborn_early_arquebusiers: "Early Shot"
 a_giantsborn_early_arquebusiers_desc: "Matchlock companies of the mountain houses. The guns are large, the men larger, and the line still prefers a slope and a spear at its shoulder."
 a_giantsborn_halberdiers: "Halberd Wall"
 a_giantsborn_halberdiers_desc: "The spear wall learns a shorter, heavier language. Halberds in Giantsborn hands break horse and foot alike, if the horse has not already broken itself on the approach."
 a_giantsborn_matchlock_levy: "Matchlock Levy"
 a_giantsborn_matchlock_levy_desc: "Levy infantry issued matchlocks for massed volleys. They still eat like the spear wall and they still prefer ground that climbs."
 a_giantsborn_light_lancers: "Thin Lances"
 a_giantsborn_light_lancers_desc: "Light lancers in name. In practice, riders whose mounts cannot carry a proper shock. They screen because someone must, and they do it badly."
 a_giantsborn_lancers: "House Lancers"
 a_giantsborn_lancers_desc: "The mountain houses still try the heavy lance. The weight is wrong, the timing is wrong, and the charge that should split a line arrives as a handful of exhausted men on dying horses."

 a_giantsborn_arquebusiers: "Shot Line"
 a_giantsborn_arquebusiers_desc: "Arquebusiers of the Giantsborn, formed for volley and recovery. They are still big men with guns, not hunters. The wall remains the army; this is only its fire."
 a_giantsborn_pikemen: "Pike Wall"
 a_giantsborn_pikemen_desc: "Pikes cut to Giantsborn reach, a forest that smaller cavalry cannot look at without flinching. The old spear wall, lengthened and drilled, still eats like a siege."
 a_giantsborn_flintlock_levy: "Flintlock Levy"
 a_giantsborn_flintlock_levy_desc: "Levy infantry armed with flintlocks. Slow to form, costly to feed, and stubborn on a hillside."
 a_giantsborn_pistoleers: "Pistol Horse"
 a_giantsborn_pistoleers_desc: "Pistols do not make a Giantsborn rider any lighter. The caracole is a theory; what happens is a late, thin pass and a great deal of wasted powder."
 a_giantsborn_heavy_lancers: "Heavy Lances"
 a_giantsborn_heavy_lancers_desc: "Reformation plate and a longer spear have not taught the horses to carry what they cannot carry. The charge is a hope. The infantry is the plan."

 a_giantsborn_hunters: "Ridge Hunters"
 a_giantsborn_hunters_desc: "Riflemen of the high country, still too large and too hungry to skirmish as other peoples do. They shoot from the ridges their kindred have always owned, then give the ground back to the musket wall."
 a_giantsborn_musketeers: "Musket Wall"
 a_giantsborn_musketeers_desc: "Linear musket infantry with the old habit of standing. Giantsborn musketeers do not dance. They load, they fire, they hold the slope, and they eat the magazine empty."
 a_giantsborn_militiamen: "House Militia"
 a_giantsborn_militiamen_desc: "Local militia mustered with muskets when the mountain houses are pressed. They stand the passes they were born on and they do not hurry to leave them."
 a_giantsborn_hussars: "Thin Hussars"
 a_giantsborn_hussars_desc: "Hussar dress on men who break horses. The raids they are meant for happen at a walk, if they happen at all. Frost and Fire field them the same, and neither pretends the experiment works."
 a_giantsborn_gallop_cavalry: "Gallopers"
 a_giantsborn_gallop_cavalry_desc: "The gallop charge of a Giantsborn heavy horse is a short-lived thing. Mounts fail in the last stretch; the survivors arrive without a flank and without a future in this trade."

 a_giantsborn_sharpshooters: "Ridge Marksmen"
 a_giantsborn_sharpshooters_desc: "Selected shots from the passes, armed with rifles and the patience of people who have always fought uphill. They are still Giantsborn: slow to move, costly to feed, and unwilling to pretend they are scouts."
 a_giantsborn_fusiliers: "Fusilier Wall"
 a_giantsborn_fusiliers_desc: "The last heavy foot of the mountain houses. Fusiliers in Giantsborn measure, a wall of fire and iron that still prefers hills to open ground and still cannot be hurried."
 a_giantsborn_grenadiers: "Oath Grenadiers"
 a_giantsborn_grenadiers_desc: "Chosen for size they already had. They throw what would be a siege-stone in a smaller man's hands, and they take the breach the way their grandfathers took a pass: slowly, and without giving it back."
 a_giantsborn_conscripts: "Conscripts"
 a_giantsborn_conscripts_desc: "Mass levies raised when the halls can no longer pick and choose. They eat the stores and they hold the line they are given."
 a_giantsborn_light_dragoons: "Light Dragoons"
 a_giantsborn_light_dragoons_desc: "Mounted infantry of a people who should not ride. They dismount as soon as they can. The horses are glad of it."
 a_giantsborn_cuirassiers: "Cuirass Riders"
 a_giantsborn_cuirassiers_desc: "Cuirassiers in the mountain style: too heavy for the horse, too late for the shock, too proud to admit the spear wall was always the army. They look like cavalry. They fight like a mistake."
