 a_moran_early_arquebusiers: "Early Arcubusierii"
 a_moran_early_arquebusiers_desc: "The arquebus is the first weapon in the Eternal Empire's arsenal that no living Moran ever held. The pilum and gladius they learned in breath. The plate and halberd were strange but adjacent, heavier iron, longer hafts, the same body remembered in different proportions. The gun has no ancestor.\n\nYet, they are very good at it. The arquebus rewards patience, indifference to fear, willingness to stand in rank while the man beside you is unmade and to fire on the same beat regardless. The living arquebusier is a man performing fine motor work in smoke and noise; he flinches, he fumbles, he breaks. The Moran arquebusier loads at the same cadence under cavalry charge as in the parade yard. He does not flinch because he cannot. He does not fumble because he has done this ten thousand times. He breaks only when his bones do."
 
