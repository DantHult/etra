 a_elven_early_longbowmen: "Elven Warbows"
 a_elven_early_longbowmen_desc: "The yew warbow gained prominence during the Sorrowmarch campaigns when elven archers discovered that the longer draw, enabled by their lankier frames and the simple fact that they had decades to build the necessary muscle memory, could punch bodkin points through plate at ranges that shocked everyone involved, including the archers. The bows are miserable to use: they require a pull weight that leaves your shoulders aching for days when you're learning, and even experienced bowmen develop a characteristic lean to their draw-side. But they work, and now every levy from Caer Sídhil to the Thornwood marks trains with them, badly, once a week after church."

 a_elven_longbowmen: "Elven Longbowmen"
 a_elven_longbowmen_desc: "Longbowmen aren't simply archers with bigger bows, they're the ones who survived twenty years of training without ruining their shoulders or getting bored enough to quit. The warbow demands a specific kind of patience: you spend your youth learning to draw, your middle years learning to aim while drawn, and your later years learning to do both while some bastard is charging at you with a poleaxe. Most washouts happen around year seven, when people realize they're dedicating their entire adolescence to becoming very good at one specific thing. Those who remain form the spine of elven archery companies, distinguished less by supernatural grace than by the calluses on their fingers and the fact that they can put six arrows in the air before the first one lands."

 a_elven_late_longbowmen: "Reformed Elven Longbowmen"
 a_elven_late_longbowmen_desc: "The reforms were mostly about admitting that individual heroism is less useful than disciplined volleys. Operating in timed rotations, first rank draws while second rank looses while third rank nocks, creating a rhythm of falling arrows that doesn't stop until someone calls halt or the ammunition runs out. Small changes in quiver placement, standardized arrow fletching, and captains who actually understand geometry mean the arrows now fall where they're supposed to instead of wherever the gods feel like putting them. It's not revolutionary, just the culmination of several generations figuring out that coordination beats enthusiasm. Heavy cavalry still breaks through sometimes, but they have to eat considerably more arrows doing it."

 a_a331_gloom_stalker: "Early Gloom Stalker"
 a_a331_gloom_stalker_desc: "In the black galleries beneath Auerine, Darothari scouts learned to fight where sunlight never reaches and sound carries strangely. The Gloom Stalkers move through cavern networks with chalked routes and whispered signals, loosing barbed shafts from shadowed alcoves before melting back into the dark. Surface armies stumble in the underdark; these archers were raised in it."

 a_a331_gloom_stalker_2: "Gloom Stalker"
 a_a331_gloom_stalker_2_desc: "Veteran Gloom Stalkers no longer merely hide—they choreograph the battlefield. Matron-captains map echoing chambers like concert halls, positioning volleys to pin enemies in chokepoints while sister-bands flank through forgotten crawlways. Their warbows are shorter than surface longbows, tuned for cramped galleries rather than open fields."

 a_a331_gloom_stalker_3: "Reformed Gloom Stalker"
 a_a331_gloom_stalker_3_desc: "The elite cadres of the deep web drill in timed rotations adapted to subterranean warfare: one rank holds a junction, the next sweeps a side tunnel, the third covers retreat through fungus-lit passages. Standardized fletching, poisoned bodkins, and captains who read stone acoustics as other commanders read wind have turned the underdark into Vexvec's killing ground."

 a_a331_gloom_stalker_4: "Exalted Gloom Stalker"
 a_a331_gloom_stalker_4_desc: "Handgonners and matchlocks found their way into the deep holds, wrapped in oiled cloth against cave damp. Gloom Stalkers now seed intersections with smoke and muzzle flash, turning familiar tunnels into disorienting kill-boxes for invaders who still think in terms of horizons and daylight."

 a_a331_gloom_stalker_5: "Guard Gloom Stalker"
 a_a331_gloom_stalker_5_desc: "Flintlock marksmen of the coven web pick off officers at tunnel mouths and collapse morale long before melee is joined. Trained to fight by lantern-glow and muzzle-spark alone, they treat the underdark not as a handicap but as a weapon no surface army can match."

 a_a331_gloom_stalker_6: "Imperial Gloom Stalker"
 a_a331_gloom_stalker_6_desc: "The finest Gloom Stalkers carry rifled arms forged for the deep realms—long-range pieces whose report echoes through galleries like thunder underground. Operating in small independent pickets, they screen the main host through cavern networks where every shot can start an ambush and every shadow might hold a matron's chosen killer."

 a_a332_winged_dragoons: "Winged Dragoons"
 a_a332_winged_dragoons_desc: "$a_a332_winged_dragoon_desc$"
 a_a332_late_winged_dragoons: "Late Winged Dragoons"
 a_a332_late_winged_dragoons_desc: "$a_a332_winged_dragoon_desc$"
 a_a332_winged_dragoon_desc: "Dressed in characteristic wings and donning illustrious armor, these dragoons are a force to be reckoned with when it comes to their powerful charges, dealing immense damage and shattering the enemy's morale."

 a_lutin_bladesinger: "Bladesinger"
 a_lutin_bladesinger_desc: "Soldiers trained in the elven art of blade-singing. As they sing their war-songs, their weapons take flight, directed by pitch, tempo, and intensity."
 
