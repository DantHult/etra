 # Static modifiers
 STATIC_MODIFIER_NAME_etra_rtr_factional_strife: "Factional Strife"
 STATIC_MODIFIER_DESC_etra_rtr_factional_strife: "Court factions in [GetCountry('A378').GetName] undermine central authority, the bureaucracy, and the army."
 STATIC_MODIFIER_NAME_etra_rtr_administration_in_disarray: "Administration in Disarray"
 STATIC_MODIFIER_DESC_etra_rtr_administration_in_disarray: "Even if the open conflicts within [GetCountry('A378').GetName] settle, administrative dysfunction will linger for years."
 STATIC_MODIFIER_NAME_etra_rtr_propaganda: "Red Brotherhood Propaganda"
 STATIC_MODIFIER_DESC_etra_rtr_propaganda: "Millenarian agitators circulate among the peasantry, promising the end of the reigning dynasty."
 STATIC_MODIFIER_NAME_etra_rtr_flood_works: "Flood Works"
 STATIC_MODIFIER_DESC_etra_rtr_flood_works: "Vast labor drafts are being spent to restore flooded river courses across Iborros."
 STATIC_MODIFIER_NAME_etra_rtr_loss_of_confidence_in_army: "Loss of Confidence in the Army"
 STATIC_MODIFIER_DESC_etra_rtr_loss_of_confidence_in_army: "A humiliating skirmish has shaken faith in imperial arms."
 STATIC_MODIFIER_NAME_etra_rtr_disrupted_waterways: "Disrupted Waterways"
 STATIC_MODIFIER_DESC_etra_rtr_disrupted_waterways: "Flooded rivers and broken inland routes have cut food and trade links across the empire."
 STATIC_MODIFIER_NAME_etra_rtr_catastrophic_rain: "Catastrophic Rains"
 STATIC_MODIFIER_DESC_etra_rtr_catastrophic_rain: "Relentless rains have ruined local harvests and driven the peasantry toward revolt."

 flavor_A378.30.title: "Catastrophic Rains in [target_province.GetNameWithNoTooltip]"
 flavor_A378.30.entry: "Catastrophic Rains and the Iborric Waterways"
 flavor_A378.30.desc: "A series of catastrophic weather events has struck [target_province.GetName], causing widespread devastation and suffering. That alone is a calamity, but the downpour has swollen the great inland waterways of [ShowRegionName('iboros_region')], flooding fields and severing the arteries that feed [location:etra1159.GetName].\n\nThough this damage can theoretically be repaired, it would come at a significant cost which we cannot easily bear in our current state. But can [ROOT.GetCountry.GetName] survive with its rivers in ruin?"
 flavor_A378.30.a: "Tragedy has struck our nation."

 flavor_A378.122.title: "Flood Management"
 flavor_A378.122.desc: "The recent catastrophic rains have broken the courses of several major rivers in [ShowRegionName('iboros_region')]. Flooding has brought misery and death, and worse still disrupted the inland routes that supply [location:etra1159.GetName] with food from the wider empire. Our ministers propose assembling a vast labor force to restore the rivers to their proper beds."
 flavor_A378.122.a: "We shall work on the project ceaselessly."
 flavor_A378.122.b: "Such a project is too costly for us."

 flavor_A378.123.title: "River Works Disrupted"
 flavor_A378.123.desc: "A vile agitator has been spreading wicked propaganda among the laborers drafted to restore the flooded rivers. As per our records, the character in question is [target_character.GetName], a Manyfold zealot who prophesies the imminent downfall of the [ROOT.GetCountry.GetName] dynasty. We believe his followers buried a one-eyed stone idol along the works so that the diggers would uncover it—inscribed with a curse spelling the end of imperial rule.\n\nThough our forces did their best to stop this upstart from drawing workers away, many defected. As of now, we are not sure of the whereabouts of this chieftain of unrest."
 flavor_A378.123.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_A378.123.a.entry: "$common_string_curses$"

 flavor_A378.124.title: "Flood Works Complete"
 flavor_A378.124.desc: "After months of restless labor—and despite the work of messianic charlatans—the laborers enlisted for the flood works have finally completed their assignment. This should alleviate some of the unrest and misery in the heart of the [GetInternationalOrganizationType('iboric_mandate').GetName]."
 flavor_A378.124.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_A378.124.a.entry: "$common_string_brilliant$"

 flavor_A378.125.title: "The Case of [target_character.GetNameWithNoTooltip]"
 flavor_A378.125.entry: "The Case of the Red Brotherhood Agitator"
 flavor_A378.125.desc: "[target_character.GetName] is a vicious dissident operating near [location:etra1008.GetName]. [target_character.GetHeShe|U] claims a sacred right to rule and is a vivid agitator of millenarian Manyfold sects. During the flood works, [target_character.GetHeShe] garnered many supporters among the laborers, disrupting the process all the while.\n\nRecently we have received intel on the exact whereabouts of [target_character.GetNameWithNoTooltip], giving us the chance to finally arrest this public enemy. However, such a move could provoke a bold reaction from [target_character.GetHerHis] fervent red-turbaned supporters."
 flavor_A378.125.a: "We must make the arrest."
 flavor_A378.125.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_A378.125.b.entry: "$common_string_nothing_we_can_do_about_it$"

 flavor_A378.126.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Army Humiliated"
 flavor_A378.126.entry: "$flavor_A378.126.title$"
 flavor_A378.126.desc: "Recently, one of our armies has gotten into a bout with a local rebel band. Their provocative action forced our forces into an unfavorable skirmish, where our troops suffered a disastrous defeat. Enemies of the throne already trumpet this as proof that the imperial army is rotting from within. Their foolish arrogance will be their downfall."
 flavor_A378.126.a: "Our army is not falling apart—yours is!"
