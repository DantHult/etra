 ########################
 # Laws (HRE free city – already customized)
 ########################
 free_city_rights_law: "Free City Rights"
 free_city_rights_law_desc: "Obtaining the status of a [ShowSpecialStatusName('free_city')] is not easy. This exclusive title must be conferred by the [GetUniqueInternationalOrganization('hre').GetLeaderTitle]."
 german_free_cities_only_policy: "Only Torrenter or Adrainic Free Cities"
 german_free_cities_only_policy_desc: "The [GetUniqueInternationalOrganization('hre').GetName] is first and foremost [ShowCultureGroupName('torrenter_group')] and [ShowCultureGroupName('ardrainic_group')], and the privilege of a [ShowSpecialStatusName('free_city')] reflects this reality."
 german_free_cities_only_policy_at: "Only [ShowCultureGroupName('torrenter_group')] or [ShowCultureGroupName('ardrainic_group')] countries can become a [ShowSpecialStatusName('free_city')]"
 german_and_german_adjacent_free_cities_policy: "Brethren-Cultured Free Cities"
 german_and_german_adjacent_free_cities_policy_desc: "The Commonweal has a long history with the [ShowCultureGroupName('freeholder_group')], [ShowCultureGroupName('armonorian_group')], and [ShowCultureGroupName('sordrenic_group')]. This justifies allowing non-[ShowCultureGroupName('torrenter_group')] or [ShowCultureGroupName('ardrainic_group')] states to receive the desired [ShowSpecialStatusName('free_city')] status."
 german_and_german_adjacent_free_cities_policy_at: "Only countries in the [ShowCultureGroupName('torrenter_group')], [ShowCultureGroupName('ardrainic_group')], [ShowCultureGroupName('sordrenic_group')], or [ShowCultureGroupName('armonorian_group')] [culture_group|e] can become a [ShowSpecialStatusName('free_city')]"
 empire_wide_free_cities_policy: "Indiscriminate Free City Rights"
 empire_wide_free_cities_policy_desc: "The status of a [ShowSpecialStatusName('free_city')] is no longer tied to geography or culture. Every nation who wishes to may petition the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] for this title."
 empire_wide_free_cities_policy_at: "Every member can become a [ShowSpecialStatusName('free_city')]"

 ########################
 # International organization – HRE (keys not in replace_l_english)
 ########################
 archbishop_elector: "Archbishop-Elector"
 archbishop_elector_plural: "Archbishop-Electors"
 archbishop_elector_desc: "The $archbishop_elector$ is a [special_status|e] of the [GetUniqueInternationalOrganization('hre').GetName]. They are capable of voting for the next [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. Only a state with the [ShowGovernmentTypeName('theocracy')] [government_type|e] can assume this [special_status]."
 hre_max_elector: "Max Prince-Electors"
 hre_max_archbishop_elector: "Max Archbishop-Electors"
 hre_rank_upgrade_duchy: "Change rank through the $ask_for_dukedom$ [diplomatic_action|e]"
 imperial_gold_contribution_desc: "The contributions in [gold|e] from the different members of the [GetUniqueInternationalOrganization('hre').GetName]."
 imperial_contribution: "Commonweal Contribution"
 imperial_contribution_desc: "$imperial_gold_contribution_desc$ The gold gets directly transferred to the current [hre_emperor|e], or the previous one if a [regency|e] is active. The amount of contribution demanded increases with higher $imperial_authority$ of the [hre_emperor|e]."
 imperial_contribution_price: "$imperial_contribution$"
 imperial_treasury_contribution: "Commonweal Treasury Contribution"
 imperial_treasury_contribution_desc: "$imperial_gold_contribution_desc$ The gold is saved in the treasury of the [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] for the use of Commonweal [country_interactions|e]. The amount of contribution demanded increases with higher $imperial_authority$ of the [hre_emperor|e]."
 imperial_treasury_contribution_price: "$imperial_treasury_contribution$"
 imperial_army_contribution: "Commonweal Army Contribution"
 imperial_army_contribution_desc: "The contribution in [manpower|e] from the different members of the [GetUniqueInternationalOrganization('hre').GetName]. [ShowLawName('military_contribution')] determines who contributes how many soldiers to the army of the [hre_emperor|e]. The amount of contribution demanded increases with higher $imperial_authority$ of the [hre_emperor|e]."
 imperial_army_contribution_price: "$imperial_army_contribution$"
 foreign_league_hre: "Holy Roman League"
 foreign_league_hre_desc: "A league formed around the capital of [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetName]. Despite the Emperor's best attempts, [ShowRegionName('italy_region')] has always been a contested battleground between outsiders and members of the [GetUniqueInternationalOrganization('hre').GetName]."

 ########################
 # Parliament (HRE issues and agendas)
 ########################
 hre_law_debate: "Commonweal Law Debate"
 hre_law_debate_desc: "The [ShowSpecialStatusName('emperor')] of the [GetUniqueInternationalOrganization('hre').GetName] intends to implement a new law. Now is the opportunity for the Commonweal Estates to negotiate in favor or against the proposal."
 hre_request_additional_military_support: "Commonweal Military Support"
 hre_request_additional_military_support_desc: "The [GetUniqueInternationalOrganization('hre').GetName] is under the threat of foreign invasion. The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] sees itself forced to request the military might of the whole Empire and all its members."
 hre_roman_month: "Roman Month"
 hre_roman_month_desc: "The treasury of the [GetUniqueInternationalOrganization('hre').GetName] has been running dry as of late. The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] requests the finanical support of the members of the Empire to ensure its security."
 hre_roman_month_modifier_effect: "[ShowModifierEffect('pi_hre_increased_imperial_tax_modifier')]"
 hre_demand_internal_peace: "Demand Internal Peace"
 hre_demand_internal_peace_desc: "The authority of the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] is undermined due to internal conflicts within the [GetUniqueInternationalOrganization('hre').GetName]. It is in the Empire's interest to enforce internal peace and stability."
 hre_demand_internal_peace_tt: "Every [member|e] signs a [white_peace|e] in every [war|e] which has another [member] of the [THIS.GetInternationalOrganization.GetName]"
 hre_establish_perpetual_diet: "Establish the Perpetual Senate"
 hre_establish_perpetual_diet_desc: "$perpetual_diet_law_desc$"
 hre_establish_perpetual_diet_tt: "The [parliament_seat|e] of [GetUniqueInternationalOrganization('hre').GetName] becomes the only valid [location|e] to hold the [parliament|e] in."
 hre_force_emperor_to_abdicate: "Force Emperor to Abdicate"
 hre_force_emperor_to_abdicate_desc: "The rule of the [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] has been judged by the [ShowSpecialStatusNamePlural('elector')] as insufficient. The Commonweal Senate has been called to discuss the future of the leadership of the [GetUniqueInternationalOrganization('hre').GetName]."
 pa_hre_lessen_tax_burden: "Lessen Tax Burden"
 pa_hre_lessen_tax_burden_simple: "$pa_hre_lessen_tax_burden$"
 pa_hre_lessen_tax_burden_desc: "We promise to reduce the [ShowPaymentName('imperial_contribution')] obligations they have for their support."
 pa_hre_elevate_prussia_to_kingdom: "Elevate [GetCountry('PRU').GetNameWithNoTooltip] to a [ShowCountryRankNameWithNoTooltip('rank_kingdom')]"
 pa_hre_elevate_prussia_to_kingdom_simple: "Elevate [GetCountry('PRU').GetNameWithNoTooltip]"
 pa_hre_elevate_prussia_to_kingdom_desc: "The monarchs of [GetCountry('PRU').GetName] have always been ambitious in their strife towards power and glory. They formally requested the title of Kings even, though in the end they have to live as 'Kings in [GetCountry('PRU').GetNameWithNoTooltip]'. Elevating this country to a proper [ShowCountryRankName('rank_kingdom')] might gain us the last bit of favor though..."
 pa_hre_elevate_prussia_to_kingdom_tt: "[GetCountry('PRU').GetName] receives an [event|e] about our decision."
 pa_hre_grant_imperial_titles: "Grant Commonweal Titles"
 pa_hre_grant_imperial_titles_simple: "$pa_hre_grant_imperial_titles$"
 pa_hre_grant_imperial_titles_desc: "The $elector_plural$ would greatly appreciate additional titles and prestige from the crown."
 pa_hre_affirmation_of_free_city_rights: "Affirmation of $free_city$ Rights"
 pa_hre_affirmation_of_free_city_rights_desc: "We renew the rights and securities of the $free_city_plural$, ensuring their stability and prosperity within the Empire."
 opinion_hre_pa_supports_free_cities: "Supports the [ShowSpecialStatusNamePluralWithNoTooltip('free_city')]"
 pa_hre_affirmation_of_free_city_rights_tt: "Every independent [ShowSpecialStatusName('free_city')] gains [ShowNamedValue('stability_mild_bonus')|+=2] [stability|e] while every country currently leading a war against them loses [ShowBiasValue('opinion_hre_pa_supports_free_cities')|+] opinion with the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] of the [GetUniqueInternationalOrganization('hre').GetName]."

