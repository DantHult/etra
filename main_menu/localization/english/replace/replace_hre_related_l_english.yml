 IMPERIAL_RELIGION_DESC: "The [imperial_religion] of [InternationalOrganizationsView.GetInternationalOrganization.GetName] is [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('hre_imperial_religion').GetReligion.GetName]. $IMPERIAL_RELIGION_TT$"
 IMPERIAL_RELIGION_GROUP_DESC: "The [imperial_religion] of [InternationalOrganizationsView.GetInternationalOrganization.GetName] is [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('hre_imperial_religion_group').GetReligionGroup.GetName]. $IMPERIAL_RELIGION_TT$"
