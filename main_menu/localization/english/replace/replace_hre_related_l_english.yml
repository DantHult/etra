 free_city: "Free Commonweal City"
 free_city_plural: "Free Commonweal Cities"
 free_imperial_cities: "Free Commonweal Cities"
 free_city_desc: "These are miniscule political entities which are based around a single, populous city. Protected by the [GetUniqueInternationalOrganization('hre').GetLeaderTitle], these cities serve as administrative hubs within the [GetUniqueInternationalOrganization('hre').GetName]."
 imperial_peasant_republic: "Commonweal Peasant Republic"
 imperial_peasant_republic_plural: "Commonweal Peasant Republics"
 imperial_peasant_republic_desc: "Members which have the [ShowGovernmentReformName('peasant_republic_reform')] or a variation of it can assume the [special_status|e] of $imperial_peasant_republic$."
 imperial_prelate: "Commonweal Prelate"
 imperial_prelate_plural: "Commonweal Prelates"
 imperial_prelate_desc: "The $imperial_prelate$ is a [special_status|e] reserved for all members which are a [ShowGovernmentTypeName('theocracy')] without being [ShowSpecialStatusName('archbishop_elector')]."
 imperial_prince: "Commonweal Prince"
 imperial_prince_plural: "Commonweal Princes"
 imperial_prince_desc: "The $imperial_prince_plural$ are all [ShowGovernmentTypeName('monarchy')] [members|e] of the [GetUniqueInternationalOrganization('hre').GetName] which do not enjoy any other [special_status|e]."
 imperial_authority: "Commonweal Authority"
 imperial_authority_desc: "It is a measure of the authority of the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] in the [GetUniqueInternationalOrganization('hre').GetName] and is used for enacting commonweal laws.\n\nHigh $imperial_authority$ affects the following things:\n$BULLET$ Increases [ShowPaymentName('imperial_treasury_contribution')] and [ShowPaymentName('imperial_army_contribution')] from [members|e] of the [GetUniqueInternationalOrganization('hre').GetName].\n$BULLET$ [members|e] of the [GetUniqueInternationalOrganization('hre').GetName] are more likely to vote for [policies|e] proposed by the [hre_emperor|e] in the [GetUniqueInternationalOrganization('hre').GetParliament.GetName]."
