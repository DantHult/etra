 imperial_crown_hre: "Commonweal Crown"
 imperial_crown_hre_desc: "Crafted from 8 golden plates decorated with various precious stones, the $imperial_crown_hre$ has been used as the coronation crown since the days of Otto I."
 imperial_orb_hre: "Commonweal Orb"
 imperial_orb_hre_desc: "The $imperial_orb_hre$ of the Holy Roman Empire displays the emperors divine mandate as the highest monarch of Western Europe."
 coronation_gospel_hre: "Coronation Evangeliar"
 coronation_gospel_hre_desc: "The $coronation_gospel_hre$ contains the entire gospel written in gold and silver ink. The text is illuminated by illustration of the Evangelists. In the same way Charlemagne, during the coronation ceremony the emperor will place his hand on the $coronation_gospel_hre$ and swear his oath."

 ##unsorted
 game_concept_hre_emperor: "The Junilarian"
 game_concept_hre_emperor_desc: "The Junilarian is the [international_organization_leader_short] of the [holy_roman_empire|e]. It is the duty of the Junilarian to protect the [members|e] from external and internal threats."
 game_concept_hre_law_level: "Commonweal Law Level"
 game_concept_hre_law_level_desc: "The law level describes how decentralized versus centralized the specific law for the [holy_roman_empire|e] is. A lower level represents higher power of the [hre_emperor|e] while a higher level represents a decentralized status.\n\nReforms can be only taken at their adjacent level, which means the Emperor cannot select a Level 2 reform if the current law is on a Level 4 reform. Most [laws|e] start at level #Y 3#!."
 game_concept_holy_roman_empire: "Holy Commonweal of Etra"
 game_concept_hre: "HCE"
 game_concept_holy_roman_empire_desc: "The [GetUniqueInternationalOrganization('hre').GetName] is an [international_organization|e] which dominates the political sphere of [ShowRegionName('ardraine_region')], [ShowRegionName('torrent_region')] and partially [ShowRegionName('sordren_region')]. The [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] is an amalgamation of countless [countries|e] of insignificant to medium power who all fall under the protection of their [international_organization_leader_short|e].\n\nThe [GetUniqueInternationalOrganization('hre').GetLeaderTitle] is the head of this organization which gets elected into this position."
 game_concept_hre_electoral_college: "Electoral College"
 game_concept_hre_electoral_college_desc: "The $game_concept_hre_electoral_college$ consists of the [ShowSpecialStatusNamePlural('elector')] of the [GetUniqueInternationalOrganization('hre').GetName].\n\nThe law of the [ShowLawName('golden_bull')] influences the way [ShowSpecialStatusNamePluralWithNoTooltip('elector')] cast their vote due to the following factors:\n- the influence of the [country_rank|e] is established\n- the influence of [opinion|e] is halved\n- the influence of the [great_power_score|e] is quadrupled"
 hre: "Holy Commonweal of Etra"
 hre_desc: "The legacy of The Junilarian lives in the memory of all in [ShowContinentName('europe')]."
 hre_land_ownership: "Commonweal Land"
 hre_land_ownership_desc: "Land owned by the Holy Commonweal of Etra."
 hre_leadership: "Holy Commonweal of Etra"
 hre_leadership_desc: "The Holy Commonweal of Etra leadership and election administration."
 hre_defended_imperial_cities_tt: "If the defender is a [ShowSpecialStatusName('free_city')] and the Commonweal has enacted a policy to protect them"
 hre_leaving_tt: "It is not possible to leave the Commonweal peacefully. Win a war against the [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] and enforce the [ShowPeaceTreatyTypeName('peace_leave_the_hre')] against them!"
 hre_has_eligible_ruler_tt: "Has an eligible [ruler|e]"
 hre_has_eligible_heir_tt: "Has an eligible [heir|e]"
 emperor: "Junilarian"
 emperor_plural: "Junilarians"
 emperor_desc: "The $emperor$ is the glorious and prestigious [international_organization_leader_short|e] of the [GetUniqueInternationalOrganization('hre').GetName]. There can only be one $emperor$, and their word dictates the direction of the Commonweal."
 elector: "Prince-Elector"
 elector_plural: "Prince-Electors"
 elector_desc: "The $elector$ is a [special_status|e] of the [GetUniqueInternationalOrganization('hre').GetName]. Electors are capable of voting for the next [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. Only a state with the [ShowGovernmentTypeName('monarchy')] [government_type|e] can assume this [special_status]."
 IMPERIAL_DIET: "Commonweal Senate"
 IMPERIAL_LAWS: "Commonweal Laws"
 IMPERIAL_LAWS_TITLE: "The Power of the [InternationalOrganizationsView.GetInternationalOrganization.GetLeaderTitle]"
 IMPERIAL_LAWS_DESC: "Certain [policies|e] of the [InternationalOrganizationsView.GetInternationalOrganization.GetNameWithNoTooltip] are improving the political power and influence of the [hre_emperor|e]. Reaching certain levels of these policies will allow the [hre_emperor] to start centralizing the organization into a unified [ShowFormableCountryName('HRE_f')].\n\nCurrent number of policies benefitting the [hre_emperor]: [InternationalOrganizationsView.GetInternationalOrganization.GetModifierValue('hre_emperor_comfort_policies_counter')|Y0]"
 IMPERIAL_LAWS_GOLDEN_BULL_DESC: "The [InternationalOrganizationsView.GetInternationalOrganization.GetNameWithNoTooltip] is in a state of administrative anarchy. [laws|e] and [policies|e] to adjust and amend the nature of the Empire cannot be proposed until the [ShowLawName('golden_bull')] has been codified."
 HRE_EMPROR_TITLE: "Privileges and Duties of the $emperor$"
 HRE_EMPROR_DESC: "The [InternationalOrganizationsView.GetInternationalOrganization.GetNameWithNoTooltip] is led by the [ShowSpecialStatusName('emperor')]. It is the duty of the [ShowSpecialStatusNameWithNoTooltip('emperor')] to protect the members of the Commonweal from foreign threats, maintain internal peace and stability, and ensure religious unity within the Empire.\n\nIn exchange, the [ShowSpecialStatusNameWithNoTooltip('emperor')] gains #Y $imperial_authority$#! which shall be used to propose [laws|e] and [parliament_issues|e] as well as other bonuses to support them."
 HRE_EMPEROR_ACTIONS_TITLE: "The [ShowSpecialStatusNameWithNoTooltip('emperor')] gets access to the following:"
 HRE_EMPEROR_ACTIONS_LIST: "[ShowCountryInteractionName('enforce_landfriede')]\n [ShowCountryInteractionName('enforce_religious_unity')]\n [ShowCountryInteractionName('demand_unlawful_territory')]\n [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')]\n [ShowCountryInteractionName('bolster_imperial_army')]\n\n[ShowCasusBelliName('cb_imperial_ban')]"
 HRE_EMPEROR_CONDITIONS_TITLE: "Only countries which fulfill the following conditions can become [ShowSpecialStatusNameWithNoTooltip('emperor')]:"
