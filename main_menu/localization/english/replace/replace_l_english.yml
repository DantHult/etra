 military_order_reform: "Military Order"
 military_order_reform_desc: "The Military Orders were created in the Middle Ages as a militant body of the Temples. They are made up of warriors, named #italic Templars#!, as well as monks called #italic fratres#! who have taken solemn religious vows to defend and spread the faith."
 clergy_military_orders: "Military Orders"
 clergy_military_orders_desc: "The Military Orders were created after the Crusades began, as a means of fusing the discipline and devotion of monks with the martial skill and experience of knights. They spread throughout Etra, but other religions also developed similar orders when fighting wars of religion."
 
 local_tribal_strongholds: "Tribal Strongholds"
 local_tribal_strongholds_desc: "The many settled tribes across the Amalyarat exert great influence over the locals. To appease them and recognize their authority will help us exert control over our domain with greater ease."
 
 desert_power: "Desert Power"
 desert_power_desc: "The rural Amalyarat is inhabited by countless tribal groups the Tilayah herders of the high plateaus, the Tazzi of the western Great Sand Sea, whose loyalties have decided every dynastic succession since the eleventh century. We govern them not by direct administration but by patronage, marriage alliances, customary justice, and the occasional punitive expedition that reminds them of the central authority. This patron-tribe relationship gives the Amalyarat states a means of projecting power across vast and otherwise ungovernable territory that no Northern-style administrative effort could match."

